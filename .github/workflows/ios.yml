name: ios
on:
  push:
    branches: [master]
    paths: ["ios/**", "content/**", "web/covers/**", "web/voice/**", "web/video/**", "web/brand/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ios, cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-26              # the phone's own system: Xcode 26, an iOS 26 simulator (as TestFlight builds it)
    timeout-minutes: 60
    env:
      SHOTS: ${{ github.workspace }}/../shots
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Tools
        run: brew install xcodegen
      - name: Project
        run: cd ios && xcodegen generate
      - name: Simulators
        run: |
          mkdir -p "$SHOTS"
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          # iOS 26 runtimes only: the system the phones run (an older one hid a gesture bug from the tests)
          rt = sorted([k for k in d if "iOS-26" in k], key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          def find(*names):
              for name in names:
                  for test in (lambda n: n == name, lambda n: n.startswith(name)):
                      for k in reversed(rt):
                          for x in d[k]:
                              if test(x["name"]): return x["udid"]
              return ""
          print("SIM16=" + find("iPhone 17", "iPhone 16"))
          print("SIMSE=" + find("iPhone SE"))      # a small phone, if this Xcode has one on iOS 26 (else skipped)
          EOF
          cat "$GITHUB_ENV"
          grep -q "^SIM16=." "$GITHUB_ENV" || { echo "::error::No iPhone 17/16 simulator on iOS 26"; xcrun simctl list devices available; exit 1; }
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false      # the UI tests type on the phone's own keyboard
          xcrun simctl boot "$SIM16" || true      # the small phone boots later, after the tests (one simulator at a time is much faster)
      - name: Build
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Squeal.xcodeproj -scheme Squeal -destination "id=$SIM16" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$SHOTS/build.log" | grep -E "error:|BUILD|warning: .*(deprecated|never)" | head -120
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Squeal.xcodeproj -scheme Squeal -destination "id=$SIM16" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:SquealTests test-without-building 2>&1 | tee "$SHOTS/tests.log" | grep -E "error|failed|passed|Executed|TEST" | head -200
      # the real app, driven by real touches through its main flows (ios/SquealUITests)
      - name: UI tests
        id: uitests
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Squeal.xcodeproj -scheme Squeal -destination "id=$SIM16" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:SquealUITests test-without-building 2>&1 | tee "$SHOTS/ui-tests.log" | grep -E "error|failed|passed|Executed|TEST" | head -200
      - name: Screenshots
        run: |
          APP=ios/build/Build/Products/Debug-iphonesimulator/Squeal.app
          shoot() {  # device-udid device-name shot-name wait args...
            local udid=$1 dev=$2 name=$3 wait=$4; shift 4
            xcrun simctl terminate "$udid" app.squeal.Squeal 2>/dev/null || true
            xcrun simctl launch "$udid" app.squeal.Squeal -reset 1 -demo 1 -still 1 "$@" >/dev/null
            sleep "$wait"
            xcrun simctl io "$udid" screenshot "$SHOTS/$dev-$name.png" >/dev/null 2>&1
          }
          for pair in "$SIM16:iphone16" "$SIMSE:iphonese"; do
            udid=${pair%%:*}; dev=${pair##*:}
            [ -n "$udid" ] || continue
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b >/dev/null
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            xcrun simctl install "$udid" "$APP"
            # both phones: one of each screen (the same states ios/tools/web-shots.js takes of the web prototype)
            shoot "$udid" $dev home 3 -lang en
            shoot "$udid" $dev preview-multi 5 -lang en -preview nobodys-home
            shoot "$udid" $dev fav 4 -lang en -tab fav -favs clown,the-doctor,two-knocks
            shoot "$udid" $dev search 4 -lang en -tab search
            shoot "$udid" $dev menu-lang-ru 3 -lang ru -tab menu -menu lang
            shoot "$udid" $dev chat-mid 11 -lang en -chat nobodys-home -part 0 -pos 22 -autotap 3
            if [ "$dev" = iphone16 ]; then      # the big phone: every state
              shoot "$udid" $dev home-ru 4 -lang ru
              shoot "$udid" $dev preview-interactive 3 -lang en -preview two-knocks
              shoot "$udid" $dev fav-ru 4 -lang ru -tab fav -favs clown,the-doctor,two-knocks,frenemy
              shoot "$udid" $dev fav-empty 5 -lang ru -tab fav -favs none
              shoot "$udid" $dev search-ru 4 -lang ru -tab search -fear 5
              shoot "$udid" $dev search-level1 4 -lang en -tab search -fear 1
              shoot "$udid" $dev search-typed 4 -lang en -tab search -query the
              shoot "$udid" $dev search-typed-ru 4 -lang ru -tab search -query дом
              shoot "$udid" $dev search-none 4 -lang en -tab search -query xyzzy
              shoot "$udid" $dev menu 3 -lang en -tab menu
              shoot "$udid" $dev menu-sub-off 2 -lang en -tab menu -menutap 0
              shoot "$udid" $dev home-pull 4 -lang en -pull 120
              shoot "$udid" $dev home-reel 5 -lang en -reel 100
              shoot "$udid" $dev home-reel-ru 5 -lang ru -reel 60
              shoot "$udid" $dev chat-choice-ru 5 -lang ru -chat two-knocks -pos 16 -path start
              shoot "$udid" $dev chat-ending 5 -lang en -chat two-knocks -pos 37 -path start,stay,hide
              shoot "$udid" $dev chat-paywall-ru 5 -lang ru -chat nobodys-home -part 0 -pos 8 -premium 0 -taps 0
              shoot "$udid" $dev chat-switch 8 -lang en -chat nobodys-home -part 0 -pos 22,9 -autopart 1
            fi
            # every slider title in en and ru: only when run by hand (Actions → ios → Run workflow)
            if [ "$dev" = iphone16 ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then
              for p in 0 1 2 3 4 5; do shoot "$udid" $dev letterings-en-$p 3 -lang en -letterings $p; shoot "$udid" $dev letterings-ru-$p 3 -lang ru -letterings $p; done
            fi
            xcrun simctl shutdown "$udid" || true
          done
          ls -la "$SHOTS"
      - name: Publish screenshots to the ci-shots branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          SHA=$(git rev-parse --short HEAD)
          grep -E "error:" "$SHOTS/build.log" > "$SHOTS/build-errors.txt" 2>/dev/null || true
          grep -E "error|failed|passed|Executed" "$SHOTS/tests.log" > "$SHOTS/tests.txt" 2>/dev/null || true
          grep -E "error|failed|passed|Executed|Assert|never|still there" "$SHOTS/ui-tests.log" > "$SHOTS/ui-tests.txt" 2>/dev/null || true
          rm -f "$SHOTS/build.log" "$SHOTS/tests.log" "$SHOTS/ui-tests.log"
          git switch --orphan tmp-shots
          git rm -rfq . 2>/dev/null || true
          mkdir -p "$SHA" && cp "$SHOTS"/* "$SHA"/ 2>/dev/null || true
          git add "$SHA" && git commit -qm "shots $SHA" && git push -f origin HEAD:ci-shots
      - name: Fail if unit tests or UI tests failed
        if: steps.tests.outcome == 'failure' || steps.uitests.outcome == 'failure'
        run: exit 1
