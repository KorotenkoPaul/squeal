# Adds the account holder as an internal TestFlight tester (group "Me", sees every build), so the owner
# gets the invitation e-mail without clicking through App Store Connect. MANUAL ONLY. Uses the same
# App Store Connect API key secrets as testflight.yml. Prints no e-mail addresses or keys.
name: testers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'app.squeal.Squeal' }}
    steps:
      - run: pip install --quiet pyjwt cryptography requests
      - name: Add the account holder to the internal group
        shell: python
        run: |
          import os, time, jwt, requests, base64, sys
          key = os.environ["ASC_KEY_P8"]
          if "BEGIN PRIVATE KEY" not in key:
              key = base64.b64decode(key).decode()
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {tok}", "Content-Type": "application/json"}
          API = "https://api.appstoreconnect.apple.com/v1"
          def call(method, path, **kw):
              r = requests.request(method, API + path, headers=H, timeout=60, **kw)
              if r.status_code >= 400:
                  print(f"{method} {path.split('?')[0]} -> {r.status_code}: {r.text[:600]}")
              return r
          apps = call("GET", f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}").json()["data"]
          if not apps: sys.exit("No app with this bundle id in App Store Connect")
          app = apps[0]["id"]; print("app found:", apps[0]["attributes"]["name"])
          groups = call("GET", f"/apps/{app}/betaGroups?limit=200").json()["data"]
          g = next((x for x in groups if x["attributes"].get("isInternalGroup")), None)
          if g:
              gid = g["id"]; print("internal group exists:", g["attributes"]["name"])
          else:
              r = call("POST", "/betaGroups", json={"data": {"type": "betaGroups",
                  "attributes": {"name": "Me", "isInternalGroup": True, "hasAccessToAllBuilds": True},
                  "relationships": {"app": {"data": {"type": "apps", "id": app}}}}})
              r.raise_for_status(); gid = r.json()["data"]["id"]; print("internal group created: Me")
          users = call("GET", "/users?limit=200").json()["data"]
          holder = next((u for u in users if "ACCOUNT_HOLDER" in (u["attributes"].get("roles") or [])), None)
          if not holder: sys.exit("No account holder among the team's users")
          a = holder["attributes"]
          r = call("POST", "/betaTesters", json={"data": {"type": "betaTesters",
              "attributes": {"email": a["username"], "firstName": a.get("firstName") or "", "lastName": a.get("lastName") or ""},
              "relationships": {"betaGroups": {"data": [{"type": "betaGroups", "id": gid}]}}}})
          if r.status_code == 409:
              t = call("GET", "/betaTesters", params={"filter[email]": a["username"]}).json()["data"]
              if not t: sys.exit("Tester exists but could not be found")
              call("POST", f"/betaGroups/{gid}/relationships/betaTesters",
                   json={"data": [{"type": "betaTesters", "id": t[0]["id"]}]}).raise_for_status()
              tid = t[0]["id"]
          else:
              r.raise_for_status(); tid = r.json()["data"]["id"]
          print("account holder is a tester in the group")
          builds = call("GET", f"/builds?filter[app]={app}&sort=-uploadedDate&limit=1").json()["data"]
          if builds:
              b = builds[0]["id"]
              call("POST", f"/betaGroups/{gid}/relationships/builds", json={"data": [{"type": "builds", "id": b}]})
              r = call("POST", "/betaTesterInvitations", json={"data": {"type": "betaTesterInvitations", "relationships": {
                  "app": {"data": {"type": "apps", "id": app}}, "betaTester": {"data": {"type": "betaTesters", "id": tid}}}}})
              print("invitation sent" if r.status_code < 400 else "invitation not re-sent (see above)")
          print("done")
