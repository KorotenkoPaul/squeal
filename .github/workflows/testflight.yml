# Sends a build of the iPhone app to TestFlight. MANUAL ONLY: GitHub → Actions → testflight → Run workflow.
# It never runs by itself. Everything it needs from Apple is read from this repository's secrets
# (Settings → Secrets and variables → Actions); nothing secret is in the repository. Steps for the owner: ios/TESTFLIGHT.md.
#
# NOT YET RUN (written 2026-11-23, before there was an Apple developer account). The first run may need small fixes:
# see "Если что-то пошло не так" in ios/TESTFLIGHT.md.
#
# How it signs, with no Mac and no certificate files: the app is archived unsigned, then `xcodebuild -exportArchive`
# signs it with a certificate Apple keeps in the cloud for the team ("cloud-managed distribution certificate") and
# uploads it, authenticated by the App Store Connect API key. Nothing is created by hand; no device has to be
# registered.
name: testflight
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version testers see (1.0, 1.1, …). The build number is set by itself."
        required: true
        default: "1.0"
permissions:
  contents: read
concurrency: { group: testflight, cancel-in-progress: false }
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}           # App Store Connect API key: its Key ID (10 characters)
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}     # … its Issuer ID (a long id with dashes)
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}           # … the whole text of the downloaded AuthKey_XXXXXXXXXX.p8 file
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}     # the developer team's id (10 characters)
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'app.squeal.Squeal' }}   # optional repository VARIABLE, if another bundle id was registered
      VERSION: ${{ inputs.version }}
    steps:
      - name: Only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run this workflow from the master branch."
          exit 1
      - name: Secrets are there
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see ios/TESTFLIGHT.md)"
            exit 1
          fi
          case "$VERSION" in
            ''|*[!0-9.]*) echo "::error::The version must be numbers and dots, like 1.0"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Project
        run: cd ios && xcodegen generate
      - name: The API key, as a file for this run only
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          # the secret is the file's own text; a base64 copy of the file is accepted too
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8 is not the text of a .p8 key file"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Unit tests (the build that goes to testers must be a green one)
        run: |
          set -o pipefail
          cd ios
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone 16')))")
          xcodebuild -project Squeal.xcodeproj -scheme Squeal -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:SquealTests test 2>&1 | grep -E "error|failed|Executed|TEST" | tail -40
      - name: Archive
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Squeal.xcodeproj -scheme Squeal -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Squeal.xcarchive" -derivedDataPath build-release \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | grep -E "error:|warning: .*(deprecated)|ARCHIVE|BUILD" | tail -60
          test -d "$RUNNER_TEMP/Squeal.xcarchive/Products/Applications/Squeal.app"
      - name: Sign and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Squeal.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | grep -v -i "private key" | tail -60
          echo "Uploaded version $VERSION, build $GITHUB_RUN_NUMBER. It shows in App Store Connect → TestFlight in 5–20 minutes."
      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
