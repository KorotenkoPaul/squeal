  sheet.addEventListener("touchmove", e => move(e.touches[0].clientY, e), { passive: false });
  sheet.addEventListener("touchend", end); sheet.addEventListener("touchcancel", end);
  sheet.addEventListener("mousedown", e => start(e.clientY));
  sheet.addEventListener("mousemove", e => move(e.clientY, e));
  sheet.addEventListener("mouseup", end); sheet.addEventListener("mouseleave", end);
}

/* What the tab underneath shows about a story; if it did not change, the tab is left untouched. */
const sig = s => tab === "fav" ? JSON.stringify([favs(), progress(s)]) : tab === "home" ? JSON.stringify([favs(), store.get("p:" + s.id, null)]) : "";

/* Re-render the tab underneath without losing its scroll position. */
function refresh() {
  const view = document.getElementById("view"), slider = document.getElementById("slider");
  const y = view ? view.scrollTop : 0, x = slider ? slider.scrollLeft : 0;
  render();
  const v2 = document.getElementById("view"), s2 = document.getElementById("slider");
  if (v2) v2.scrollTop = y; if (s2) s2.scrollLeft = x;
}

function render() { cancelAnimationFrame(slideTimer); ({ menu, home, fav: favourites, search }[tab] || home)(); }

/* ---------- Chat: slides in from the right over the sheet, slides back out. ---------- */
let timer = null;
function openStory(id, epIndex) {
  const s = STORIES.find(x => x.id === id);
  store.set("recent", [id, ...store.get("recent", []).filter(x => x !== id)].slice(0, 3));
  countRead(id);
  const pr = prog(s), N = s.episodes.length, len = k => s.episodes[k].messages.length;
  let k0 = epIndex;
  if (k0 == null) {                                   // carry on: the current part, or the next unfinished one
    k0 = pr.ep; while (k0 < N - 1 && pr.pos[k0] >= len(k0)) k0++;
    if (pr.pos.every((n, k) => n >= len(k))) { pr.pos = pr.pos.map(() => 0); k0 = 0; }   // all read: from the top
  }                                                   // a finished part opened on purpose shows whole, still marked read
  pr.ep = k0; setProg(s, pr);
  let st = { ep: k0, i: pr.pos[k0] };
  const ep = s.episodes[st.ep];
  const prev = layer.querySelector(".screen"); prev?.remove();
  const scr = document.createElement("section");
  scr.className = "screen"; Object.assign(scr.style, { left: appRect().left + "px", width: appRect().width + "px" });
  scr.innerHTML = `<section class="chat">
      <div class="head"><button class="back" id="back" aria-label="Back">‹</button><div class="avatar">${esc(ep.left[0])}</div>
        <div class="who"><b>${esc(ep.left)}</b><small id="status">online</small></div>
        ${s.episodes.length > 1 ? `<div class="ep-seg" role="tablist" aria-label="Parts"><span class="ep-ind" style="transform:translateX(${st.ep * 34}px)"></span>${s.episodes.map((e, k) => `<button role="tab" data-ep="${k}" aria-selected="${k === st.ep}" aria-label="Part ${k + 1}">${k + 1}</button>`).join("")}</div>` : ""}</div>
      <div class="log" id="log" aria-live="polite"><div class="intro">${esc(ep.description || s.description)}</div></div>
      <div class="foot" id="foot"></div></section>`;
  layer.appendChild(scr);
  if (scr.animate && !reduce()) scr.animate([prev ? { opacity: 0 } : { transform: "translateX(100%)" }, prev ? { opacity: 1 } : { transform: "none" }], { duration: prev ? 200 : 340, easing: EASE });
  const log = scr.querySelector("#log"), foot = scr.querySelector("#foot"), status = scr.querySelector("#status");
  /* back: same as the swipe: the chat slides away right and you land where you opened the story */
  scr.querySelector("#back").onclick = () => {
    clearTimeout(timer);
    const finish = () => { scr.remove(); const sh = layer.querySelector(".sheet"); if (sh) { sh.style.visibility = ""; closeSheet(sh); } };
    const sh = layer.querySelector(".sheet"); if (sh) sh.style.visibility = "hidden";
    if (!scr.animate || reduce()) return finish();
    scr.animate([{ transform: "none" }, { transform: "translateX(100%)" }], { duration: 300, easing: "cubic-bezier(.32,.72,0,1)", fill: "forwards" }).onfinish = finish;
  };
  /* part switch: the lit disc glides to the tapped number, then that part opens */
  scr.querySelectorAll(".ep-seg [data-ep]").forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const k = +btn.dataset.ep;
    if (k === st.ep) return;
    clearTimeout(timer);
    scr.querySelectorAll(".ep-seg [data-ep]").forEach(x => x.setAttribute("aria-selected", x === btn));
    scr.querySelector(".ep-ind").style.transform = `translateX(${k * 34}px)`;
    setTimeout(() => openStory(id, k), reduce() ? 0 : 260);
  });
  const add = m => { const d = document.createElement("div"); d.className = "msg " + (m.from === ep.right ? "me" : "them"); d.textContent = m.text; log.appendChild(d); };
  for (let k = 0; k < st.i; k++) add(ep.messages[k]);
  log.scrollTop = log.scrollHeight;
  requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });    // land on the last message read
  let busy = false;
  const save = () => { const p = prog(s); p.ep = st.ep; p.pos[st.ep] = st.i; setProg(s, p); };
  /* the hint stays still; only after 10 s with no tap does it start to breathe */
  let idleT = null;
  const nudge = () => { clearTimeout(idleT); foot.classList.remove("idle"); idleT = setTimeout(() => { if (scr.isConnected) foot.classList.add("idle"); }, 10000); };
  scr.addEventListener("pointerdown", nudge);
  function controls() {
    if (st.i >= ep.messages.length) {
      const last = st.ep + 1 >= s.episodes.length;
      log.insertAdjacentHTML("beforeend", `<div class="end"><strong>${last ? "The End" : "To be continued…"}</strong><span>${esc(s.title)}${s.episodes.length > 1 ? " · part " + (st.ep + 1) : ""}</span></div>`);
      log.scrollTop = log.scrollHeight;
      foot.classList.remove("hint"); foot.onclick = null;
      foot.innerHTML = `${last ? "" : `<button class="tap primary" id="next">Next part</button>`}<button class="tap" id="again">${last ? "Read again" : "Restart"}</button>`;
      const next = foot.querySelector("#next");
      if (next) next.onclick = () => openStory(id, st.ep + 1);
      foot.querySelector("#again").onclick = () => {
        const p = prog(s);
        if (last) { p.pos = p.pos.map(() => 0); p.ep = 0; } else p.pos[st.ep] = 0;   // the end: whole story again; else this part
        setProg(s, p); openStory(id, last ? 0 : st.ep);
      };
      return;
    }
    foot.classList.add("hint");
    foot.innerHTML = `<span class="cont">Tap to continue</span>`;
    foot.onclick = step;
    nudge();
  }
  function step() {
    if (busy || st.i >= ep.messages.length) return;
    const m = ep.messages[st.i];
    if (m.from === ep.right) { add(m); st.i++; save(); log.scrollTop = log.scrollHeight; return controls(); }
    busy = true; status.textContent = "typing…";
    const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(t); log.scrollTop = log.scrollHeight;
    const delay = reduce() ? 150 : Math.min(1800, 450 + m.text.length * 22);
    timer = setTimeout(() => { t.remove(); add(m); st.i++; save(); status.textContent = "online"; busy = false; log.scrollTop = log.scrollHeight; controls(); }, delay);
  }
  log.onclick = e => { if (scr._dragged) { scr._dragged = false; return; } step(); };
  controls();
  swipeBack(scr);
}

/* Messenger-style swipe back: drag the chat to the right; it follows the finger and, let go far enough
   (or with a flick), slides away and drops you on the screen you opened the story from (the story
   page under it closes too). The page behind is shown while you drag. */
function swipeBack(scr) {
  let x0 = null, y0 = 0, dx = 0, locked = false, lastX = 0, lastT = 0, vx = 0;
  const W = () => scr.offsetWidth;
  const sheetOf = () => layer.querySelector(".sheet");
  const setX = x => { scr.style.transform = x ? `translateX(${x}px)` : ""; };
  const start = (x, y) => { if (scr._leaving) return; x0 = x; y0 = y; dx = 0; locked = false; vx = 0; lastX = x; lastT = performance.now(); };
  const move = (x, y, e) => {
    if (x0 == null) return;
    const ddx = x - x0, ddy = y - y0;
    if (!locked) {
      if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
      if (ddx <= 0 || Math.abs(ddy) > Math.abs(ddx)) { x0 = null; return; }      // vertical scroll or leftwards: not ours
      locked = true; scr._dragged = true; clearTimeout(timer);
      const sh = sheetOf(); if (sh) sh.style.visibility = "hidden";             // show the screen you came from
      scr.style.transition = "none";
    }
    if (e.cancelable) e.preventDefault();
    const now = performance.now(); vx = .7 * vx + .3 * (x - lastX) / Math.max(1, now - lastT); lastX = x; lastT = now;
    dx = Math.max(0, ddx); setX(dx);
  };
  const end = () => {
    if (x0 == null) return; x0 = null;
    if (!locked) return;
    const go = dx > W() * .35 || vx > .5;
    scr.style.transition = "transform .3s cubic-bezier(.32,.72,0,1)";
    if (!go) { setX(0); const sh = sheetOf(); setTimeout(() => { if (sh) sh.style.visibility = ""; scr.style.transition = ""; }, 300); return; }
    scr._leaving = true; setX(W());
    setTimeout(() => {
      scr.remove();
      const sh = sheetOf(); if (sh) { sh.style.visibility = ""; closeSheet(sh); }
    }, 300);
  };
  scr.addEventListener("touchstart", e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  scr.addEventListener("touchmove", e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  scr.addEventListener("touchend", end); scr.addEventListener("touchcancel", end);
  scr.addEventListener("mousedown", e => start(e.clientX, e.clientY));
  scr.addEventListener("mousemove", e => move(e.clientX, e.clientY, e));
  scr.addEventListener("mouseup", end); scr.addEventListener("mouseleave", end);
}

render();
</script>
