<title>Squeal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<!-- slider titles: each story's name is drawn in its own lettering -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Big+Shoulders+Display:wght@800&family=Caveat:wght@700&family=Cinzel:wght@600&family=Cormorant+SC:wght@500&family=DM+Serif+Display:ital@1&family=IM+Fell+English:ital@1&family=Major+Mono+Display&family=Monoton&family=Pinyon+Script&family=Playfair+Display:ital,wght@1,500&family=Rubik+Distressed&family=Rubik+Wet+Paint&family=Special+Elite&display=swap">
<style>
/* Layout: the original 2018 Squeal design — indigo night, four tabs (menu, home, favourites, search) and a full-screen chat reader. */
:root {
  --bg: #26243f;          /* indigo night, from the original mockups */
  --deep: #17122c;        /* card shade behind covers */
  --tabbar: #1f1d36;
  --field: #34315a;       /* search field, chips */
  --text: #ffffff;
  --muted: #9b97b3;       /* lavender captions */
  --accent: #7b57c9;      /* favourite heart, active states */
  --danger: #b5525b;      /* remove */
  --red: #b5525b;         /* "red" in Squeal: the pale red of the owl's eyes (blood fill, remove) */
  --them: #36335a;
  --me: #6a4bb8;
  --font: "Avenir Next", Avenir, "Nunito Sans", -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; }
.view { flex: 1; overflow-y: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior-y: contain; }
.label { color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }

/* Tab bar */
.tabs { position: relative; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--tabbar);
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.tabs button { display: grid; place-items: center; padding: 6px; color: #6f6b8c; }
.tabs button[aria-current="page"] { color: var(--text); }
.tabs svg { width: 26px; height: 26px; }

/* Covers: drawn scenes, one per story */
.cover { position: absolute; inset: 0; width: 100%; height: 100%; }
img.cover { object-fit: cover; object-position: center 35%; filter: saturate(.85) brightness(.9); }
.row-card .face img.cover { left: 40%; width: 60%; }

/* Home */
/* the slider runs edge to edge of the screen, so whole cards slide out left and the next comes in
   from the right, whether you swipe or it turns by itself (it used to clip inside a rounded frame) */
.slider { flex: none; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: max(18px, env(safe-area-inset-left, 0px)); scrollbar-width: none;
  margin-inline: calc(-1 * max(18px, env(safe-area-inset-left, 0px))); padding-inline: max(18px, env(safe-area-inset-left, 0px));
  scroll-padding-inline: max(18px, env(safe-area-inset-left, 0px)); }
.slider::-webkit-scrollbar { display: none; }
.slider .hero { flex: 0 0 100%; scroll-snap-align: center; }
/* Slider dots: a "worm". The active pill stretches its head to the next dot as the slide moves,
   then pulls its tail after it; inside, a bright fill runs out the time to the next slide. */
.dots { flex: none; position: relative; display: flex; justify-content: center; gap: 10px; height: 6px; margin-top: -2px; }
.dots i { flex: none; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #4a4670; }
.dots .worm { position: absolute; top: 0; left: 0; z-index: 1; height: 6px; border-radius: 3px; background: #5d5888;
  overflow: hidden; will-change: transform, width; }
.dots .worm b { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 3px; transform-origin: left;
  background: linear-gradient(90deg, #b9a3ff, #fff); box-shadow: 0 0 10px rgba(185,163,255,.65); transform: scaleX(0); }
.preview { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); overscroll-behavior-y: contain; transform-origin: 50% 0; }
.pull { position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: rgba(255,255,255,.35); z-index: 2; }
.pv-cover { position: relative; min-height: 260px; display: flex; align-items: flex-end; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); }
.pv-cover .shade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 4%, rgba(38,36,63,0) 70%); }
.pv-cover .back { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; padding: 0 0 3px; }
/* the round buttons over the photo: no padding (iPhone gives buttons some by default, which pushed the
   icons off centre), each icon an SVG centred in its circle */
.chrome .back.rb { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); color: #fff; }
.chrome .back.rb svg { width: 16px; height: 16px; }
.head .back { padding: 0; display: grid; place-items: center; line-height: 0; }
.chrome .rb, .chrome .reset, .chrome .like { padding: 0; display: grid; place-items: center; line-height: 0; }
.chrome .like svg { transform: translateY(-.5px); }
.pv-cover .like, .chrome .like { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; color: var(--muted); }
.pv-cover .like[aria-pressed="true"], .chrome .like[aria-pressed="true"] { color: var(--text); background: var(--accent); }
.pv-cover .like svg, .chrome .like svg { width: 18px; height: 18px; }
.sheet .cap small { display: flex; align-items: center; line-height: 1; }
.cap small .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; margin: 0 9px; opacity: .7; flex: none; transform: translateY(-.5px); }
/* start over: tap clears the part being read; hold (a ring fills round the button) clears every part */
.chrome .reset { position: absolute; top: 10px; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 46px); width: 38px; height: 38px;
  border-radius: 50%; background: rgba(23,18,44,.6); color: var(--muted); display: grid; place-items: center; touch-action: none; -webkit-user-select: none; user-select: none; }
.chrome .reset svg { width: 17px; height: 17px; transition: transform .45s cubic-bezier(.32,.72,0,1); }
.chrome .reset .hold { position: absolute; inset: 0; width: 38px; height: 38px; transform: rotate(-90deg); fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round;
  stroke-dasharray: 110; stroke-dashoffset: 110; opacity: 0; }
.chrome .reset.holding .hold { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .6s linear, opacity .1s; }
.chrome .reset.spin svg:not(.hold) { transform: rotate(-360deg); }
.chrome .note { position: absolute; top: 56px; right: max(12px, env(safe-area-inset-right, 0px)); padding: 8px 13px; border-radius: 12px;
  background: rgba(23,18,44,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--text); font-size: 13px; font-weight: 600;
  white-space: nowrap; transform-origin: top right; animation: noteIn .3s cubic-bezier(.32,.72,0,1) both; }
.chrome .note.out { animation: noteOut .25s ease-in both; }
@keyframes noteIn { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes noteOut { to { opacity: 0; transform: translateY(-4px); } }
.pv-cover div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.pv-cover small { color: var(--muted); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.pv-cover h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.1; text-wrap: balance; }
.pv-body > * { animation: up .5s cubic-bezier(.2,.9,.2,1) both; }
.pv-body > *:nth-child(2) { animation-delay: .06s } .pv-body > *:nth-child(3) { animation-delay: .12s } .pv-body > *:nth-child(n+4) { animation-delay: .18s }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
.pv-body { padding: 4px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--field); border-radius: 12px; padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.desc { margin: 0; line-height: 1.55; color: #dcd9ea; max-width: 60ch; }
.by { color: var(--muted); font-size: 14px; }
.parts { display: flex; flex-direction: column; gap: 8px; }
.part { display: flex; justify-content: space-between; align-items: center; background: var(--field); border-radius: 12px; padding: 12px 14px; text-align: left; }
.part small { color: var(--muted); }
.read { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 16px; border-radius: 14px; background: var(--accent); font-weight: 700; font-size: 17px; }
.read::before { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.16); transform-origin: left; transform: scaleX(var(--f, 0)); }
.read svg, .read span { position: relative; } .read svg { width: 16px; height: 16px; }
.part { position: relative; overflow: hidden; }
.part > * { position: relative; }
/* water: the part fills from the bottom up to how much of it is read. Two waves, each one drawn
   path made of several sines (no tiles, so no cuts between crests), roll against each other with a
   faint light on the crest, then the surface settles flat and still. (Blood and fog: see git.) */
.part .water, .tfill .water { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
.part .water i, .tfill .water i { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--f, 0) * 100%); background: #554a8a;
  animation: rise 1s cubic-bezier(.25,.8,.25,1) both; }
.part .water svg, .tfill .water svg { position: absolute; left: 0; bottom: calc(100% - 1px); width: 200%; height: 8px; transform-origin: 50% 100%; overflow: visible; }
.part .water .w1, .tfill .water .w1 { z-index: 1; animation: roll 2.2s linear 2, settle 2.4s cubic-bezier(.4,0,.2,1) 1.9s forwards; }
.part .water .w1 .body, .tfill .water .w1 .body { fill: #554a8a; }
.part .water .w1 .crest, .tfill .water .w1 .crest { fill: none; stroke: rgba(214,204,255,.45); stroke-width: .5; vector-effect: non-scaling-stroke; }
.part .water .w2, .tfill .water .w2 { height: 10px; animation: roll2 3.1s linear 2, settle 2.2s cubic-bezier(.4,0,.2,1) 1.7s forwards; }
.part .water .w2 path, .tfill .water .w2 path { fill: #463d78; }
.part.done .water svg { display: none; }
@keyframes rise { from { height: 0; } }
@keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes roll2 { from { transform: translateX(-50%); } to { transform: translateX(0); } }
@keyframes settle { to { scale: 1 0; opacity: .0; } }        /* the surface goes flat and still */
@media (prefers-reduced-motion: reduce) { .part .water i, .part .water svg { animation: none; } .part .water svg { display: none; } }
.part.here::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px #9b7ff0; pointer-events: none; }   /* above the water */
.part { transition: box-shadow .2s, transform .15s; }
.part:active { transform: scale(.97); }
.part .ok { font-style: normal; color: #b9a3ff; font-size: 12px; }
.demo { color: #6f6b8c; font-size: 11px; text-align: center; }
.hero { position: relative; border-radius: 14px; overflow: hidden; min-height: 190px; background: var(--deep); text-align: left; display: flex; align-items: flex-end; padding: 18px; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,18,44,.95) 10%, rgba(23,18,44,0) 75%); }
.hero div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.hero b { font-size: 26px; font-weight: 600; text-wrap: balance; }
/* slider: the title is lettering, not a label; no rating, genre or time */
.hero b.art { font-weight: 400; line-height: 1.05; text-shadow: 0 2px 12px rgba(0,0,0,.6); white-space: nowrap; }
.hero .lt { position: absolute; display: block; }           /* lettering block, placed per story */
.hero .lt span, .hero .lt i { display: inline-block; font-style: inherit; }
.hero small { color: var(--muted); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.chips { flex: none; display: flex; gap: 8px; overflow-x: auto; }
.chip { flex: none; padding: 7px 16px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--text); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; aspect-ratio: 1 / 1.15; border-radius: 14px; overflow: hidden; background: var(--deep); text-align: left; display: flex; align-items: flex-end; padding: 12px; }
.tile .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,18,44,.96) 15%, rgba(23,18,44,.05) 70%); }
.tile div { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile b { font-size: 17px; font-weight: 600; line-height: 1.2; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 11px; color: var(--muted); background: rgba(52,49,90,.85); padding: 3px 8px; border-radius: 999px; }
.tile .fav { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.tile .fav svg { width: 14px; height: 14px; }
.tile .fav.pop { animation: favPop .34s cubic-bezier(.3,1.6,.5,1) both; }
.tile .fav.out { animation: favOut .2s ease-in both; }
.tile .fav { cursor: pointer; }
.pill.pad { display: inline-grid; place-items: center; padding-inline: 8px; }
.pill.pad svg { width: 17px; height: 17px; display: block; }
.padmark { display: inline-flex; vertical-align: -.22em; }
.padmark svg { width: 1.3em; height: 1.3em; }
/* interactive chat: when it's your turn, your possible replies stand in for "Tap to continue" */
.foot.choose { flex-direction: column; gap: 8px; }
.choice { width: 100%; text-align: left; padding: 12px 14px; border-radius: 16px; border: 1.5px solid #9b7ff0; color: var(--text); font-size: 15px; line-height: 1.3; background: transparent; }
.choice:active { background: rgba(123,87,201,.25); }
.foot.choose .ask { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-align: center; margin-bottom: 2px; }
/* end of an interactive story: small buttons back to each turning point of the path just read */
.foot.ended { flex-wrap: wrap; }
.turns { flex: 1 0 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 2px; }
.turns span { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; }
.turn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px 7px 10px; border-radius: 999px; border: 1.5px solid #9b7ff0; color: var(--text); font-weight: 700; font-size: 14px; }
.turn svg { width: 14px; height: 14px; }
.turn:active { background: rgba(123,87,201,.25); }
.end em { display: block; font-style: normal; color: var(--muted); font-size: 13px; margin-top: 2px; }
.tile .fav::after { content: ""; position: absolute; inset: -10px; }   /* a finger-sized target around the small badge */
@keyframes favPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes favOut { to { transform: scale(0); opacity: 0; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 6px); } }
.grid.swap .tile { animation: up .32s cubic-bezier(.25,.8,.25,1) both; }
.hint { color: var(--muted); font-size: 13px; text-align: center; }

/* Favourites */
.row-card { position: relative; border-radius: 14px; overflow: visible; touch-action: pan-y; }   /* the whole card slides, not its picture inside a frame */
.row-card .remove { position: absolute; inset: 0 0 0 auto; width: 0; padding: 0; visibility: hidden; background: var(--danger); color: var(--text); font-weight: 600; border-radius: 14px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
.row-card .remove span { display: block; flex: none; }
.row-card.snap .face, .row-card.snap .remove, .row-card.snap .remove span { transition: transform .34s cubic-bezier(.32,.72,0,1), width .34s cubic-bezier(.32,.72,0,1), opacity .2s; }
.row-card.gone { transition: height .26s ease, margin .26s ease, opacity .2s; overflow: hidden; }
.row-card .face { position: relative; display: flex; align-items: center; min-height: 110px; padding: 20px; background: var(--deep); border-radius: 14px; width: 100%; text-align: left; overflow: hidden; will-change: transform; }
.row-card .face svg.cover { left: 40%; width: 60%; }
.row-card .face .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--deep) 42%, rgba(23,18,44,0) 85%); }
.row-card .face div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.row-card b { font-size: 24px; font-weight: 600; }
.row-card small { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }

/* Search */
.search { display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 12px; padding: 10px 12px; color: var(--muted); }
.search svg { width: 18px; height: 18px; flex: none; }
.search input { flex: 1; min-width: 0; color: var(--text); outline: none; }
.search { transition: box-shadow .2s; }
.search:focus-within { box-shadow: 0 0 0 1.5px #9b7ff0; }
/* the search field stays put at the top; the dial and the stories scroll away underneath it */
.sbar { position: sticky; top: -18px; z-index: 3; margin-top: -18px; padding-top: 18px; padding-bottom: 6px; background: var(--bg); }
.sbar { display: flex; align-items: center; gap: 0; }
.sbar .search { flex: 1; min-width: 0; }
.sbar input::-webkit-search-cancel-button { display: none; }
/* Cancel: slides in beside the field while searching; one tap clears the text, drops the keyboard,
   and brings the fear dial back */
.s-cancel { flex: none; max-width: 0; overflow: hidden; opacity: 0; white-space: nowrap; color: #b9a3ff; font-size: 16px; font-weight: 600;
  transition: max-width .28s cubic-bezier(.32,.72,0,1), opacity .2s, margin .28s cubic-bezier(.32,.72,0,1); }
.sbar.active .s-cancel { max-width: 90px; opacity: 1; margin-left: 12px; }
.sbar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; background: linear-gradient(var(--bg), rgba(38,36,63,0)); pointer-events: none; }
.search input::placeholder { color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { display: flex; align-items: center; gap: 14px; text-align: left; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex: none; background: var(--deep); }
.item div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item b { font-size: 18px; font-weight: 600; }
.item small { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
/* Fear dial: a half-round gauge; drag along it or tap a mark, the needle swings, the arc warms from violet
   to red, and the stories of that fear level appear below. It fades away while you type a search. */
.fear { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 6px; transition: opacity .25s, transform .25s; }
.fear.gone { opacity: 0; transform: translateY(-8px); pointer-events: none; }
.fear.out { display: none; }
.fear svg { width: min(290px, 100%); height: auto; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
.fear svg:focus { outline: none; }
.fear .needle { transform-origin: 120px 124px; transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.fear.drag .needle { transition: none; }
.fear .mark { cursor: pointer; }
.fear-name { font-size: 22px; font-weight: 800; letter-spacing: .02em; transition: color .3s; margin-top: -6px; }
.fear-sub { color: var(--muted); font-size: 13px; }
#results { display: flex; flex-direction: column; gap: 14px; }

/* Menu */
/* Menu: plain white words, centred, evenly spaced. Nothing else. */
.view.menu { justify-content: center; align-items: center; gap: 44px; padding-block: 24px; }
.m-row.sub { color: var(--red); }                                /* Subscription in the app's red */
.m-row { flex: none; padding: 4px 16px; font-size: 20px; font-weight: 600; color: #fff; transition: opacity .15s; }
.m-row:active { opacity: .5; }

/* Empty states */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding-block: 40px; }
.empty svg { width: 150px; height: 150px; }
.empty b { font-size: 20px; }
.empty span { color: var(--muted); }
.empty > * { animation: emptyIn .6s cubic-bezier(.25,.8,.25,1) both; }
.empty > :nth-child(2) { animation-delay: .1s; }
/* the picture acts out adding a favourite: all four squares the same; one is held, it grows a little,

function toggleFav(id) {
  const f = favs(), on = f.includes(id);
  store.set("favs", on ? f.filter(x => x !== id) : [...f, id]);
}
function longPress(el, fn) {
  let t, fired = false, x0 = 0, y0 = 0;
  el.addEventListener("pointerdown", e => { fired = false; x0 = e.clientX; y0 = e.clientY; t = setTimeout(() => { fired = true; fn(); }, 380); });
  el.addEventListener("pointermove", e => { if (Math.hypot(e.clientX - x0, e.clientY - y0) > 8) clearTimeout(t); });   // a drag is not a long press
  ["pointerup", "pointerleave", "pointercancel"].forEach(e => el.addEventListener(e, () => clearTimeout(t)));
  el.addEventListener("contextmenu", e => e.preventDefault());
  return () => fired;
}

function shell(content) {
  app.innerHTML = `<main class="view ${tab === "menu" ? "menu" : ""}" id="view">${content}</main>
    <nav class="tabs" aria-label="Sections">${[["home", "Stories"], ["fav", "Favourites"], ["search", "Search"], ["menu", "Menu"]].map(([k, n]) =>
      `<button id="tab-${k}" data-tab="${k}" aria-label="${n}" ${tab === k ? 'aria-current="page"' : ""}>${ICON[k === "fav" ? "heart" : k]}</button>`).join("")}</nav>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; store.set("tab", tab); render(); });
}

/* Progress on a cover: a thin line along the bottom that fills as you read the story (all parts together) */
function tileProgress(s) {
  const f = progress(s) / 100;
  if (!(f > 0)) return "";
  return `<span class="bar" style="--f:${Math.max(.03, f).toFixed(3)}" aria-label="${f >= 1 ? "Read" : Math.round(f * 100) + "% read"}"><i></i></span>`;
}
/* after reading: every progress line on the page catches up with what was saved, in place */
function syncBars(root = document) {
  root.querySelectorAll("[data-id]").forEach(el => {
    const host = el.matches(".tile") ? el : el.querySelector(".thumb, .face");
    if (!host) return;
    const s = STORIES.find(x => x.id === el.dataset.id); if (!s) return;
    const old = host.querySelector(":scope > .bar"), html = tileProgress(s);
    if (old && html && old.outerHTML.includes(html.match(/--f:[\d.]+/)[0])) return;
    if (old && html) { old.style.setProperty("--f", html.match(/--f:([\d.]+)/)[1]); old.classList.add("still"); old.querySelector("i").style.transition = "transform .6s cubic-bezier(.25,.8,.25,1)"; return; }
    old?.remove();
    if (html) host.insertAdjacentHTML("beforeend", html);
  });
}
function tilesHTML(list, f) {
  return list.map(s => `<button class="tile" id="t-${s.id}" data-id="${s.id}">${cover(s)}<span class="shade"></span>${tileProgress(s)}
      ${f.includes(s.id) ? `<span class="fav">${ICON.heart}</span>` : ""}
      <div><b>${esc(s.title)}</b><span class="pills"><span class="pill">${GENRES[s.genre]}</span><span class="pill">${readMin(s)}</span>${padPill(s)}</span></div></button>`).join("");
}
/* tap opens; hold toggles favourite, and the tile's heart pops in or shrinks away in place */
const centre = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

function wireCards(root) {
  root.querySelectorAll("[data-id]").forEach(b => {
    const pressed = longPress(b, () => {
      toggleFav(b.dataset.id);
      const on = favs().includes(b.dataset.id);
      b.classList.remove("pressing");
      favBeat(b, on);
      document.querySelectorAll(`.tile[data-id="${b.dataset.id}"]`).forEach(t => {
        const h = t.querySelector(".fav");
        if (!on && h) heartOut(h, t === b);
        if (on && !h && t !== b) t.insertAdjacentHTML("beforeend", `<span class="fav pop">${ICON.heart}</span>`);
      });
    });
    /* the card sinks a little while the finger holds it */
    b.addEventListener("pointerdown", () => b.classList.add("pressing"));
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => b.classList.remove("pressing")));
    b.onclick = () => { if (!pressed()) preview(b.dataset.id); };
  });
}

/* Liked: the card swells clearly and settles back; the heart badge bursts into its corner (overshoots,
   wobbles, settles). Unliked: the card swells a little and the badge shrinks away. */
function favBeat(card, on) {
  const tile = card.matches(".tile");
  if (on && tile && !card.querySelector(".fav")) card.insertAdjacentHTML("beforeend", `<span class="fav">${ICON.heart}</span>`);
  if (reduce() || !card.animate) return;
  card.animate([{ transform: "scale(.96)" }, { transform: `scale(${on ? 1.08 : 1.03})`, offset: .4 }, { transform: "none" }], { duration: 480, easing: "cubic-bezier(.3,1.2,.5,1)" });
  const h = tile && on ? card.querySelector(".fav") : null;
  h?.animate([
    { transform: "scale(0) rotate(-30deg)", opacity: 0 },
    { transform: "scale(1.5) rotate(12deg)", opacity: 1, offset: .35 },
    { transform: "scale(.85) rotate(-6deg)", offset: .6 },
    { transform: "scale(1.1) rotate(2deg)", offset: .8 },
    { transform: "none" },
  ], { duration: 560, easing: "ease-out" });
}
/* Unliked: the badge goes the way it came, backwards: a small swell and twist, then it shrinks away.
   big = after a long press on the card (fuller); otherwise a quick, quiet exit. */
function heartOut(h, big) {
  if (h._going) return; h._going = true;
  if (reduce() || !h.animate) return h.remove();
  h.animate(big ? [
    { transform: "none", opacity: 1 },
    { transform: "scale(1.35) rotate(10deg)", opacity: 1, offset: .35 },
    { transform: "scale(0) rotate(-30deg)", opacity: 0 },
  ] : [
    { transform: "none", opacity: 1 },
    { transform: "scale(1.15)", opacity: 1, offset: .3 },
    { transform: "scale(0)", opacity: 0 },
  ], { duration: big ? 460 : 280, easing: "ease-in", fill: "forwards" }).onfinish = () => h.remove();
}
/* a tap on the heart badge itself unlikes the story; the card stays still and does not open */
document.addEventListener("pointerdown", e => { if (e.target.closest?.(".tile .fav")) e.stopPropagation(); }, true);
document.addEventListener("click", e => {
  const h = e.target.closest?.(".tile .fav"); if (!h) return;
  e.stopPropagation(); e.preventDefault();
  const id = h.closest(".tile").dataset.id;
  if (favs().includes(id)) toggleFav(id);
  document.querySelectorAll(`.tile[data-id="${id}"] .fav`).forEach(x => heartOut(x, false));
}, true);
/* home after a like/unlike elsewhere: only the hearts change, each with its own small animation */
function syncHearts() {
  syncBars();
  const f = favs();
  document.querySelectorAll(".tile[data-id]").forEach(t => {
    const h = t.querySelector(".fav"), on = f.includes(t.dataset.id);
    if (on && !h) t.insertAdjacentHTML("beforeend", `<span class="fav pop">${ICON.heart}</span>`);
    if (!on && h) { h.classList.add("out"); setTimeout(() => h.remove(), 200); }
  });
}

/* Fetch fresh stories. The preview has them built in, so this only waits like a short network call;
   in the app it is the real request. */
function reloadStories() { return new Promise(r => setTimeout(r, 300 + Math.random() * 300)); }

/* Swap the home page's content in place while it is pulled down; the eyes above are not touched. */
function refreshHome(view) {
  cancelAnimationFrame(slideTimer);
  view.innerHTML = homeContent();
  view.classList.remove("refreshed"); void view.offsetWidth; view.classList.add("refreshed");
  setTimeout(() => view.classList.remove("refreshed"), 700);
  wireHome();
}

function home() {
  shell(homeContent());
  wireHome();
  pullToRefresh();
  pullForRandom();
}

function homeContent() {
  const list = STORIES.filter(s => genre === "all" || s.genre === genre), f = favs(), TOP = topOfWeek();
  const heroHTML = h => { const L = LETTERING[h.id];
    const art = L ? `<span class="lt" style="${L.box}"><b class="art" style="${L.css}">${L.html ? L.html(esc(h.title)) : esc(h.title)}</b></span>` : `<div><b>${esc(h.title)}</b></div>`;
    return `<button class="hero" id="h-${h.id}" data-id="${h.id}" aria-label="${esc(h.title)}">${cover(h)}<span class="shade"></span>${art}</button>`; };
  return (`<span class="label">Top this week</span>
    <div class="slider" id="slider" aria-label="Top 5 stories this week">${TOP.map(heroHTML).join("")}${heroHTML(TOP[0]).replace('class="hero"', 'class="hero loop" aria-hidden="true" tabindex="-1"').replace(/id="h-[^"]*"/, "")}</div>
    <div class="dots" id="dots" aria-hidden="true">${TOP.map(() => "<i></i>").join("")}<span class="worm"><b></b></span></div>
    <div class="chips" role="group" aria-label="Genre">${Object.entries(GENRES).map(([k, v]) => `<button class="chip" id="g-${k}" data-g="${k}" aria-pressed="${k === genre}">${v}</button>`).join("")}</div>
    <div class="grid" id="grid">${tilesHTML(list, f)}</div>
    <p class="hint pull-hint" id="pull-hint">Pull up for a random story</p>`);
}

function wireHome() {
  /* a genre change swaps only the grid: old tiles fade, new ones rise in; the slider is not touched */
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    if (genre === b.dataset.g) return;
    genre = b.dataset.g;
    app.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.g === genre));
    const grid = document.getElementById("grid");
    grid.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: "ease-in", fill: "forwards" }).onfinish = () => {
      grid.innerHTML = tilesHTML(STORIES.filter(s => genre === "all" || s.genre === genre), favs());
      grid.getAnimations().forEach(a => a.cancel());
      grid.classList.remove("swap"); void grid.offsetWidth; grid.classList.add("swap");
      wireCards(grid);
    };
  });
  wireCards(app);
  startSlider();
}

/* iPhone-style pull to refresh on the home screen: the page follows the finger with resistance,
   the spinner's spokes appear one by one as you pull; let go past the line and the screen reloads. */
/* ---------- Pull to refresh: the owl's eyes ----------
   Pull the page down and the owl's eyes come down from above the screen with it, opening as you pull.
   Let go past the line: they shut once; the page refreshes while they are shut (a slow network just
   keeps them shut longer); they open red and the page goes back up with them still open.
   The brow's shadow lies on the open eye (white or red) and goes away with it when the lid shuts.
   The reload starts as soon as you let go; the eyes keep cycling until it is done, then finish the
   cycle they are in and the page goes back up. */
const lerp = (a, b, t) => a + (b - a) * t;
function tween(ms, ease, step) {
  return new Promise(res => { const t0 = performance.now();
    const f = now => { const t = Math.min(1, (now - t0) / ms); step(ease(t)); t < 1 ? requestAnimationFrame(f) : res(); };
    requestAnimationFrame(f); });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const easeIn = t => t * t, easeOut = t => 1 - (1 - t) * (1 - t);

function owlEyes() {
  /* art: the icon's eyes and the brow's shadow (x 50-974, y 250-730 of the 1024 icon) drawn 360 x 187 */
  const S = 360 / 924, U = (x, y) => [(x - 50) * S, (y - 250) * S];
  const EYES = [{ c: U(236.8, 419.8), rot: 30 }, { c: U(787.2, 419.8), rot: -30 }];
  const RX = 345.6 * S, RY = 243.2 * S, TRAVEL = 307.2 * S;
  const wrap = document.createElement("div"); wrap.className = "ptr"; wrap.setAttribute("aria-hidden", "true");
  wrap.innerHTML = `<svg viewBox="0 0 360 187">
      <defs>
        <mask id="pe-lids" maskUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="267">
          <rect x="-40" y="-40" width="440" height="267" fill="#fff"/>${EYES.map(() => `<ellipse rx="${RX}" ry="${RY}" fill="#000"/>`).join("")}
        </mask>
        <filter id="pe-glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <g mask="url(#pe-lids)">
        <image href="brand/eyes-base.png" width="360" height="187"/>
        <g id="pe-evil" opacity="0">
          <image href="brand/eyes-evil.png" width="360" height="187" filter="url(#pe-glow)" opacity=".85"/>
          <image href="brand/eyes-evil.png" width="360" height="187"/>
        </g>
        <image href="brand/eyes-shadow.png" width="360" height="187"/>
      </g>
    </svg>`;
  const lids = [...wrap.querySelectorAll("#pe-lids ellipse")], evil = wrap.querySelector("#pe-evil");
  /* t = 1 shut, 0 open: each lid is a big tilted ellipse sliding along the eye's slant */
  const setLids = t => lids.forEach((el, i) => {
    const e = EYES[i], n = [-Math.sin(e.rot * Math.PI / 180), Math.cos(e.rot * Math.PI / 180)], D = TRAVEL * (1 - t);
    const x = e.c[0] - n[0] * D, y = e.c[1] - n[1] * D + 8 * S;
    el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("transform", `rotate(${e.rot} ${x} ${y})`);
  });
  setLids(1);
  return {
    el: wrap, setLids,
    async open(from = 1) { await tween(280 * from + 1, easeOut, t => setLids(from * (1 - t))); },
    /* the one blink: shut, stay shut until the page is fresh (it is swapped behind the closed
       eyes), then open red */
    async blink(loaded, onShut) {
      await tween(120, easeIn, setLids);                          // shut…
      await Promise.all([loaded, wait(60)]);                     // …a slow network keeps them shut…
      onShut(); evil.setAttribute("opacity", 1);
      await tween(220, easeOut, t => setLids(1 - t));             // …open, red
    },
    reset() { evil.setAttribute("opacity", 0); setLids(1); },
  };
}

function pullForRandom() {
  const view = document.getElementById("view"), tabs = app.querySelector(".tabs");
  const rnd = document.createElement("div"); rnd.className = "rnd"; rnd.setAttribute("aria-hidden", "true");
  rnd.innerHTML = `<div class="slot"><span class="say"></span><div class="reel"><div class="strip"></div></div></div>`;
  app.appendChild(rnd);
  const slot = rnd.querySelector(".slot"), say = rnd.querySelector(".say"), reel = rnd.querySelector(".reel"), strip = rnd.querySelector(".strip");
  const ROW = 84, LOOPS = 8;
  let y0 = null, d = 0, pick = null, busy = false, list = [], offset = 0, free = 0;
  /* the empty space already under the last card (the hint line, the page's bottom padding) is used
     first, so the page lifts only as much as the reel still needs */
  let lastBottom = 0;
  const measureFree = () => { const cards = [...view.querySelectorAll(".tile")].map(t => t.getBoundingClientRect().bottom);
    lastBottom = cards.length ? Math.max(...cards) : tabs.getBoundingClientRect().top;
    free = Math.max(0, tabs.getBoundingClientRect().top - lastBottom); };
  const LINE = () => view.clientHeight * .5;                      // half a screen of pull
  const atBottom = () => view.scrollTop + view.clientHeight >= view.scrollHeight - 2;
  const deal = () => {
    /* only from the genre you are looking at; a story you haven't started, else one unfinished, else any */
    const shelf = STORIES.filter(s => genre === "all" || s.genre === genre);
    const fresh = shelf.filter(s => !prog(s).pos.some(Boolean));
    const unfinished = shelf.filter(s => prog(s).pos.some(Boolean) && progress(s) < 100);
    const pool = fresh.length ? fresh : unfinished.length ? unfinished : shelf;
    pick = pool[Math.floor(Math.random() * pool.length)];
    list = [...(shelf.length > 2 ? shelf : STORIES)].sort(() => Math.random() - .5);
    const rows = Array.from({ length: LOOPS }, () => list).flat();
    strip.innerHTML = rows.map(s => `<div class="row"><span class="th">${cover(s)}${tileProgress(s)}</span><span class="tx"><b>${esc(s.title)}</b><small>${GENRES[s.genre]} · ${readMin(s)}${padMark(s)}</small></span></div>`).join("");
    offset = 0; setStrip(0);
  };
  const setStrip = o => { const span = list.length * ROW; strip.style.transform = `translateY(${-(((o % span) + span) % span) - span}px)`; };   // rows move up
  const show = raw => {
    const GAP = 16, NEED = GAP + 14 + 10 + 84 + GAP;              // gap + words + gap + reel + gap
    const lift = Math.min(raw, Math.max(0, NEED - free)), k = Math.min(1, raw / LINE());
    rnd.style.setProperty("--tabs-h", (app.clientHeight - tabs.offsetTop) + "px");
    rnd.classList.toggle("on", raw > 0);
    /* the reel sits GAP below the last card (as it is now, lifted) and never lower than GAP above the tabs */
    const rTop = rnd.getBoundingClientRect().top, tabsTop = tabs.getBoundingClientRect().top;
    const top = Math.max(lastBottom - lift + GAP, tabsTop - (NEED - GAP));
    slot.style.setProperty("--top", raw ? (top - rTop) + "px" : "100%");
    const rise = Math.min(1, raw / (NEED * 1.6));                    // 0 = behind the tabs, 1 = fully up
    slot.style.setProperty("--rise", ((1 - rise) * (tabsTop - top)) + "px");
    view.style.transform = raw ? `translateY(${-lift}px)` : "";
    say.textContent = k >= 1 ? "Release for a random story" : "Keep pulling";
    say.style.opacity = Math.max(0, Math.min(1, (rise - .35) / .5)).toFixed(2);   // the words fade in as they come up
    rnd.classList.toggle("ready", k >= 1);
    document.getElementById("pull-hint")?.classList.toggle("hide", raw > 0);
    if (raw) setStrip(offset + raw * .9);                           // the reel turns with your finger
  };
  const start = y => { if (busy || !atBottom()) return; y0 = y; d = 0; view.classList.remove("drop"); view.classList.add("lift"); };
  const move = (y, e) => {
    if (y0 == null) return;
    const raw = y0 - y;
    if (raw <= 0) { if (d) show(d = 0); return; }
    if (!atBottom() && !d) { y0 = null; return; }
    if (e.cancelable) e.preventDefault();
    if (!d) { measureFree(); deal(); }
    d = raw; show(d);
  };
  const end = async () => {
    if (y0 == null) return; y0 = null;
    view.classList.remove("lift");
    if (d < LINE()) {                                              // not far enough: the reel sinks back behind the tabs as the page slides down
      busy = true; const from = d; d = 0;
      await tween(320, easeOut, t => show(Math.max(0, lerp(from, 0, t))));
      show(0); busy = false; return;
    }
    busy = true;
    const eat = e => { e.stopPropagation(); e.preventDefault(); };
    window.addEventListener("click", eat, { capture: true, once: true }); setTimeout(() => window.removeEventListener("click", eat, true), 60);
    say.textContent = "";
    /* spin on, slow down and stop with the chosen story in the window */
    const from = offset + d * .9, span = list.length * ROW, idx = list.indexOf(pick);
    let to = Math.ceil(from / span) * span + idx * ROW + 3 * span;
    await tween(1500, t => 1 - Math.pow(1 - t, 4), t => setStrip(lerp(from, to, t)));
    reel.classList.add("chosen");                                  // the chosen one pops forward a little
    await wait(520);
    preview(pick.id);
    reel.classList.remove("chosen"); view.classList.add("drop"); show(d = 0); busy = false;
  };
  view.addEventListener("touchstart", e => start(e.touches[0].clientY), { passive: true });
  view.addEventListener("touchmove", e => move(e.touches[0].clientY, e), { passive: false });
  view.addEventListener("touchend", end); view.addEventListener("touchcancel", end);
  view.addEventListener("mousedown", e => start(e.clientY));
  window.addEventListener("mousemove", e => move(e.clientY, e)); window.addEventListener("mouseup", end);
}

function pullToRefresh() {
  const view = document.getElementById("view"), LINE = 64, REST = 76;
  app.style.position = "relative";
  const eyes = owlEyes(); app.prepend(eyes.el);
  /* centre the eyes between the top of the screen and the first line of the page ("Top rated")
     as it stands when pulled down: eyes span 13-326 of the art's 480 height, drawn 74 px wide */
  const centreEyes = () => {
    const first = view.firstElementChild, svg = eyes.el.querySelector("svg");
    if (!first) return;
    /* top of the letters themselves: the line box minus the half-leading above the capitals */
    const r = first.getBoundingClientRect(), fs = parseFloat(getComputedStyle(first).fontSize);
    const textTop = r.top - view.getBoundingClientRect().top + (r.height - fs * .7) / 2;
    const artH = svg.getBoundingClientRect().width * 187 / 360, eyeMid = artH * (13 + 326) / 2 / 480;
    svg.style.top = ((REST + textTop) / 2 - eyeMid) + "px";
  };
  view.style.position = "relative"; view.style.zIndex = 1; view.style.background = "var(--bg)";
  let y0 = null, x0 = 0, d = 0, busy = false, locked = false;
  const show = (d, live) => {
    view.style.transform = d ? `translateY(${d}px)` : "";
    const k = Math.min(1, d / LINE);
    eyes.el.style.transform = `translateY(${d - REST}px)`;          // the eyes ride just above the page's top edge
    eyes.el.classList.toggle("settle", !live);
    if (live) eyes.setLids(1 - k * k);                            // the eyes open as you pull
  };
  /* Works from anywhere, the slider too: a mostly-sideways move is left to the slider, a mostly-down one pulls. */
  const start = (x, y) => { if (busy || view.scrollTop > 0) return; centreEyes(); y0 = y; x0 = x; d = 0; locked = false; view.classList.remove("settle"); };
  const move = (x, y, e) => {
    if (y0 == null) return;
    const raw = y - y0;
    if (!locked) {
      if (Math.abs(x - x0) < 6 && Math.abs(raw) < 6) return;
      if (Math.abs(x - x0) > Math.abs(raw) || raw < 0) { y0 = null; return; }
      locked = true;
    }
    if (raw <= 0) { if (d) show(d = 0, true); return; }
    if (view.scrollTop > 0) { y0 = null; return; }
    if (e.cancelable) e.preventDefault();
    d = 150 * (1 - Math.exp(-raw / 170));           // rubber band: easy at first, then stiffer
    show(d, true);
  };
  const end = async () => {
    if (y0 == null) return; y0 = null;
    if (!locked) return;
    const eat = e => { e.stopPropagation(); e.preventDefault(); };   // the pull is not a tap
    window.addEventListener("click", eat, { capture: true, once: true }); setTimeout(() => window.removeEventListener("click", eat, true), 60);
    view.classList.add("settle");
    if (d < LINE) {                                                // not far enough: eyes shut, page glides back
      const from = 1 - Math.min(1, d / LINE) ** 2;
      tween(200, easeOut, t => eyes.setLids(lerp(from, 1, t)));
      show(d = 0); return;
    }
    busy = true;
    const lidNow = 1 - Math.min(1, d / LINE) ** 2;
    show(d = REST);
    /* reload now, in the background of the animation */
    const loaded = reloadStories();
    let from = lidNow;
    /* white eyes, closed eyes, red eyes: nothing else */
    await eyes.open(from);
    await wait(380);
    await eyes.blink(loaded, () => refreshHome(view));
    await wait(500);
    cancelAnimationFrame(slideTimer); startSlider();
    show(0);
    await wait(380);
    eyes.reset();
    busy = false;
  };
  view.addEventListener("touchstart", e => start(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: true });
  view.addEventListener("touchmove", e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  view.addEventListener("touchend", end); view.addEventListener("touchcancel", end);
  view.addEventListener("mousedown", e => start(e.clientX, e.clientY));
  window.onmousemove = e => move(e.clientX, e.clientY, e); window.onmouseup = end;
}

/* Featured slider: swipe by hand or let it turn every 4 s; touching it does not stop it. */
let slideTimer = null;
/* the slider lives its own life: its clock keeps running while you are on other tabs, so coming back
   to Home it is wherever it has got to, not back at the first slide */

/* Search forgives one typo, never more: a title matches if it contains what you typed, or a piece of
   it that is one letter off (one wrong, missing, extra, or two swapped letters). Short queries (under
   3 letters) must match exactly. Exact matches come first. */
const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’'`]/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
function oneEditAway(a, b) {                     // Damerau-Levenshtein distance <= 1
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  if (la === lb) {
    const d = [...a].map((c, i) => c !== b[i] ? i : -1).filter(i => i >= 0);
    return d.length === 1 || (d.length === 2 && d[1] === d[0] + 1 && a[d[0]] === b[d[1]] && a[d[1]] === b[d[0]]);
  }
  const [s1, s2] = la < lb ? [a, b] : [b, a];    // one letter extra in s2
  let i = 0; while (i < s1.length && s1[i] === s2[i]) i++;
  return s1.slice(i) === s2.slice(i + 1);
}
function matchScore(title, q) {
  const t = norm(title), w = norm(q);
  if (!w) return 0;
  if (t.includes(w)) return 2;                   // exact
  if (w.length < 3) return 0;
  for (let len = w.length - 1; len <= w.length + 1; len++)
    for (let i = 0; i + len <= t.length; i++) if (oneEditAway(t.slice(i, i + len), w)) return 1;   // one typo
  return 0;
}
function searchStories(q) {
  return STORIES.map(s => [s, matchScore(s.title, q)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

function search() {
  const row = s => `<button class="item" id="i-${s.id}" data-id="${s.id}"><span class="thumb">${cover(s)}${tileProgress(s)}</span><div><b>${esc(s.title)}</b><small>${GENRES[s.genre]} · ${readMin(s)}${padMark(s)}</small></div></button>`;
  /* the dial: arc from 180° (left) to 0° (right), centre (120,124), radius 100 */
  const C = [120, 124], R = 100, pt = (deg, r = R) => [C[0] + r * Math.cos(deg * Math.PI / 180), C[1] - r * Math.sin(deg * Math.PI / 180)];
  const degOf = lvl => 180 - (lvl - 1) * 45;
  const marks = FEAR.map((n, i) => { const [x, y] = pt(degOf(i + 1), R + 2); const [x2, y2] = pt(degOf(i + 1), R - 16);
    return `<g class="mark" data-lvl="${i + 1}"><line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" fill="transparent"/></g>`; }).join("");
  const [ax, ay] = pt(180), [bx, by] = pt(0);
  shell(`<div class="sbar${query ? " active" : ""}"><label class="search">${ICON.search}<input id="q" type="search" placeholder="Search" value="${esc(query)}" autocomplete="off"></label><button class="s-cancel" id="s-cancel" tabindex="-1">Cancel</button></div>
    <section class="fear${query ? " gone out" : ""}" id="fear" aria-label="Choose how scary">
      <svg viewBox="0 0 240 140" role="slider" aria-label="Fear level" aria-valuemin="1" aria-valuemax="5" tabindex="0">
        <defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#7b57c9"/><stop offset=".55" stop-color="#a0608f"/><stop offset="1" stop-color="#b5525b"/></linearGradient></defs>
        <path d="M${ax} ${ay} A${R} ${R} 0 0 1 ${bx} ${by}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16" stroke-linecap="round"/>
        <path id="fear-arc" d="M${ax} ${ay} A${R} ${R} 0 0 1 ${bx} ${by}" fill="none" stroke="url(#fg)" stroke-width="16" stroke-linecap="round" pathLength="100"/>
        ${marks}
        <g class="needle" id="needle"><line x1="120" y1="124" x2="120" y2="40" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
        <circle cx="120" cy="124" r="9" fill="#fff"/><circle cx="120" cy="124" r="4" fill="var(--bg)"/>
      </svg>
      <span class="fear-name" id="fear-name"></span><span class="fear-sub" id="fear-sub"></span>
    </section>
    <div id="results"></div>`);
  const fear = document.getElementById("fear"), svg = fear.querySelector("svg"), needle = document.getElementById("needle"), arc = document.getElementById("fear-arc");
  const results = document.getElementById("results");
  const wire = () => results.querySelectorAll("[data-id]").forEach(b => b.onclick = () => preview(b.dataset.id));
  const showLevel = () => {
    const list = STORIES.filter(s => fearOf(s) === fearLevel);
    results.innerHTML = list.length ? `<div class="list">${list.map(row).join("")}</div>` : `<p class="hint">No stories this scary yet</p>`;   // only this level
    document.getElementById("fear-name").textContent = FEAR[fearLevel - 1];
    document.getElementById("fear-name").style.color = FEAR_COL[fearLevel - 1];
    document.getElementById("fear-sub").textContent = list.length + (list.length === 1 ? " story" : " stories");
    svg.setAttribute("aria-valuenow", fearLevel); svg.setAttribute("aria-valuetext", FEAR[fearLevel - 1]);
    wire();
  };
  /* needle angle: 0 = straight up; the arc fills up to the needle */
  const setNeedle = deg => {                   // deg: 180 (left) .. 0 (right)
    needle.style.transform = `rotate(${90 - deg}deg)`;
    arc.style.strokeDasharray = `${((180 - deg) / 180) * 100} 100`;
  };
  const pickLevel = (lvl, animate = true) => {
    fearLevel = lvl; fear.classList.toggle("drag", !animate); setNeedle(degOf(lvl)); showLevel();
  };
  const showSearch = () => {
    const found = searchStories(query);
    results.innerHTML = `<div class="list">${found.map(row).join("") || '<p class="hint">Nothing found</p>'}</div>`; wire();
  };
  /* drag along the dial: the needle follows the finger, and on letting go it settles on the nearest level */
  const angleAt = e => { const r = svg.getBoundingClientRect(), k = r.width / 240;
    const x = (e.clientX - r.left) / k - C[0], y = C[1] - (e.clientY - r.top) / k;
    return Math.max(0, Math.min(180, Math.atan2(Math.max(y, 0), x) * 180 / Math.PI)); };
  let dragging = false;
  svg.addEventListener("pointerdown", e => { dragging = true; svg.setPointerCapture(e.pointerId); fear.classList.add("drag"); setNeedle(angleAt(e)); });
  svg.addEventListener("pointermove", e => { if (!dragging) return; const d = angleAt(e); setNeedle(d);
    const lvl = Math.round((180 - d) / 45) + 1; if (lvl !== fearLevel) { fearLevel = lvl; showLevel(); } });
  const drop = e => { if (!dragging) return; dragging = false; fear.classList.remove("drag"); pickLevel(Math.round((180 - angleAt(e)) / 45) + 1); };
  svg.addEventListener("pointerup", drop); svg.addEventListener("pointercancel", () => { dragging = false; fear.classList.remove("drag"); pickLevel(fearLevel); });
  svg.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowUp") pickLevel(Math.min(5, fearLevel + 1)); if (e.key === "ArrowLeft" || e.key === "ArrowDown") pickLevel(Math.max(1, fearLevel - 1)); });
  /* typing hides the dial and lists matches; clearing brings it back */
  const q = document.getElementById("q");
  let outT = null;
  const hideDial = () => { clearTimeout(outT); fear.classList.add("gone"); outT = setTimeout(() => fear.classList.add("out"), 250); };
  const showDial = () => { clearTimeout(outT); fear.classList.remove("out"); requestAnimationFrame(() => fear.classList.remove("gone")); };
  /* tapping the field clears the screen at once: no fade, so the dial never flashes back into view
     when the list above it collapses */
  const bar = document.querySelector(".sbar");
  q.onfocus = () => { bar.classList.add("active"); clearTimeout(outT); fear.classList.add("gone", "out"); if (!query) results.innerHTML = ""; document.getElementById("view").scrollTop = 0; };
  q.onblur = () => { if (!query) { bar.classList.remove("active"); showDial(); showLevel(); } };
  document.getElementById("s-cancel").onclick = () => {
    query = ""; q.value = ""; bar.classList.remove("active");
    if (document.activeElement === q) q.blur(); else { showDial(); showLevel(); }
  };
  q.oninput = () => { query = q.value; query ? showSearch() : (results.innerHTML = ""); };
  /* tap anywhere but the field: the keyboard goes away (and, with nothing typed, the dial comes back) */
  document.getElementById("view").addEventListener("pointerdown", e => {
    if (document.activeElement === q && !e.target.closest(".sbar")) { e.preventDefault(); q.blur(); }
  });
  pickLevel(fearLevel, false);
  if (query) showSearch();
}

/* ---------- Story sheet: the tapped card itself grows into the full screen and shrinks back. ---------- */
const layer = document.createElement("div"); layer.id = "layer"; document.body.appendChild(layer);
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.25,.8,.25,1)", OPEN_MS = 400, CLOSE_MS = 340;
const px = r => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
let lastCard = null;
document.addEventListener("pointerdown", e => { lastCard = e.target.closest("[data-id],[data-open]"); }, true);

function appRect() { const a = app.getBoundingClientRect(); return { left: a.left, top: 0, width: a.width, height: innerHeight }; }
/* The card's own dressing (its gradient, chips, heart) is laid over the card's spot on the sheet
   and fades while the sheet opens, so the first and last frames are exactly the card. */
function addGhost(sheet, geo, at) {
  const coverEl = sheet.querySelector(".pv-cover"), shade = geo.el.querySelector(".shade"), cap = coverEl.querySelector(".cap");
  const out = {};
  if (shade) {
    const g = document.createElement("span"); g.className = "ghost-shade"; g.style.background = getComputedStyle(shade).backgroundImage;
    Object.assign(g.style, px(at)); coverEl.insertBefore(g, cap); out.shade = g;
  }
  const box = document.createElement("div"); box.className = "ghost" + (geo.el.parentElement.classList.contains("row-card") ? " row-card" : "");
  Object.assign(box.style, px(at));
  const c = geo.el.cloneNode(true); c.removeAttribute("id"); c.removeAttribute("data-id"); c.removeAttribute("data-open"); c.style.visibility = "visible";
  c.querySelectorAll(".cover, .shade").forEach(n => n.remove());
  c.querySelectorAll(".thumb").forEach(n => n.style.visibility = "hidden");
  const t = c.querySelector("b"); if (t) t.style.visibility = "hidden";
  box.appendChild(c); coverEl.insertBefore(box, cap); out.box = box;
  return out;
}
/* The drawn picture inside a box under object-fit: cover, as a rect relative to the box. */
function drawnRect(box, img) {
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const pos = getComputedStyle(img).objectPosition.split(" ").map(v => parseFloat(v) / 100);
  const k = Math.max(box.width / nw, box.height / nh), w = nw * k, h = nh * k;
  return { left: (box.width - w) * (isNaN(pos[0]) ? .5 : pos[0]) + "px", top: (box.height - h) * (isNaN(pos[1]) ? .5 : pos[1]) + "px", width: w + "px", height: h + "px" };
}
/* Grow or shrink the photo as one picture: it is laid out once at its larger size and only
   moved/scaled with transform (cheap, no re-cropping, no re-drawing), and clipped to the card's
   photo window with clip-path, so on a phone it zooms smoothly with the frame. */
function morphPhoto(photo, a, b, o) {
  const boxKF = r => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  if (photo.tagName !== "IMG" || !photo.naturalWidth) return photo.animate([boxKF(a), boxKF(b)], o);
  const d = r => { const x = drawnRect(r, photo); return { left: r.left + parseFloat(x.left), top: r.top + parseFloat(x.top), width: parseFloat(x.width), height: parseFloat(x.height) }; };
  const da = d(a), db = d(b), base = da.width > db.width ? da : db;
  photo.style.inset = "auto";   // first: the shorthand would wipe left/top set after it
  Object.assign(photo.style, { left: base.left + "px", top: base.top + "px", width: base.width + "px", height: base.height + "px", objectFit: "fill", transformOrigin: "0 0" });
  const state = (box, dr) => {
    const k = dr.width / base.width;
    const l = (box.left - dr.left) / k, t = (box.top - dr.top) / k;
    const r = base.width - (box.left + box.width - dr.left) / k, btm = base.height - (box.top + box.height - dr.top) / k;
    return { transform: `translate(${dr.left - base.left}px, ${dr.top - base.top}px) scale(${k})`,
             clipPath: `inset(${Math.max(0, t)}px ${Math.max(0, r)}px ${Math.max(0, btm)}px ${Math.max(0, l)}px)` };
  };
  return photo.animate([state(a, da), state(b, db)], o);
}
function unclip(photo) {
  ["inset", "left", "top", "width", "height", "objectFit", "transformOrigin"].forEach(k => photo.style[k] = "");
  Object.assign(photo.style, { left: 0, top: 0, width: "100%", height: "100%" });
}
/* Geometry of a card: its photo, the title and its offset from the card edge. */
function cardGeometry(card) {
  if (card.classList.contains("thumb")) card = card.closest(".item") || card;
  /* a search row opens as a whole row: its little photo grows, its title flies */
  const thumb = card.querySelector(".thumb");
  const frame = card.getBoundingClientRect();
  const img = card.querySelector(".cover")?.getBoundingClientRect() || frame;
  const title = card.querySelector("b");   // a search row's title flies into the page title too
  const t = title?.getBoundingClientRect();
  if (t) { t.w = t.width + 2; t.one = t.height < parseFloat(getComputedStyle(title).fontSize) * 1.7; }
  const hide = [card];
  return { frame, img: { left: img.left - frame.left, top: img.top - frame.top, width: img.width, height: img.height },
    radius: thumb ? 12 : parseFloat(getComputedStyle(card).borderTopLeftRadius) || 14,
    title: t ? { size: parseFloat(getComputedStyle(title).fontSize), left: t.left - frame.left, bottom: frame.bottom - t.bottom, width: t.w, one: t.one } : null,
    el: card, hide };
}

  /* the part a tap on the main button opens: the current one, or the next unfinished */
  let at = pr.ep; while (at < s.episodes.length - 1 && partPct(s, pr, at) >= 1) at++;
  const fillAt = partPct(s, pr, at) >= 1 ? 0 : partPct(s, pr, at);
  const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4c0 .6.7 1 1.2.6l8-5.2c.5-.3.5-1 0-1.3l-8-5.1c-.5-.4-1.2 0-1.2.6z" fill="currentColor"/></svg>';

/* One morph, played forwards to open and backwards to close. Nothing inside the sheet is laid out
   again while it runs: the page sits where it ends up and is revealed through a rounded window
   (clip-path) that grows from the card; only the photo, title and the card's dressing move, by
   transform. So text never snaps by a pixel and nothing jumps on a slow phone. */
function morph(sheet, geo, opening, o, from) {
  const full = appRect(), coverEl = sheet.querySelector(".pv-cover"), photo = coverEl.querySelector(".cover");
  const cap = sheet.querySelector(".cap"), COVER_H = coverEl.offsetHeight, W = full.width, H = full.height;
  const f = geo.frame, at = { left: f.left - full.left, top: f.top, width: f.width, height: f.height };
  const card = { clipPath: `inset(${at.top}px ${W - at.left - at.width}px ${H - at.top - at.height}px ${at.left}px round ${geo.radius}px)`, transform: "none" };
  const page = from || { clipPath: "inset(0px 0px 0px 0px round 0px)", transform: "none" };
  const play = (el, a, b) => el.animate(opening ? [a, b] : [b, a], o);
  /* fades are written for opening; closing runs them mirrored on the same progress */
  const fade = (el, frames) => el.animate(opening ? frames : frames.map(k => ({ ...k, offset: 1 - k.offset })).reverse(), o);
  sheet.classList.add("morph");
  const anims = [play(sheet, card, page)];
  const imgBox = { left: at.left + geo.img.left, top: at.top + geo.img.top, width: geo.img.width, height: geo.img.height };
  anims.push(opening ? morphPhoto(photo, imgBox, { left: 0, top: 0, width: W, height: COVER_H }, o)
                     : morphPhoto(photo, { left: 0, top: 0, width: W, height: COVER_H }, imgBox, o));
  /* the title: same text, moved and scaled from the card's title to the page's */
  let shift = { x: 0, y: 0 };
  if (geo.title) {
    const k = geo.title.size / 32;
    if (geo.title.one) cap.classList.add("one");
    const start = { x: at.left + geo.title.left, y: at.top + at.height - geo.title.bottom }, end = { x: 18, y: COVER_H - 18 };
    shift = { x: start.x - end.x, y: start.y - end.y };
    anims.push(play(cap, { transform: `translate(${shift.x}px, ${shift.y}px) scale(${k})` }, { transform: "translate(0px, 0px) scale(1)" }));
    anims.push(fade(cap.querySelector("small"), [{ opacity: 0, offset: 0 }, { opacity: 0, offset: .45 }, { opacity: 1, offset: 1 }]));
  } else anims.push(fade(cap, [{ opacity: 0, transform: "translateY(10px)", offset: 0 }, { opacity: 0, transform: "translateY(10px)", offset: .45 }, { opacity: 1, transform: "none", offset: 1 }]));
  /* the card's gradient stretches with the window and hands over to the page's; chips ride with the title */
  const g = addGhost(sheet, geo, at);
  if (g.shade) {
    anims.push(play(g.shade, { transform: "none" }, { transform: `translate(${-at.left}px, ${-at.top}px) scale(${W / at.width}, ${COVER_H / at.height})` }));
    anims.push(fade(g.shade, [{ opacity: 1, offset: 0 }, { opacity: 1, offset: .2 }, { opacity: 0, offset: .7 }, { opacity: 0, offset: 1 }]));
  }
  if (g.box) {
    anims.push(play(g.box, { transform: "none" }, { transform: `translate(${-shift.x}px, ${-shift.y}px)` }));
    anims.push(fade(g.box, [{ opacity: 1, offset: 0 }, { opacity: 0, offset: .35 }, { opacity: 0, offset: 1 }]));
  }
  anims.push(fade(coverEl.querySelector(".shade"), [{ opacity: 0, offset: 0 }, { opacity: 1, offset: .5 }, { opacity: 1, offset: 1 }]));
  anims.push(fade(sheet.querySelector(".pv-body"), [{ opacity: 0, transform: "translateY(16px)", offset: 0 }, { opacity: 0, transform: "translateY(16px)", offset: .55 }, { opacity: 1, transform: "none", offset: 1 }]));
  anims.push(fade(sheet.querySelector(".chrome"), [{ opacity: 0, offset: 0 }, { opacity: 0, offset: .5 }, { opacity: 1, offset: 1 }]));
  return Promise.all(anims.map(a => a.finished)).then(() => g, () => g);
}

/* The card-morph opening (card grows into the page) is kept but switched off for now; true brings it back. */
const CARD_MORPH = false;

function preview(id) {
  if (layer.querySelector(".sheet")) return;
  const s = STORIES.find(x => x.id === id);
  const card = lastCard && document.body.contains(lastCard) && !layer.contains(lastCard) ? lastCard : null; lastCard = null;
  const sheet = document.createElement("section");
  sheet.className = "sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", s.title);
  sheet.innerHTML = sheetHTML(s);
  sheet.querySelector("img.cover")?.removeAttribute("loading");
  layer.appendChild(sheet);
  const full = appRect(), photo = sheet.querySelector(".pv-cover .cover");
  Object.assign(sheet.style, px(full));
  Object.assign(photo.style, { left: 0, top: 0, width: "100%", height: "100%" });
  const geo = card ? cardGeometry(card) : null;
  sheet._origin = geo ? geo.el : null; sheet._hide = geo ? geo.hide : []; sheet._story = s; sheet._sig = sig(s);
  wire(sheet, s);
  if (!CARD_MORPH) { sheet.classList.add("still"); return; }   // appears at once, full screen
  if (!geo || !sheet.animate || reduce()) {
    if (sheet.animate && !reduce()) sheet.animate([{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }], { duration: 260, easing: EASE });
    return;
  }
  geo.hide.forEach(e => e.style.visibility = "hidden");
  morph(sheet, geo, true, { duration: OPEN_MS, easing: EASE, fill: "both" }).then(g => {
    /* settle: drop the helpers only once every part has really finished */
    if (sheet._closing) return;
    g.shade?.remove(); g.box?.remove(); unclip(photo); sheet.classList.remove("morph");
    sheet.querySelector(".cap").classList.remove("one");
    sheet.getAnimations({ subtree: true }).forEach(a => a.cancel());
  });
}

function closeSheet(sheet, dragged) {
  if (sheet._closing) return; sheet._closing = true;
  const origin = sheet._origin && document.body.contains(sheet._origin) ? sheet._origin : null;
  const finish = () => { (sheet._hide || []).forEach(e => e.style.visibility = ""); sheet.remove();
    if (sheet._sig === sig(sheet._story)) return;
    if (tab === "home") syncHearts(); else refresh(); };
  sheet.getAnimations({ subtree: true }).forEach(a => a.finish());
  sheet.querySelector(".scroll").scrollTop = 0;
  if (!CARD_MORPH || !sheet.animate || reduce()) return finish();
  const vis = r => r.width > 0 && r.bottom > 0 && r.top < innerHeight;
  if (!origin || !vis(origin.getBoundingClientRect())) {
    sheet.style.transition = "";
    sheet.animate([{ opacity: 1, transform: sheet.style.transform || "none" }, { opacity: 0, transform: "translateY(60px) scale(.94)" }], { duration: 260, easing: "ease-in", fill: "forwards" }).onfinish = finish;
    return;
  }
  /* a drag-down hands over its current shape, so the shrink continues from under the finger */
  const from = dragged ? { clipPath: `inset(0px 0px 0px 0px round ${parseFloat(sheet.style.borderRadius) || 0}px)`, transform: sheet.style.transform || "none" } : null;
  sheet.style.transition = ""; sheet.style.borderRadius = "";
  const p = morph(sheet, cardGeometry(origin), false, { duration: CLOSE_MS, easing: EASE, fill: "forwards" }, from);
  sheet.style.transform = "";
  p.then(finish);
}

/* Fit the still page to one screen: the photo gives way first (down to its minimum), then the
   description loses lines from the end, only as many as needed. */
function fitStill(sheet) {
  if (!sheet.classList.contains("still")) return;
  const sc = sheet.querySelector(".scroll"), desc = sheet.querySelector(".desc");
  if (!desc) return;
  let n = 14; desc.style.setProperty("--lines", n);
  while (sc.scrollHeight > sc.clientHeight + 1 && n > 2) desc.style.setProperty("--lines", --n);
}

function wire(sheet, s) {
  requestAnimationFrame(() => fitStill(sheet));

  sheet.onclick = e => {
    if (!sheet.classList.contains("still") || sheet._closing) return;
    if (e.target.closest("button, a, input, .stats")) return;

  const reset = sheet.querySelector("#pv-reset");

    /* the note appears just under the button, over the photo, where nothing else sits */
    /* before the page redraws, the water in the parts being reset drains down, about as fast as it rose,

    const DRAIN = 1000;

        const fill = w.querySelector("i"), h = fill.getBoundingClientRect().height;
        fill.animate([{ height: h + "px" }, { height: "0px" }], { duration: DRAIN, easing: "cubic-bezier(.45,0,.55,1)", fill: "forwards" });
        w.querySelectorAll("svg").forEach(sv => sv.animate([{ scale: "1 1", opacity: 1 }, { scale: "1 1", opacity: 1, offset: .85 }, { scale: "1 0", opacity: 0 }], { duration: DRAIN, fill: "forwards" })); });

    if (k === st.ep) return;
    clearTimeout(timer);
    setTimeout(() => openStory(id, k), reduce() ? 0 : 260);
  };
  if (seg) {
    const ind = seg.querySelector(".ep-ind"), n = s.episodes.length;
    let sx = null, base = 0, moved = false;
    seg.addEventListener("pointerdown", e => { e.stopPropagation(); sx = e.clientX; base = st.ep * 34; moved = false; seg.setPointerCapture(e.pointerId); });
    seg.addEventListener("pointermove", e => {
      if (sx == null) return;
      const dx = e.clientX - sx;
      if (!moved && Math.abs(dx) < 4) return;
      moved = true; seg.classList.add("drag");
      const x = Math.max(0, Math.min((n - 1) * 34, base + dx));
      ind.style.transform = `translateX(${x}px)`;
      seg.querySelectorAll("[data-ep]").forEach(b => b.setAttribute("aria-selected", +b.dataset.ep === Math.round(x / 34)));
    });
    const up = e => {
      if (sx == null) return;
      seg.classList.remove("drag");
      if (moved) { const x = Math.max(0, Math.min((n - 1) * 34, base + e.clientX - sx)); goPart(Math.round(x / 34)); }
      else { const b = e.target.closest("[data-ep]"); if (b) goPart(+b.dataset.ep); }
      sx = null;
    };
    seg.addEventListener("pointerup", up); seg.addEventListener("pointercancel", e => { seg.classList.remove("drag"); sx = null; goPart(st.ep); });
    seg.addEventListener("click", e => e.stopPropagation());
  }
  const add = m => { const d = document.createElement("div"); d.className = "msg " + (m.from === ep.right ? "me" : "them"); d.textContent = m.text; log.appendChild(d); };
  for (let k = 0; k < st.i; k++) add(ep.messages[k]);
  log.scrollTop = log.scrollHeight;
  requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });    // land on the last message read
  let busy = false;
  const save = () => { const p = prog(s); p.ep = st.ep; p.pos[st.ep] = st.i;
    if (path) { p.path = path; if (st.i >= ep.messages.length && base.nodes[path.at(-1)].ending) p.pos[st.ep] = Math.max(st.i, base.messages.length); }   // an ending reached = read
    setProg(s, p); };
  /* the hint stays still; only after 10 s with no tap does it start to breathe */
  let idleT = null;
  const nudge = () => { clearTimeout(idleT); foot.classList.remove("idle"); idleT = setTimeout(() => { if (scr.isConnected) foot.classList.add("idle"); }, 10000); };
  scr.addEventListener("pointerdown", nudge);
  function controls() {
    const node = path && base.nodes[path.at(-1)];
    if (node && node.choices && st.i >= ep.messages.length) {          // your turn: pick what you write
      foot.classList.remove("hint", "idle"); foot.classList.add("choose"); foot.onclick = null;
      foot.innerHTML = `<span class="ask">What do you say?</span>` + node.choices.map((c, k) => `<button class="choice" data-k="${k}">${esc(c.text)}</button>`).join("");
      foot.querySelectorAll(".choice").forEach(b => b.onclick = e => {
        e.stopPropagation();
        path.push(node.choices[+b.dataset.k].next); ep.messages = flatten();
        foot.classList.remove("choose"); step();
        /* the choice is the tap: the other side answers on its own, no extra tap */
        const nx = ep.messages[st.i];
        if (nx && nx.from !== ep.right) setTimeout(() => { if (scr.isConnected && !busy) step(); }, reduce() ? 0 : 350);
      });
      log.scrollTop = log.scrollHeight;
      return;
    }
    if (st.i >= ep.messages.length) {
      const last = st.ep + 1 >= s.episodes.length;
      const endings = path ? Object.values(base.nodes).filter(n => n.ending) : [];
      const which = path ? endings.indexOf(node) + 1 : 0;
      log.insertAdjacentHTML("beforeend", `<div class="end">${last ? "" : "<strong>To be continued…</strong>"}<span>${esc(s.title)}${s.episodes.length > 1 ? " · part " + (st.ep + 1) : ""}</span>${path ? `<em>Ending ${which} of ${endings.length} · ${esc(node.ending)}</em>` : ""}</div>`);
      log.scrollTop = log.scrollHeight;
      foot.classList.remove("hint"); foot.onclick = null;
      foot.innerHTML = `${last ? "" : `<button class="tap primary" id="next">Next part</button>`}<button class="tap" id="again">${path ? "Start over" : last ? "Read again" : "Restart"}</button>`;
      const next = foot.querySelector("#next");
      if (next) next.onclick = () => openStory(id, st.ep + 1);
      foot.querySelector("#again").onclick = () => {
        const p = prog(s);
        if (last) { p.pos = p.pos.map(() => 0); p.ep = 0; } else p.pos[st.ep] = 0;   // the end: whole story again; else this part
        delete p.path;                                                              // interactive: choose again
        setProg(s, p); openStory(id, last ? 0 : st.ep);
      };
      /* interactive: jump straight back to any turning point on the path just read (one button per choice
         made on the way to this ending), instead of rereading from the start */
      if (path) {
        const turns = path.slice(0, -1).map((n, k) => ({ k, upto: path.slice(0, k + 1) }));
        if (turns.length) {
          foot.classList.add("ended");
          foot.insertAdjacentHTML("afterbegin", `<div class="turns"><span>Back to a choice</span>${turns.map((t, j) =>
            `<button class="turn" data-k="${t.k}" aria-label="Back to choice ${j + 1}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 2.5 6.5 6 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6.5h6.5a4 4 0 0 1 0 8H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>${j + 1}</button>`).join("")}</div>`);
          foot.querySelectorAll(".turn").forEach(b => b.onclick = e => {
            e.stopPropagation();
            path = path.slice(0, +b.dataset.k + 1);
            const n = flatten().length, p = prog(s);
            p.ep = st.ep; p.pos[st.ep] = n; p.path = path; setProg(s, p);
            openStory(id, st.ep);
          });
        }
      }
      return;
    }
    foot.classList.add("hint");
    if (!premium() && freeTaps() <= 0) return showPaywall();
    foot.innerHTML = `<span class="cont">Tap to continue</span>`;   // free taps are counted quietly, never shown
    foot.onclick = step;
    nudge();
  }
  function showPaywall() {
    foot.classList.remove("hint"); foot.onclick = null;
    foot.innerHTML = `<div class="paywall"><span>You've used your free taps</span><button id="pay">Subscribe to keep reading</button></div>`;
    foot.querySelector("#pay").onclick = e => { e.stopPropagation(); toast("Subscription — in the iPhone app"); };
  }
  /* one free tap is spent per message shown, silently */
  function spendTap() {
    if (premium()) return true;
    const left = freeTaps();
    if (left <= 0) { showPaywall(); return false; }
    store.set("taps", left - 1);
    return true;
  }
  function step() {
    if (busy || st.i >= ep.messages.length) return;
    if (!spendTap()) return;
    const m = ep.messages[st.i];
    if (m.from === ep.right) { add(m); st.i++; save(); log.scrollTop = log.scrollHeight; return controls(); }
    busy = true; status.textContent = "typing…";
    const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(t); log.scrollTop = log.scrollHeight;
    const delay = reduce() ? 150 : Math.min(1800, 450 + m.text.length * 22);
    timer = setTimeout(() => { t.remove(); add(m); st.i++; save(); status.textContent = "online"; busy = false; log.scrollTop = log.scrollHeight; controls(); }, delay);
  }
  log.onclick = e => { if (scr._dragged) { scr._dragged = false; return; } step(); };
  controls();
  swipeBack(scr);
}

/* Messenger-style swipe back: drag the chat to the right; it follows the finger and, let go far enough
   (or with a flick), slides away and drops you on the screen you opened the story from (the story
   page under it closes too). The page behind is shown while you drag. */
function swipeBack(scr) {
  let x0 = null, y0 = 0, dx = 0, locked = false, lastX = 0, lastT = 0, vx = 0;
  const W = () => scr.offsetWidth;
  const sheetOf = () => layer.querySelector(".sheet");
  const setX = x => { scr.style.transform = x ? `translateX(${x}px)` : ""; };
  /* like iOS messengers: the swipe has to begin at the very left edge of the conversation; the top bar
     (back, name, part numbers) never closes the chat */
  const EDGE = 24;
  const start = (x, y, t) => { if (scr._leaving || (t && t.closest && t.closest(".head")) || x - scr.getBoundingClientRect().left > EDGE) return; x0 = x; y0 = y; dx = 0; locked = false; vx = 0; lastX = x; lastT = performance.now(); };
  const move = (x, y, e) => {
    if (x0 == null) return;
    const ddx = x - x0, ddy = y - y0;
    if (!locked) {
      if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
      if (ddx <= 0 || Math.abs(ddy) > Math.abs(ddx)) { x0 = null; return; }      // vertical scroll or leftwards: not ours
      locked = true; scr._dragged = true; clearTimeout(timer);
      const sh = sheetOf(); if (sh) sh.style.visibility = "hidden";             // show the screen you came from
      scr.style.transition = "none";
    }
    if (e.cancelable) e.preventDefault();
    const now = performance.now(); vx = .7 * vx + .3 * (x - lastX) / Math.max(1, now - lastT); lastX = x; lastT = now;
    dx = Math.max(0, ddx); setX(dx);
  };
  const end = () => {
    if (x0 == null) return; x0 = null;
    if (!locked) return;
    const go = dx > W() * .35 || vx > .5;
    scr.style.transition = "transform .3s cubic-bezier(.32,.72,0,1)";
    if (!go) { setX(0); const sh = sheetOf(); setTimeout(() => { if (sh) sh.style.visibility = ""; scr.style.transition = ""; }, 300); return; }
    scr._leaving = true; setX(W());
    setTimeout(() => {
      scr.remove(); syncBars();
      const sh = sheetOf(); if (sh) { sh.style.visibility = ""; closeSheet(sh); }
    }, 300);
  };
  scr.addEventListener("touchstart", e => start(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: true });
  scr.addEventListener("touchmove", e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  scr.addEventListener("touchend", end); scr.addEventListener("touchcancel", end);
  scr.addEventListener("mousedown", e => start(e.clientX, e.clientY, e.target));
  scr.addEventListener("mousemove", e => move(e.clientX, e.clientY, e));
  scr.addEventListener("mouseup", end); scr.addEventListener("mouseleave", end);
}

render();
</script>
