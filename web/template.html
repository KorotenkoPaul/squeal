<title>Squeal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: the original 2018 Squeal design — indigo night, four tabs (menu, home, favourites, search) and a full-screen chat reader. */
:root {
  --bg: #26243f;          /* indigo night, from the original mockups */
  --deep: #17122c;        /* card shade behind covers */
  --tabbar: #1f1d36;
  --field: #34315a;       /* search field, chips */
  --text: #ffffff;
  --muted: #9b97b3;       /* lavender captions */
  --accent: #7b57c9;      /* favourite heart, active states */
  --danger: #d4445f;      /* remove */
  --them: #36335a;
  --me: #6a4bb8;
  --font: "Avenir Next", Avenir, "Nunito Sans", -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; }
.view { flex: 1; overflow-y: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.label { color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }

/* Tab bar */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--tabbar);
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.tabs button { display: grid; place-items: center; padding: 6px; color: #6f6b8c; }
.tabs button[aria-current="page"] { color: var(--text); }
.tabs svg { width: 26px; height: 26px; }

/* Covers: drawn scenes, one per story */
.cover { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Home */
.slider { flex: none; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; scrollbar-width: none; border-radius: 14px; }
.slider::-webkit-scrollbar { display: none; }
.slider .hero { flex: 0 0 100%; scroll-snap-align: center; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -4px; }
.dots { flex: none; }
.dots i { position: relative; width: 6px; height: 6px; border-radius: 3px; background: var(--field); overflow: hidden;
  transition: width .45s cubic-bezier(.2,.9,.2,1), background .3s; }
.dots i.on { width: 28px; background: rgba(255,255,255,.22); }
.dots i.on::after { content: ""; position: absolute; inset: 0; background: var(--text); border-radius: 3px; transform-origin: left;
  animation: fill var(--slide, 4s) linear forwards; }
.dots.manual i.on::after { animation: none; transform: scaleX(1); }
@keyframes fill { from { transform: scaleX(0) } to { transform: scaleX(1) } }
.preview { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); overscroll-behavior-y: contain; transform-origin: 50% 0; }
.pull { position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: rgba(255,255,255,.35); z-index: 2; }
.pv-cover { position: relative; min-height: 260px; display: flex; align-items: flex-end; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); }
.pv-cover .shade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 4%, rgba(38,36,63,0) 70%); }
.pv-cover .back { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; padding: 0 0 3px; }
.pv-cover .like { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; color: var(--muted); }
.pv-cover .like[aria-pressed="true"] { color: var(--text); background: var(--accent); }
.pv-cover .like svg { width: 18px; height: 18px; }
.pv-cover div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.pv-cover small { color: var(--muted); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.pv-cover h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.1; text-wrap: balance; }
.pv-body > * { animation: up .5s cubic-bezier(.2,.9,.2,1) both; }
.pv-body > *:nth-child(2) { animation-delay: .06s } .pv-body > *:nth-child(3) { animation-delay: .12s } .pv-body > *:nth-child(n+4) { animation-delay: .18s }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
.pv-body { padding: 4px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--field); border-radius: 12px; padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.desc { margin: 0; line-height: 1.55; color: #dcd9ea; max-width: 60ch; }
.by { color: var(--muted); font-size: 14px; }
.parts { display: flex; flex-direction: column; gap: 8px; }
.part { display: flex; justify-content: space-between; align-items: center; background: var(--field); border-radius: 12px; padding: 12px 14px; text-align: left; }
.part small { color: var(--muted); }
.read { padding: 16px; border-radius: 14px; background: var(--accent); font-weight: 700; font-size: 17px; }
.demo { color: #6f6b8c; font-size: 11px; text-align: center; }
.hero { position: relative; border-radius: 14px; overflow: hidden; min-height: 190px; background: var(--deep); text-align: left; display: flex; align-items: flex-end; padding: 18px; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,18,44,.95) 10%, rgba(23,18,44,0) 75%); }
.hero div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.hero b { font-size: 26px; font-weight: 600; text-wrap: balance; }
.hero small { color: var(--muted); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.chips { flex: none; display: flex; gap: 8px; overflow-x: auto; }
.chip { flex: none; padding: 7px 16px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--text); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; aspect-ratio: 1 / 1.15; border-radius: 14px; overflow: hidden; background: var(--deep); text-align: left; display: flex; align-items: flex-end; padding: 12px; }
.tile .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,18,44,.96) 15%, rgba(23,18,44,.05) 70%); }
.tile div { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile b { font-size: 17px; font-weight: 600; line-height: 1.2; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 11px; color: var(--muted); background: rgba(52,49,90,.85); padding: 3px 8px; border-radius: 999px; }
.tile .fav { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.tile .fav svg { width: 14px; height: 14px; }
.hint { color: var(--muted); font-size: 13px; text-align: center; }

/* Favourites */
.row-card { position: relative; border-radius: 14px; overflow: hidden; touch-action: pan-y; }
.row-card .remove { position: absolute; inset: 0 0 0 auto; width: 96px; background: var(--danger); color: var(--text); font-weight: 600; border-radius: 14px; }
.row-card .face { position: relative; display: flex; align-items: center; min-height: 110px; padding: 20px; background: var(--deep); border-radius: 14px; transition: transform .2s; width: 100%; text-align: left; overflow: hidden; }
.row-card .face svg.cover { left: 40%; width: 60%; }
.row-card .face .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--deep) 42%, rgba(23,18,44,0) 85%); }
.row-card .face div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.row-card b { font-size: 24px; font-weight: 600; }
.row-card small { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.row-card.open .face { transform: translateX(-108px); }

/* Search */
.search { display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 12px; padding: 10px 12px; color: var(--muted); }
.search svg { width: 18px; height: 18px; flex: none; }
.search input { flex: 1; min-width: 0; color: var(--text); }
.search input::placeholder { color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { display: flex; align-items: center; gap: 14px; text-align: left; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex: none; background: var(--deep); }
.item div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item b { font-size: 18px; font-weight: 600; }
.item small { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }

/* Menu */
.menu { align-items: center; justify-content: center; gap: 0; }
.menu button { padding: 18px 8px; font-size: 18px; width: 100%; max-width: 320px; border-bottom: 1px solid rgba(155,151,179,.12); }
.menu button:last-of-type { border-bottom: 0; }
.menu p { color: #6f6b8c; font-size: 12px; text-align: center; margin: 28px 0 0; max-width: 30ch; }

/* Empty states */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding-block: 40px; }
.empty svg { width: 150px; height: 160px; }
.empty b { font-size: 20px; }
.empty span { color: var(--muted); }

/* Chat */
.chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.head { display: flex; align-items: center; gap: 12px; padding: 12px max(18px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px)); background: var(--tabbar); }
.back { font-size: 30px; line-height: 1; padding: 0 6px 2px 0; color: var(--text); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.who { display: flex; flex-direction: column; min-width: 0; }
.who b { font-weight: 600; }
.who small { color: var(--muted); font-size: 12px; }
.ep { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.log { flex: 1; overflow-y: auto; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
.intro { align-self: center; color: var(--muted); font-size: 13px; text-align: center; max-width: 34ch; line-height: 1.5; margin-bottom: 10px; }
.msg { max-width: 78%; padding: 9px 14px; border-radius: 18px; line-height: 1.38; overflow-wrap: anywhere; animation: rise .2s ease-out both; }
.them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 5px; }
.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 5px; }
.typing { align-self: flex-start; background: var(--them); border-radius: 18px; padding: 12px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }
.foot { padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; }
.tap { flex: 1; padding: 14px; border-radius: 14px; background: var(--field); color: var(--muted); font-weight: 600; }
.tap.primary { background: var(--accent); color: var(--text); }
.end { align-self: center; text-align: center; padding: 16px 8px 4px; display: flex; flex-direction: column; gap: 4px; }
.end strong { font-size: 26px; font-weight: 700; }
.end span { color: var(--muted); font-size: 13px; }
.toast { position: absolute; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--field); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; white-space: nowrap; }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .pv-body > * { animation: none } .dots i.on::after { animation: none; transform: scaleX(1) } .msg { animation: none } .typing i { animation: none; opacity: .7 } .row-card .face { transition: none } }
</style>

<div class="app" id="app"></div>

<script>
const STORIES = /*STORIES*/[];
const GENRES = { all: "All", horror: "Horror", thriller: "Thriller", romance: "Romance" };
const store = {
  get(k, d) { try { const v = localStorage.getItem("squeal:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("squeal:" + k, JSON.stringify(v)); } catch {} },
};
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = {
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3.5" width="14" height="17" rx="2"/><rect x="8.5" y="7" width="7" height="4" rx="1"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.2 3.4 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.6 0 5.5 3.7 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>',
};
const OWL = '<svg viewBox="0 0 150 160" aria-hidden="true"><path fill="#a7a3bb" d="M30 30q45-14 90 0l-2 8q30 20 26 62-6 38-69 40-63-2-69-40-4-42 26-62z"/><circle cx="52" cy="70" r="20" fill="#26243f"/><circle cx="98" cy="70" r="20" fill="#26243f"/><circle cx="52" cy="70" r="15" fill="#a7a3bb"/><circle cx="98" cy="70" r="15" fill="#a7a3bb"/><circle cx="50" cy="76" r="6" fill="#26243f"/><circle cx="96" cy="76" r="6" fill="#26243f"/><path d="M68 84l7 9 7-9" fill="none" stroke="#26243f" stroke-width="4" stroke-linejoin="round"/><path d="M58 140v14l-6 6M58 154l6 6M92 140v14l-6 6M92 154l6 6" stroke="#a7a3bb" stroke-width="5" stroke-linecap="round" fill="none"/></svg>';

/* Procedural cover scenes, so no third-party film stills are used. */
function cover(story) {
  let seed = [...story.id].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const sky = story.genre === "thriller" ? ["#1c2a3d", "#0f1220"] : ["#2b1b44", "#0d0a1c"];
  const glow = story.genre === "thriller" ? "#c9d27a" : "#e2c06a";
  let trees = "";
  for (let i = 0; i < 9; i++) {
    const x = rnd() * 220, w = 3 + rnd() * 6, h = 90 + rnd() * 60;
    trees += `<rect x="${x.toFixed(1)}" y="${(150 - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#07050f" opacity="${(0.55 + rnd() * 0.45).toFixed(2)}"/>`;
  }
  const hx = 70 + rnd() * 90, scene = rnd() < 0.5
    ? `<path d="M${hx} 118l26-20 26 20v32h-52z" fill="#0a0814"/><rect x="${hx + 20}" y="124" width="10" height="13" fill="${glow}" opacity=".85"/>`
    : `<circle cx="${hx}" cy="44" r="16" fill="${glow}" opacity=".55"/>`;
  const id = "f" + story.id.replace(/\W/g, "");
  return `<svg class="cover" viewBox="0 0 220 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
    <rect width="220" height="150" fill="url(#${id})"/>${scene}${trees}
    <rect y="112" width="220" height="38" fill="#b7b0d8" opacity=".07"/></svg>`;
}

const rating = s => +(4.2 + ([...s.id].reduce((a, c) => a + c.charCodeAt(0), 0) % 8) / 10).toFixed(1);
const TOP = [...STORIES].sort((a, b) => rating(b) - rating(a) || a.title.localeCompare(b.title)).slice(0, 5);
const app = document.getElementById("app");
let tab = store.get("tab", "home"), genre = "all", query = "", toastTimer;
const favs = () => store.get("favs", []);
const totalOf = s => s.episodes.reduce((n, e) => n + e.messages.length, 0);
function progress(s) {
  const st = store.get("p:" + s.id, { ep: 0, i: 0 });
  const read = s.episodes.slice(0, st.ep).reduce((n, e) => n + e.messages.length, 0) + st.i;
  return Math.min(100, Math.round(read * 100 / totalOf(s)));
}
function toast(text) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text; app.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}
function toggleFav(id) {
  const f = favs(), on = f.includes(id);
  store.set("favs", on ? f.filter(x => x !== id) : [...f, id]);
  toast(on ? "Removed from favourites" : "Added to favourites");
}
function longPress(el, fn) {
  let t, fired = false;
  el.addEventListener("pointerdown", () => { fired = false; t = setTimeout(() => { fired = true; fn(); }, 550); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(e => el.addEventListener(e, () => clearTimeout(t)));
  el.addEventListener("contextmenu", e => e.preventDefault());
  return () => fired;
}

function shell(content) {
  app.innerHTML = `<main class="view ${tab === "menu" ? "menu" : ""}" id="view">${content}</main>
    <nav class="tabs" aria-label="Sections">${[["menu", "Menu"], ["home", "Stories"], ["fav", "Favourites"], ["search", "Search"]].map(([k, n]) =>
      `<button id="tab-${k}" data-tab="${k}" aria-label="${n}" ${tab === k ? 'aria-current="page"' : ""}>${ICON[k === "fav" ? "heart" : k]}</button>`).join("")}</nav>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; store.set("tab", tab); render(); });
}

function home() {
  const list = STORIES.filter(s => genre === "all" || s.genre === genre), f = favs();
  shell(`<span class="label">Top rated</span>
    <div class="slider" id="slider" aria-label="Top 5 stories">${TOP.map(h => `<button class="hero" id="h-${h.id}" data-id="${h.id}">${cover(h)}<span class="shade"></span><div><small>★ ${rating(h)} · ${GENRES[h.genre]}${h.episodes.length > 1 ? " · " + h.episodes.length + " parts" : ""}</small><b>${esc(h.title)}</b></div></button>`).join("")}</div>
    <div class="dots" id="dots">${TOP.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>
    <div class="chips" role="group" aria-label="Genre">${Object.entries(GENRES).map(([k, v]) => `<button class="chip" id="g-${k}" data-g="${k}" aria-pressed="${k === genre}">${v}</button>`).join("")}</div>
    <div class="grid">${list.map(s => `<button class="tile" id="t-${s.id}" data-id="${s.id}">${cover(s)}<span class="shade"></span>
      ${f.includes(s.id) ? `<span class="fav">${ICON.heart}</span>` : ""}
      <div><b>${esc(s.title)}</b><span class="pills"><span class="pill">${GENRES[s.genre]}</span><span class="pill">${progress(s) ? progress(s) + "%" : "~" + Math.max(1, Math.round(totalOf(s) * 4 / 60)) + " min"}</span></span></div></button>`).join("")}</div>
    <p class="hint">Hold your finger on a story to add it to favourites</p>`);
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { genre = b.dataset.g; home(); });
  app.querySelectorAll("[data-id]").forEach(b => {
    const pressed = longPress(b, () => { toggleFav(b.dataset.id); home(); });
    b.onclick = () => { if (!pressed()) preview(b.dataset.id); };
  });
  startSlider();
}

/* Featured slider: swipe by hand, auto-advances every 4 s, pauses while touched. */
let slideTimer = null;
function startSlider() {
  clearInterval(slideTimer);
  const el = document.getElementById("slider"), dots = [...document.querySelectorAll("#dots i")];
  if (!el) return;
  const index = () => Math.round(el.scrollLeft / el.clientWidth);
  let shown = 0;
  const mark = () => { const i = index(); if (i === shown) return; shown = i;
    dots.forEach((d, k) => { d.classList.remove("on"); if (k === i) { void d.offsetWidth; d.classList.add("on"); } }); };
  const dotsBox = document.getElementById("dots");
  el.addEventListener("scroll", () => requestAnimationFrame(mark), { passive: true });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let pausedUntil = 0;
  ["pointerdown", "touchstart", "wheel"].forEach(e => el.addEventListener(e, () => { pausedUntil = Date.now() + 6000; dotsBox.classList.add("manual"); }, { passive: true }));
  let lastMove = Date.now();
  slideTimer = setInterval(() => {
    if (!document.body.contains(el)) return clearInterval(slideTimer);
    if (Date.now() < pausedUntil || document.hidden) { lastMove = Date.now(); return; }
    if (dotsBox.classList.contains("manual")) {   // resume: restart the fill on the current dot
      dotsBox.classList.remove("manual"); const d = dots[shown]; d.classList.remove("on"); void d.offsetWidth; d.classList.add("on"); lastMove = Date.now(); return; }
    if (Date.now() - lastMove < 3950) return;
    lastMove = Date.now();
    el.scrollTo({ left: ((index() + 1) % dots.length) * el.clientWidth, behavior: "smooth" });
  }, 250);
}

function favourites() {
  const f = favs(), list = STORIES.filter(s => f.includes(s.id));
  if (!list.length) return shell(`<div class="empty"><svg viewBox="0 0 150 120" aria-hidden="true"><rect x="10" y="20" width="56" height="56" rx="10" fill="#5f5b7d"/><rect x="10" y="84" width="56" height="34" rx="10" fill="#5f5b7d"/><rect x="74" y="84" width="56" height="34" rx="10" fill="#5f5b7d"/><rect x="72" y="2" width="74" height="74" rx="12" fill="#a7a3bb"/><circle cx="92" cy="40" r="7" fill="#8e8aa6"/><circle cx="106" cy="30" r="7" fill="#8e8aa6"/><circle cx="128" cy="40" r="11" fill="#7b57c9"/><path d="M128 46s-6-3.5-6-7.2c0-2 1.4-3.3 3-3.3 1.2 0 2.2.7 3 1.8.8-1.1 1.8-1.8 3-1.8 1.6 0 3 1.3 3 3.3 0 3.7-6 7.2-6 7.2z" fill="#fff"/></svg><b>It's empty in here :(</b><span>Hold your finger on a story</span></div>`);
  const groups = Object.keys(GENRES).filter(g => g !== "all" && list.some(s => s.genre === g));
  shell(groups.map(g => `<span class="label">${GENRES[g]}</span>` + list.filter(s => s.genre === g).map(s =>
    `<div class="row-card" id="r-${s.id}" data-id="${s.id}"><button class="remove" data-remove="${s.id}">Remove</button>
      <button class="face" data-open="${s.id}">${cover(s)}<span class="shade"></span><div><b>${esc(s.title)}</b><small>Completed ${progress(s)}%</small></div></button></div>`).join("")).join("") +
    `<p class="hint">Swipe a story left to remove it</p>`);
  app.querySelectorAll(".row-card").forEach(card => {
    let x0 = null;
    card.addEventListener("pointerdown", e => { x0 = e.clientX; });
    card.addEventListener("pointerup", e => { if (x0 != null) { const dx = e.clientX - x0; if (dx < -40) card.classList.add("open"); else if (dx > 40) card.classList.remove("open"); } x0 = null; });
  });
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const card = b.closest(".row-card"); if (card.classList.contains("open")) return card.classList.remove("open"); preview(b.dataset.open); });
  app.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { toggleFav(b.dataset.remove); favourites(); });
}

function search() {
  const recent = store.get("recent", []).map(id => STORIES.find(s => s.id === id)).filter(Boolean);
  const row = s => `<button class="item" id="i-${s.id}" data-id="${s.id}"><span class="thumb">${cover(s)}</span><div><b>${esc(s.title)}</b><small>${GENRES[s.genre]}</small></div></button>`;
  const found = STORIES.filter(s => s.title.toLowerCase().includes(query.toLowerCase()));
  shell(`<label class="search">${ICON.search}<input id="q" type="search" placeholder="Search" value="${esc(query)}" autocomplete="off"></label>
    <div id="results">${query ? `<div class="list">${found.map(row).join("") || '<p class="hint">Nothing found</p>'}</div>` :
      (recent.length ? `<span class="label">Recent</span><div class="list">${recent.map(row).join("")}</div>` : "") +
      `<span class="label">Popular</span><div class="list">${STORIES.map(row).join("")}</div>`}</div>`);
  const q = document.getElementById("q");
  q.oninput = () => { query = q.value; const pos = q.selectionStart; search(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => preview(b.dataset.id));
}

function menu() {
  shell(["Subscription", "Language", "Rate the App", "Share the App", "Restore Purchases", "E-mail Support", "Suggest a Story"]
    .map((n, i) => `<button id="m-${i}" data-m="${n}">${n}</button>`).join("") + `<p>For each suggested story we publish you get $20</p>`);
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => toast(b.dataset.m + " — in the iPhone app"));
}

/* Story preview: cover, numbers, description, parts. Rating is a demo value until real reviews exist. */
let lastCard = null;
document.addEventListener("pointerdown", e => { lastCard = e.target.closest("[data-id],[data-open]"); }, true);
function preview(id) {
  clearInterval(slideTimer);
  const card = lastCard && document.body.contains(lastCard) ? lastCard : null; lastCard = null;
  const from = card ? card.getBoundingClientRect() : null;
  const ghost = card ? card.cloneNode(true) : null;
  const s = STORIES.find(x => x.id === id), pct = progress(s), total = totalOf(s), liked = favs().includes(id);
  const st = store.get("p:" + id, { ep: 0, i: 0 });
  app.innerHTML = `<section class="preview">
    <div class="pv-cover">${cover(s)}<span class="shade"></span><span class="pull" aria-hidden="true"></span>
      <button class="back" id="pv-back" aria-label="Back">‹</button>
      <button class="like" id="pv-like" aria-pressed="${liked}" aria-label="Favourite">${ICON.heart}</button>
      <div><small>${GENRES[s.genre]}</small><h1>${esc(s.title)}</h1></div></div>
    <div class="pv-body">
      <div class="stats">
        <div class="stat"><b>★ ${rating(s).toFixed(1)}</b><span>Rating</span></div>
        <div class="stat"><b>~${Math.max(1, Math.round(total * 4 / 60))} min</b><span>Read</span></div>
        <div class="stat"><b>${s.episodes.length}</b><span>${s.episodes.length > 1 ? "Parts" : "Part"}</span></div>
        <div class="stat"><b>${total}</b><span>Messages</span></div>
      </div>
      <p class="desc">${esc(s.description)}</p>
      ${s.author ? `<span class="by">Written by ${esc(s.author)}</span>` : ""}
      ${s.episodes.length > 1 ? `<div class="parts">${s.episodes.map((e, i) => `<button class="part" id="pt-${i}" data-ep="${i}"><span>Part ${i + 1}</span><small>${e.messages.length} messages${i < st.ep ? " · read" : ""}</small></button>`).join("")}</div>` : ""}
      <button class="read" id="pv-read">${pct >= 100 ? "Read again" : pct ? "Continue · " + pct + "%" : "Start reading"}</button>
      <p class="demo">Rating is a sample value in this preview.</p>
    </div></section>`;
  const sheet = app.querySelector(".preview"), head = sheet.querySelector(".pv-cover");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, ease = "cubic-bezier(.2,.85,.25,1)";
  const box = r => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  const float = (el, r) => {
    Object.assign(el.style, { position: "fixed", ...box(r), margin: 0, zIndex: 50, pointerEvents: "none", overflow: "hidden", aspectRatio: "auto", transform: "none" });
    el.removeAttribute("id"); el.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
    document.body.appendChild(el); return el;
  };
  if (from && ghost && sheet.animate && !still) {
    /* Open: the tapped card grows into the cover. Its own caption fades out first; the
       preview cover and title fade in over the last part of the move, so nothing pops. */
    const to = head.getBoundingClientRect(), dur = 480;
    float(ghost, from).style.borderRadius = "14px";
    ghost.querySelectorAll(".shade, div, .fav").forEach(n => n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur * .3, fill: "forwards" }));
    ghost.animate([{ ...box(from), borderRadius: "14px" }, { ...box(to), borderRadius: "0px" }], { duration: dur, easing: ease, fill: "forwards" });
    head.animate([{ opacity: 0 }, { opacity: 0, offset: .5 }, { opacity: 1 }], { duration: dur, easing: "ease-out" });
    ghost.animate([{ opacity: 1 }, { opacity: 1, offset: .55 }, { opacity: 0 }], { duration: dur, fill: "forwards" }).onfinish = () => ghost.remove();
    sheet.querySelector(".pv-body").animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur * .6, delay: dur * .35, easing: "ease-out", fill: "backwards" });
  }
  function close() {
    /* Close: the cover shrinks back into its card (when that card is on screen), else fades away. */
    if (!sheet.animate || still) return render();
    const r = head.getBoundingClientRect(), g = float(head.cloneNode(true), r);
    g.querySelectorAll(".back, .like, .pull").forEach(n => n.remove());
    render();
    const vh = innerHeight, target = [...app.querySelectorAll(`[data-id="${id}"], [data-open="${id}"]`)]
      .find(el => { const b = el.getBoundingClientRect(); return b.width > 0 && b.top >= 0 && b.bottom <= vh && b.left >= 0 && b.right <= innerWidth; });
    if (!target) { g.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(40px) scale(.96)" }], { duration: 260, easing: "ease-in" }).onfinish = () => g.remove(); return; }
    const t = target.getBoundingClientRect(), dur = 420;
    target.animate([{ opacity: 0 }, { opacity: 0, offset: .6 }, { opacity: 1 }], { duration: dur });
    g.querySelector("div")?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur * .3, fill: "forwards" });
    g.animate([{ ...box(r), borderRadius: "0px" }, { ...box(t), borderRadius: "14px" }], { duration: dur, easing: ease, fill: "forwards" });
    g.animate([{ opacity: 1 }, { opacity: 1, offset: .65 }, { opacity: 0 }], { duration: dur, fill: "forwards" }).onfinish = () => g.remove();
  }
  document.getElementById("pv-back").onclick = close;
  /* Swipe down from the top of the preview to close it. */
  let y0 = null, dy = 0;
  const startDrag = y => { if (sheet.scrollTop <= 0) { y0 = y; dy = 0; sheet.style.transition = "none"; } };
  const moveDrag = (y, e) => {
    if (y0 == null) return; dy = Math.max(0, y - y0);
    if (dy > 0 && e.cancelable) e.preventDefault();
    sheet.style.transform = dy ? `translateY(${dy * .55}px) scale(${1 - Math.min(dy, 400) / 2600})` : "";
    sheet.style.borderRadius = dy ? Math.min(24, dy / 6) + "px" : "";
  };
  const endDrag = () => {
    if (y0 == null) return; y0 = null;
    if (dy > 110) return close();
    sheet.style.transition = "transform .3s cubic-bezier(.2,.9,.2,1), border-radius .3s"; sheet.style.transform = ""; sheet.style.borderRadius = "";
  };
  sheet.addEventListener("touchstart", e => startDrag(e.touches[0].clientY), { passive: true });
  sheet.addEventListener("touchmove", e => moveDrag(e.touches[0].clientY, e), { passive: false });
  sheet.addEventListener("touchend", endDrag); sheet.addEventListener("touchcancel", endDrag);
  sheet.addEventListener("mousedown", e => startDrag(e.clientY));
  addEventListener("mousemove", e => moveDrag(e.clientY, e)); addEventListener("mouseup", endDrag);
  document.getElementById("pv-like").onclick = () => { toggleFav(id); preview(id); };
  document.getElementById("pv-read").onclick = () => openStory(id, pct >= 100 ? 0 : undefined);
  app.querySelectorAll("[data-ep]").forEach(b => b.onclick = () => openStory(id, +b.dataset.ep));
}

function render() { clearInterval(slideTimer); ({ menu, home, fav: favourites, search }[tab] || home)(); }

let timer = null;
function openStory(id, epIndex) {
  const s = STORIES.find(x => x.id === id);
  store.set("recent", [id, ...store.get("recent", []).filter(x => x !== id)].slice(0, 3));
  let st = store.get("p:" + id, { ep: 0, i: 0 });
  if (epIndex != null) st = { ep: epIndex, i: 0 };
  if (st.ep >= s.episodes.length) st = { ep: 0, i: 0 };
  const ep = s.episodes[st.ep];
  app.innerHTML = `<section class="chat">
      <div class="head"><button class="back" id="back" aria-label="Back">‹</button><div class="avatar">${esc(ep.left[0])}</div>
        <div class="who"><b>${esc(ep.left)}</b><small id="status">online</small></div>
        <span class="ep">${s.episodes.length > 1 ? "Part " + (st.ep + 1) + " of " + s.episodes.length : ""}</span></div>
      <div class="log" id="log" aria-live="polite"><div class="intro">${esc(ep.description || s.description)}</div></div>
      <div class="foot" id="foot"></div></section>`;
  const log = document.getElementById("log"), foot = document.getElementById("foot"), status = document.getElementById("status");
  document.getElementById("back").onclick = () => { clearTimeout(timer); preview(id); };
  const add = m => { const d = document.createElement("div"); d.className = "msg " + (m.from === ep.right ? "me" : "them"); d.textContent = m.text; log.appendChild(d); };
  for (let k = 0; k < st.i; k++) add(ep.messages[k]);
  log.scrollTop = log.scrollHeight;
  let busy = false;
  const save = () => store.set("p:" + id, st);
  function controls() {
    if (st.i >= ep.messages.length) {
      const last = st.ep + 1 >= s.episodes.length;
      log.insertAdjacentHTML("beforeend", `<div class="end"><strong>${last ? "The End" : "To be continued…"}</strong><span>${esc(s.title)}${s.episodes.length > 1 ? " · part " + (st.ep + 1) : ""}</span></div>`);
      log.scrollTop = log.scrollHeight;
      foot.innerHTML = `${last ? "" : `<button class="tap primary" id="next">Next part</button>`}<button class="tap" id="again">${last ? "Read again" : "Restart"}</button>`;
      const next = document.getElementById("next");
      if (next) next.onclick = () => { store.set("p:" + id, { ep: st.ep + 1, i: 0 }); openStory(id, st.ep + 1); };
      document.getElementById("again").onclick = () => { store.set("p:" + id, { ep: 0, i: 0 }); openStory(id, 0); };
      if (last) { st = { ep: s.episodes.length, i: 0 }; save(); }
      return;
    }
    foot.innerHTML = `<button class="tap" id="tap">Tap to continue</button>`;
    document.getElementById("tap").onclick = step;
  }
  function step() {
    if (busy || st.i >= ep.messages.length) return;
    const m = ep.messages[st.i];
    if (m.from === ep.right) { add(m); st.i++; save(); log.scrollTop = log.scrollHeight; return controls(); }
    busy = true; status.textContent = "typing…";
    const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(t); log.scrollTop = log.scrollHeight;
    const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 150 : Math.min(1800, 450 + m.text.length * 22);
    timer = setTimeout(() => { t.remove(); add(m); st.i++; save(); status.textContent = "online"; busy = false; log.scrollTop = log.scrollHeight; controls(); }, delay);
  }
  log.onclick = step;
  controls();
}

render();
</script>
