<title>Squeal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: the original 2018 Squeal design — indigo night, four tabs (menu, home, favourites, search) and a full-screen chat reader. */
:root {
  --bg: #26243f;          /* indigo night, from the original mockups */
  --deep: #17122c;        /* card shade behind covers */
  --tabbar: #1f1d36;
  --field: #34315a;       /* search field, chips */
  --text: #ffffff;
  --muted: #9b97b3;       /* lavender captions */
  --accent: #7b57c9;      /* favourite heart, active states */
  --danger: #b5525b;      /* remove */
  --red: #b5525b;         /* "red" in Squeal: the pale red of the owl's eyes (blood fill, remove) */
  --them: #36335a;
  --me: #6a4bb8;
  --font: "Avenir Next", Avenir, "Nunito Sans", -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; }
.view { flex: 1; overflow-y: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior-y: contain; }
.label { color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }

/* Tab bar */
.tabs { position: relative; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--tabbar);
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.tabs button { display: grid; place-items: center; padding: 6px; color: #6f6b8c; }
.tabs button[aria-current="page"] { color: var(--text); }
.tabs svg { width: 26px; height: 26px; }

/* Covers: drawn scenes, one per story */
.cover { position: absolute; inset: 0; width: 100%; height: 100%; }
img.cover { object-fit: cover; object-position: center 35%; filter: saturate(.85) brightness(.9); }
.row-card .face img.cover { left: 40%; width: 60%; }

/* Home */
/* the slider runs edge to edge of the screen, so whole cards slide out left and the next comes in
   from the right, whether you swipe or it turns by itself (it used to clip inside a rounded frame) */
.slider { flex: none; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: max(18px, env(safe-area-inset-left, 0px)); scrollbar-width: none;
  margin-inline: calc(-1 * max(18px, env(safe-area-inset-left, 0px))); padding-inline: max(18px, env(safe-area-inset-left, 0px));
  scroll-padding-inline: max(18px, env(safe-area-inset-left, 0px)); }
.slider::-webkit-scrollbar { display: none; }
.slider .hero { flex: 0 0 100%; scroll-snap-align: center; }
/* Slider dots: a "worm". The active pill stretches its head to the next dot as the slide moves,
   then pulls its tail after it; inside, a bright fill runs out the time to the next slide. */
.dots { flex: none; position: relative; display: flex; justify-content: center; gap: 10px; height: 6px; margin-top: -2px; }
.dots i { flex: none; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #4a4670; }
.dots .worm { position: absolute; top: 0; left: 0; z-index: 1; height: 6px; border-radius: 3px; background: #5d5888;
  overflow: hidden; will-change: transform, width; }
.dots .worm b { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 3px; transform-origin: left;
  background: linear-gradient(90deg, #b9a3ff, #fff); box-shadow: 0 0 10px rgba(185,163,255,.65); transform: scaleX(0); }
.preview { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); overscroll-behavior-y: contain; transform-origin: 50% 0; }
.pull { position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: rgba(255,255,255,.35); z-index: 2; }
.pv-cover { position: relative; min-height: 260px; display: flex; align-items: flex-end; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); }
.pv-cover .shade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 4%, rgba(38,36,63,0) 70%); }
.pv-cover .back { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; padding: 0 0 3px; }
.pv-cover .like, .chrome .like { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; color: var(--muted); }
.pv-cover .like[aria-pressed="true"], .chrome .like[aria-pressed="true"] { color: var(--text); background: var(--accent); }
.pv-cover .like svg, .chrome .like svg { width: 18px; height: 18px; }
.sheet .cap small { display: flex; align-items: center; line-height: 1; }
.cap small .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; margin: 0 9px; opacity: .7; flex: none; transform: translateY(-.5px); }
/* start over: tap clears the part being read; hold (a ring fills round the button) clears every part */
.chrome .reset { position: absolute; top: 10px; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 46px); width: 38px; height: 38px;
  border-radius: 50%; background: rgba(23,18,44,.6); color: var(--muted); display: grid; place-items: center; touch-action: none; -webkit-user-select: none; user-select: none; }
.chrome .reset svg { width: 17px; height: 17px; grid-area: 1 / 1; transition: transform .45s cubic-bezier(.32,.72,0,1); }
.chrome .reset .hold { width: 38px; height: 38px; transform: rotate(-90deg); fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round;
  stroke-dasharray: 110; stroke-dashoffset: 110; opacity: 0; }
.chrome .reset.holding .hold { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .6s linear, opacity .1s; }
.chrome .reset.spin svg:not(.hold) { transform: rotate(-360deg); }
.chrome .note { position: absolute; top: 56px; right: max(12px, env(safe-area-inset-right, 0px)); padding: 8px 13px; border-radius: 12px;
  background: rgba(23,18,44,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--text); font-size: 13px; font-weight: 600;
  white-space: nowrap; transform-origin: top right; animation: noteIn .3s cubic-bezier(.32,.72,0,1) both; }
.chrome .note.out { animation: noteOut .25s ease-in both; }
@keyframes noteIn { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes noteOut { to { opacity: 0; transform: translateY(-4px); } }
.pv-cover div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.pv-cover small { color: var(--muted); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.pv-cover h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.1; text-wrap: balance; }
.pv-body > * { animation: up .5s cubic-bezier(.2,.9,.2,1) both; }
.pv-body > *:nth-child(2) { animation-delay: .06s } .pv-body > *:nth-child(3) { animation-delay: .12s } .pv-body > *:nth-child(n+4) { animation-delay: .18s }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
.pv-body { padding: 4px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--field); border-radius: 12px; padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.desc { margin: 0; line-height: 1.55; color: #dcd9ea; max-width: 60ch; }
.by { color: var(--muted); font-size: 14px; }
.parts { display: flex; flex-direction: column; gap: 8px; }
.part { display: flex; justify-content: space-between; align-items: center; background: var(--field); border-radius: 12px; padding: 12px 14px; text-align: left; }
.part small { color: var(--muted); }
.read { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 16px; border-radius: 14px; background: var(--accent); font-weight: 700; font-size: 17px; }
.read::before { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.16); transform-origin: left; transform: scaleX(var(--f, 0)); }
.read svg, .read span { position: relative; } .read svg { width: 16px; height: 16px; }
.part { position: relative; overflow: hidden; }
.part > * { position: relative; }
/* water: the part fills from the bottom up to how much of it is read. Two waves, each one drawn
   path made of several sines (no tiles, so no cuts between crests), roll against each other with a
   faint light on the crest, then the surface settles flat and still. (Blood and fog: see git.) */
.part .water, .tfill .water { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
.part .water i, .tfill .water i { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--f, 0) * 100%); background: #554a8a;
  animation: rise 1s cubic-bezier(.25,.8,.25,1) both; }
.part .water svg, .tfill .water svg { position: absolute; left: 0; bottom: calc(100% - 1px); width: 200%; height: 8px; transform-origin: 50% 100%; overflow: visible; }
.part .water .w1, .tfill .water .w1 { z-index: 1; animation: roll 2.2s linear 2, settle 2.4s cubic-bezier(.4,0,.2,1) 1.9s forwards; }
.part .water .w1 .body, .tfill .water .w1 .body { fill: #554a8a; }
.part .water .w1 .crest, .tfill .water .w1 .crest { fill: none; stroke: rgba(214,204,255,.45); stroke-width: .5; vector-effect: non-scaling-stroke; }
.part .water .w2, .tfill .water .w2 { height: 10px; animation: roll2 3.1s linear 2, settle 2.2s cubic-bezier(.4,0,.2,1) 1.7s forwards; }
.part .water .w2 path, .tfill .water .w2 path { fill: #463d78; }
.part.done .water svg { display: none; }
@keyframes rise { from { height: 0; } }
@keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes roll2 { from { transform: translateX(-50%); } to { transform: translateX(0); } }
@keyframes settle { to { scale: 1 0; opacity: .0; } }        /* the surface goes flat and still */
@media (prefers-reduced-motion: reduce) { .part .water i, .part .water svg { animation: none; } .part .water svg { display: none; } }
.part.here::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px #9b7ff0; pointer-events: none; }   /* above the water */
.part { transition: box-shadow .2s, transform .15s; }
.part:active { transform: scale(.97); }
.part .ok { font-style: normal; color: #b9a3ff; font-size: 12px; }
.demo { color: #6f6b8c; font-size: 11px; text-align: center; }
.hero { position: relative; border-radius: 14px; overflow: hidden; min-height: 190px; background: var(--deep); text-align: left; display: flex; align-items: flex-end; padding: 18px; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,18,44,.95) 10%, rgba(23,18,44,0) 75%); }
.hero div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.hero b { font-size: 26px; font-weight: 600; text-wrap: balance; }
.hero small { color: var(--muted); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.chips { flex: none; display: flex; gap: 8px; overflow-x: auto; }
.chip { flex: none; padding: 7px 16px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--text); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; aspect-ratio: 1 / 1.15; border-radius: 14px; overflow: hidden; background: var(--deep); text-align: left; display: flex; align-items: flex-end; padding: 12px; }
.tile .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,18,44,.96) 15%, rgba(23,18,44,.05) 70%); }
.tile div { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile b { font-size: 17px; font-weight: 600; line-height: 1.2; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 11px; color: var(--muted); background: rgba(52,49,90,.85); padding: 3px 8px; border-radius: 999px; }
.tile .fav { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.tile .fav svg { width: 14px; height: 14px; }
.tile .fav.pop { animation: favPop .34s cubic-bezier(.3,1.6,.5,1) both; }
.tile .fav.out { animation: favOut .2s ease-in both; }
@keyframes favPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes favOut { to { transform: scale(0); opacity: 0; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 6px); } }
.grid.swap .tile { animation: up .32s cubic-bezier(.25,.8,.25,1) both; }
.hint { color: var(--muted); font-size: 13px; text-align: center; }

/* Favourites */
.row-card { position: relative; border-radius: 14px; overflow: visible; touch-action: pan-y; }   /* the whole card slides, not its picture inside a frame */
.row-card .remove { position: absolute; inset: 0 0 0 auto; width: 0; padding: 0; visibility: hidden; background: var(--danger); color: var(--text); font-weight: 600; border-radius: 14px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
.row-card .remove span { display: block; flex: none; }
.row-card.snap .face, .row-card.snap .remove, .row-card.snap .remove span { transition: transform .34s cubic-bezier(.32,.72,0,1), width .34s cubic-bezier(.32,.72,0,1), opacity .2s; }
.row-card.gone { transition: height .26s ease, margin .26s ease, opacity .2s; overflow: hidden; }
.row-card .face { position: relative; display: flex; align-items: center; min-height: 110px; padding: 20px; background: var(--deep); border-radius: 14px; width: 100%; text-align: left; overflow: hidden; will-change: transform; }
.row-card .face svg.cover { left: 40%; width: 60%; }
.row-card .face .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--deep) 42%, rgba(23,18,44,0) 85%); }
.row-card .face div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.row-card b { font-size: 24px; font-weight: 600; }
.row-card small { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }

/* Search */
.search { display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 12px; padding: 10px 12px; color: var(--muted); }
.search svg { width: 18px; height: 18px; flex: none; }
.search input { flex: 1; min-width: 0; color: var(--text); outline: none; }
.search { transition: box-shadow .2s; }
.search:focus-within { box-shadow: 0 0 0 1.5px #9b7ff0; }
/* the search field stays put at the top; the dial and the stories scroll away underneath it */
.sbar { position: sticky; top: -18px; z-index: 3; margin-top: -18px; padding-top: 18px; padding-bottom: 6px; background: var(--bg); }
.sbar { display: flex; align-items: center; gap: 0; }
.sbar .search { flex: 1; min-width: 0; }
.sbar input::-webkit-search-cancel-button { display: none; }
/* Cancel: slides in beside the field while searching; one tap clears the text, drops the keyboard,
   and brings the fear dial back */
.s-cancel { flex: none; max-width: 0; overflow: hidden; opacity: 0; white-space: nowrap; color: #b9a3ff; font-size: 16px; font-weight: 600;
  transition: max-width .28s cubic-bezier(.32,.72,0,1), opacity .2s, margin .28s cubic-bezier(.32,.72,0,1); }
.sbar.active .s-cancel { max-width: 90px; opacity: 1; margin-left: 12px; }
.sbar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; background: linear-gradient(var(--bg), rgba(38,36,63,0)); pointer-events: none; }
.search input::placeholder { color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { display: flex; align-items: center; gap: 14px; text-align: left; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex: none; background: var(--deep); }
.item div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item b { font-size: 18px; font-weight: 600; }
.item small { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
/* Fear dial: a half-round gauge; drag along it or tap a mark, the needle swings, the arc warms from violet
   to red, and the stories of that fear level appear below. It fades away while you type a search. */
.fear { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 6px; transition: opacity .25s, transform .25s; }
.fear.gone { opacity: 0; transform: translateY(-8px); pointer-events: none; }
.fear.out { display: none; }
.fear svg { width: min(290px, 100%); height: auto; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
.fear svg:focus { outline: none; }
.fear .needle { transform-origin: 120px 124px; transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.fear.drag .needle { transition: none; }
.fear .mark { cursor: pointer; }
.fear-name { font-size: 22px; font-weight: 800; letter-spacing: .02em; transition: color .3s; margin-top: -6px; }
.fear-sub { color: var(--muted); font-size: 13px; }
#results { display: flex; flex-direction: column; gap: 14px; }

/* Menu */
/* Menu: one column of equal, soft buttons centred on the screen; subscription is the filled one.
   Groups are set apart by a little more space. Same width, same height, same type for every item. */
.view.menu { justify-content: center; align-items: center; gap: 22px; padding-block: 24px; }
.m-list { flex: none; width: min(300px, 100%); display: flex; flex-direction: column; gap: 10px; }
.m-row, .m-sub { flex: none; width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px;
  border-radius: 16px; font-size: 17px; font-weight: 700; transition: transform .15s, background .15s; }
.m-row { background: #2e2b50; color: var(--text); }
.m-row:active { background: #363262; transform: scale(.98); }
.m-sub { background: var(--accent); color: #fff; box-shadow: 0 8px 22px rgba(123,87,201,.3); }
.m-sub svg { width: 19px; height: 19px; }
.m-sub:active { transform: scale(.98); }

/* Empty states */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding-block: 40px; }
.empty svg { width: 150px; height: 150px; }
.empty b { font-size: 20px; }
.empty span { color: var(--muted); }
.empty > * { animation: emptyIn .6s cubic-bezier(.25,.8,.25,1) both; }
.empty > :nth-child(2) { animation-delay: .1s; } .empty > :nth-child(3) { animation-delay: .18s; }
@keyframes emptyIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
/* adding a favourite, minimal: the card sinks under the finger while held, settles back when it
   takes, and the heart fades in */
.tile, .hero { transition: transform .3s cubic-bezier(.25,.8,.25,1); }
.tile.pressing, .hero.pressing { transform: scale(.96); transition-duration: .5s; }
.tile .fav { z-index: 2; }
.tfill { position: absolute; inset: 0; z-index: 0; pointer-events: none; border-radius: inherit; overflow: hidden; }
.tfill .water i { background: rgba(123,87,201,.5); }
.tfill .water .w1 .body { fill: rgba(123,87,201,.5); }
.tfill .water .w2 path { fill: rgba(90,64,170,.4); }
.tfill .water svg { bottom: 100%; height: 9px; }
.tfill .water .w2 { height: 11px; }
.tfill b { position: absolute; right: 10px; bottom: min(calc(var(--f) * 100% + 10px), calc(100% - 24px)); z-index: 1; font-size: 11px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); animation: tLbl 1s cubic-bezier(.25,.8,.25,1) both; }
@keyframes tLbl { from { bottom: 10px; opacity: 0; } }
.tile .fav.pop { animation: favIn .3s ease-out both; }
@keyframes favIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .empty > * { animation: none; } .tile .fav.pop { animation: none; } }

/* Overlay layers: the story sheet grows out of its card; the chat slides in over it. */
#layer { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
#layer > * { pointer-events: auto; }
.sheet { position: fixed; overflow: hidden; background: var(--bg); will-change: clip-path, transform; contain: layout paint; }
.sheet.morph .pv-cover { overflow: visible; }
.sheet .pv-body { contain: layout paint; }
/* moving parts are their own GPU layers: they glide by fractions of a pixel instead of snapping */
.sheet .pv-body, .sheet .cap, .sheet .chrome, .sheet .ghost, .sheet .ghost-shade, .sheet .shade, .screen { will-change: transform, opacity; backface-visibility: hidden; }
.sheet .ghost-shade { position: absolute; pointer-events: none; transform-origin: 0 0; }
.sheet .ghost { position: absolute; pointer-events: none; }
.sheet .ghost > * { position: relative !important; width: 100% !important; height: 100% !important; min-height: 0 !important; background: none !important; transform: none !important; }
.sheet { -webkit-user-select: none; user-select: none; }
.sheet .pv-body > * { animation: none; }
.sheet .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior-y: contain; }
.sheet .pv-cover { position: relative; height: 300px; min-height: 0; overflow: hidden; display: block; padding: 0; }
/* Still preview: one iPhone screen, nothing scrolls; the photo takes whatever height is left */
.sheet.still .scroll { overflow: hidden; display: flex; flex-direction: column; }

text": "“It?”"}, {"from": "James", "text": "They say you’re dead."}]}, {"left": "Patrick", "right": "James", "description": "Patrick insists that he isn’t dead, despite all of the evidence, and sets off back to Sandra’s house to find everyone and reveal the prank once and for all. He finds something else, entirely.", "messages": [{"from": "Patrick", "text": "I’m not dead."}, {"from": "Patrick", "text": "PHOTO: Selfie of Patrick"}, {"from": "Patrick", "text": "Do I look dead?"}, {"from": "Patrick", "text": "They made a mistake."}, {"from": "Patrick", "text": "I wasn’t hit by a car."}, {"from": "James", "text": "It’s you."}, {"from": "Patrick", "text": "It’s not."}, {"from": "James", "text": "It’s your clothes, your ID."}, {"from": "Patrick", "text": "Dead people can’t text, James."}, {"from": "Patrick", "text": "And they can’t take pictures."}, {"from": "Patrick", "text": "I mean, maybe I’m insane, but I’m not dead."}, {"from": "James", "text": "They showed us a picture"}, {"from": "Patrick", "text": "Of what?"}, {"from": "James", "text": "Of you."}, {"from": "Patrick", "text": "PHOTO: Selfie of Patrick (Same as previous)"}, {"from": "Patrick", "text": "That’s me."}, {"from": "Patrick", "text": "I’m still here."}, {"from": "James", "text": "Where?"}, {"from": "Patrick", "text": "In front of my house?"}, {"from": "James", "text": "That you can’t get in?"}, {"from": "James", "text": "Maybe that’s why you couldn’t get in the party."}, {"from": "Patrick", "text": "This is one big prank, isn’t it?"}, {"from": "Patrick", "text": "You guys are hiding behind the bushes aren’t you?"}, {"from": "Patrick", "text": "I don’t know how you turned the power off, but I bet you did."}, {"from": "James", "text": "It’s not a prank."}, {"from": "Patrick", "text": "I’m alive."}, {"from": "Patrick", "text": "I must be seeing things, though."}, {"from": "Patrick", "text": "I mean, I can’t even see stars in the sky, how weird is that?"}, {"from": "Patrick", "text": "I bet you’re still at the  it."}, {"from": "James", "text": "Knew what? There’s nothing."}, {"from": "Patrick", "text": "I just found the party."}, {"from": "James", "text": "You did?"}, {"from": "Patrick", "text": "Yeah, see?"}, {"from": "Patrick", "text": "PHOTO: Teens at a party"}, {"from": "James", "text": "What are they?"}, {"from": "James", "text": "They’re not anyone I know"}, {"from": "James", "text": "But if YOU can see them…"}, {"from": "Patrick", "text": "If I can see them what?"}, {"from": "Patrick", "text": "WHAT?"}, {"from": "James", "text": "…then they’re just like you."}]}], "cover": "covers/legs-doorway.jpg"}, {"id": "clown", "title": "Clown", "description": "", "genre": "thriller", "author": "", "episodes": [{"left": "Zippo", "right": "Michael", "description": "", "messages": [{"from": "Zippo", "text": "Hello!"}, {"from": "Michael", "text": "Who is this?"}, {"from": "Zippo", "text": "PIC OF CLOWN"}, {"from": "Michael", "text": "Ha, ha. Very funny."}, {"from": "Zippo", "text": "Yes, very funny!"}, {"from": "Zippo", "text": "SAME PIC OF CLOWN."}, {"from": "Michael", "text": "Alright, stop it!"}, {"from": "Michael", "text": "I don’t like clowns."}, {"from": "Zippo", "text": "You don’t like clowns?"}, {"from": "Zippo", "text": "SAME PIC OF CLOWN"}, {"from": "Zippo", "text": "You don’t like ME?"}, {"from": "Michael", "text": "This isn’t funny."}, {"from": "Zippo", "text": "But you just said this was very funny!"}, {"from": "Michael", "text": "Who is this? Eric?"}, {"from": "Zippo", "text": "I’m Zippo the Clown!"}, {"from": "Michael", "text": "You’re Zippo the Annoying."}, {"from": "Zippo", "text": "Awwww, why don’t you like clowns?"}, {"from": "Michael", "text": "Because they’re creepy."}, {"from": "Zippo", "text": "SAME PIC OF CLOWN"}, {"from": "Zippo", "text": "Zippo isn’t creepy!"}, {"from": "Michael", "text": "I hate the way they look, too."}, {"from": "Zippo", "text": "Zippo is sad."}, {"from": "Michael", "text": "Stop texting me."}, {"from": "Zippo", "text": "Zippo’s feelings are hurt."}, {"from": "Zippo", "text": "What did clowns ever do to you?"}, {"from": "Michael", "text": "Leave me alone!"}, {"from": "Zippo", "text": "Zippo thinks you’re being rude."}, {"from": "Michael", "text": "Stop texting me!!!"}, {"from": "Zippo", "text": "Zippo is getting angry."}, {"from": "Michael", "text": "You can’t force me to like clowns."}, {"from": "Zippo", "text": "Zippo only wants to be friends."}, {"from": "Michael", "text": "I don’t care, leave me alone!"}, {"from": "Zippo", "text": "Zippo is MAD at Michael."}, {"from": "Zippo", "text": "Zippo is a good clown."}, {"from": "Michael", "text": "Why can’t you just stop?"}, {"from": "Michael", "text": "I NEVER WANT TO SEE ANOTHER CLOWN AGAIN!"}, {"from": "Zippo", "text": "You will see another clown."}, {"from": "Michael", "text": "Never."}, {"from": "Michael", "text": "I HATE Clowns."}, {"from": "Zippo", "text": "You will see one today."}, {"from": "Michael", "text": "I’m not going anywhere."}, {"from": "Zippo", "text": "You will still see one today."}, {"from": "Zippo", "text": "Zippo will come to your house."}, {"from": "Michael", "text": "Stay AWAY from my house."}, {"from": "Zippo", "text": "And Zippo will kill you."}, {"from": "Michael", "text": "You don’t even know where I live."}, {"from": "Zippo", "text": "2712 Jazzman Drive."}, {"from": "Michael", "text": "Fine, so you do."}, {"from": "Michael", "text": "Don’t you DARE come to my door, clown."}, {"from": "Zippo", "text": "Zippo wants to meet Michael."}, {"from": "Zippo", "text": "And teach him a lesson."}, {"from": "Michael", "text": "What?"}, {"from": "Zippo", "text": "Zippo wants to kill Michael."}, {"from": "Michael", "text": "KILL me?"}, {"from": "Zippo", "text": "Zippo doesn’t like those who are rude to clowns."}, {"from": "Michael", "text": "If I see you outside my door, I’m calling the police."}, {"from": "Zippo", "text": "That will not be possible, Michael."}, {"from": "Michael", "text": "Why?"}, {"from": "Zippo", "text": "Because Zippo is already in your house."}, {"from": "Zippo", "text": "…and Zippo will not allow it."}, {"from": "Michael", "text": "You’re NOT in my house."}, {"from": "Zippo", "text": "Yellow kitchen tile is very unusual."}, {"from": "Michael", "text": "Get your clown face OUT of my house."}, {"from": "Zippo", "text": "But Zippo has something to do first."}, {"from": "Michael", "text": "You don’t belong here."}, {"from": "Zippo", "text": "Clowns are everyone’s friend."}, {"from": "Zippo", "text": "Except Michael"}, {"from": "Michael", "text": "Just go away!"}, {"from": "Zippo", "text": "When Zippo kills Michael…"}, {"from": "Zippo", "text": "Clowns will be everyone’s friend again."}, {"from": "Michael", "text": "Are you still in the house?"}, {"from": "Zippo", "text": "Turn around, Michael…"}, {"from": "Zippo", "text": "…and see."}, {"from": "Zippo", "text": "SAME PIC OF CLOWN"}]}], "cover": "covers/clown-hush.jpg"}, {"id": "first-impressions", "title": "First Impressions", "description": "Ellen invites her new boyfriend over for dinner with her family. First impressions mean everything, so Jim’s a bit nervous. Ellen isn’t worried, though. Her family is convinced that she has good taste in men.", "genre": "horror", "author": "Rich Samuels", "episodes": [{"left": "Ellen", "right": "Jim", "description": "Ellen invites her new boyfriend over for dinner with her family. First impressions mean everything, so Jim’s a bit nervous. Ellen isn’t worried, though. Her family is convinced that she has good taste in men.", "messages": [{"from": "Ellen", "text": "I would really like you over for dinner."}, {"from": "Jim", "text": "Okay!"}, {"from": "Ellen", "text": "To my parent’s place."}, {"from": "Jim", "text": "I know. I knew it was coming."}, {"from": "Ellen", "text": "I think they would like you."}, {"from": "Jim", "text": "I have to admit, I’m a little nervous."}, {"from": "Ellen", "text": "You don’t need to be. Everyone will like you."}, {"from": "Jim", "text": "Everyone?"}, {"from": "Ellen", "text": "My brothers and sisters."}, {"from": "Jim", "text": "Everyone’s going to be there."}, {"from": "Ellen", "text": "Of course! Everyone wants to be a part of it."}, {"from": "Jim", "text": "Wow, your family really likes being part of your life."}, {"from": "Ellen", "text": "Yeah, they’re like that."}, {"from": "Jim", "text": "What’s your mom like?"}, {"from": "Ellen", "text": "She’s be fine. She’ll like you."}, {"from": "Ellen", "text": "She’ll be happy you have “meat on your ones” lol"}, {"from": "Jim", "text": "I’m still trying to lose it."}, {"from": "Ellen", "text": "But you won’t by next weekend, so that’s okay."}, {"from": "Jim", "text": "Yeah."}, {"from": "Ellen", "text": "She’s going to be so happy I found someone I would like."}, {"from": "Jim", "text": "Would like?"}, {"from": "Ellen", "text": "Well, DO like."}, {"from": "Jim", "text": "How many brothers and sisters do you have?"}, {"from": "Ellen", "text": "Five, I’m the oldest."}, {"from": "Jim", "text": "Well, that’s good at least."}, {"from": "Ellen", "text": "I guess. It’s a responsibility."}, {"from": "Ellen", "text": "You know, sometimes I have to take care of them."}, {"from": "Ellen", "text": "Make sure they’re fed."}, {"from": "Jim", "text": "Well, at least you’re older now. You can have your own life."}, {"from": "Ellen", "text": "That’s true."}, {"from": "Jim", "text": "Your family sounds nice, anyway."}, {"from": "Ellen", "text": "They are nice."}, {"from": "Ellen", "text": "Like I said, everyone’s going to like you."}, {"from": "Ellen", "text": "They’ve got good taste."}, {"from": "Jim", "text": "Well, I don’t know about that!"}, {"from": "Ellen", "text": "You have to trust me on this."}, {"from": "Jim", "text": "Are they going to be, like, protective?"}, {"from": "Ellen", "text": "Well, no."}, {"from": "Ellen", "text": "They know how to share."}, {"from": "Jim", "text": "That’s good."}, {"from": "Jim", "text": "I’ll do my best to make a good impression."}, {"from": "Ellen", "text": "Like they say you only get one chance to make a first impression."}, {"from": "Jim", "text": "I know. They’ll like me, I promise."}, {"from": "Ellen", "text": "Oh, one thing."}, {"from": "Jim", "text": "What’s that?"}, {"from": "Ellen", "text": "Don’t wear cologne."}, {"from": "Jim", "text": "Are they allergic?"}, {"from": "Ellen", "text": "Sort of."}, {"from": "Jim", "text": "Ok. No problem."}, {"from": "Jim", "text": "------"}, {"from": "Jim", "text": "Friday Afternoon"}, {"from": "Jim", "text": "Ellen?"}, {"from": "Ellen", "text": "Hi, you all ready?"}, {"from": "Jim", "text": "I’ll be heading over in a little while."}, {"from": "Ellen", "text": "Great! They’re all looking forward to you."}, {"from": "Ellen", "text": "….to seeing you."}, {"from": "Jim", "text": "I’m looking forward to seeing them, too!"}, {"from": "Jim", "text": "So, what we having for dinner?"}, {"from": "Ellen", "text": "Steak probably."}, {"from": "Ellen", "text": "My mom loves steak. So does my dad."}, {"from": "Ellen", "text": "Well, everyone."}, {"from": "Ellen", "text": "We’re all steak eaters."}, {"from": "Jim", "text": "I guess it’s steak, then!"}, {"from": "Jim", "text": "Good thing I’m not a vegetarian!"}, {"from": "Ellen", "text": "Good thing we’re not!"}, {"from": "Jim", "text": "I bet it’s going to be great."}, {"from": "Ellen", "text": "It is, my mom’s a great cook."}, {"from": "Jim", "text": "So, should I pick you up at 6:30?"}, {"from": "Ellen", "text": "No, you could just go straight to their house."}, {"from": "Ellen", "text": "I’m helping my parents get ready."}, {"from": "Ellen", "text": "There’s a lot of work to do."}, {"from": "Jim", "text": "Yeah, I guess there would be."}, {"from": "Ellen", "text": "They’re going to barbeque."}, {"from": "Jim", "text": "Awesome! I love barbeque."}, {"from": "Ellen", "text": "You can actually come a little earlier, if you want."}, {"from": "Jim", "text": "How early?"}, {"from": "Ellen", "text": "I’ll be there at four. You could come then."}, {"from": "Ellen", "text": "Then they wouldn’t have to rush."}, {"from": "Jim", "text": "Okay. I can do that."}, {"from": "Ellen", "text": "Great! I’ll tell my mom. She’ll be happy!"}, {"from": "Ellen", "text": "So will by brothers and sisters!"}, {"from": "Ellen", "text": "They like to eat early."}, {"from": "Jim", "text": "I bet it takes time to cook that much steak."}, {"from": "Ellen", "text": "It’s getting it ready that takes the time."}, {"from": "Ellen", "text": "Before you cook it."}, {"from": "Jim", "text": "Like marinating it or something?"}, {"from": "Ellen", "text": "Just, the butchering. You know, carving it up…"}, {"from": "Jim", "text": "Wow, you make it sound like you have a whole cow there!"}, {"from": "Ellen", "text": "Hardly. I promise you, we have NO cow."}, {"from": "Jim", "text": "Well that’s a relief!"}, {"from": "Jim", "text": "This sounds like it’s going to be an awesome dinner."}, {"from": "Ellen", "text": "It will!"}, {"from": "Ellen", "text": "It’s going to be delicious."}, {"from": "Jim", "text": "Ellen, I’m really happy to be part of your life."}, {"from": "Jim", "text": "And maybe even part of your family."}, {"from": "Ellen", "text": "So are we."}, {"from": "Ellen", "text": "My mom says I have good taste in men."}]}], "cover": "covers/laptop-dark.jpg"}, {"id": "grave", "title": "Grave", "description": "", "genre": "thriller", "author": "", "episodes": [{"left": "Jenna", "right": "Aaron", "description": "", "messages": [{"from": "Jenna", "text": "Help me"}, {"from": "Aaron", "text": "I think you texted the wrong person."}, {"from": "Jenna", "text": "Please help me."}, {"from": "Aaron", "text": "Seriously, you texted the wrong person."}, {"from": "Jenna", "text": "I’m trapped, I need help."}, {"from": "Aaron", "text": "Who were you trying to text?"}, {"from": "Jenna", "text": "I just need help, that’s all!"}, {"from": "Aaron", "text": "You made a mistake."}, {"from": "Jenna", "text": "Please!"}, {"from": "Aaron", "text": " ere. I can hear trains sometimes."}, {"from": "Aaron", "text": "There are trains?"}, {"from": "Jenna", "text": "Can you see a cemetery near a train track?"}, {"from": "Aaron", "text": "What do you mean?"}, {"from": "Jenna", "text": "Like, on Google?"}, {"from": "Aaron", "text": "I guess I can look."}, {"from": "Aaron", "text": "I guess there is one, north side of town."}, {"from": "Jenna", "text": "You have to go there!"}, {"from": "Aaron", "text": "And do what?"}, {"from": "Jenna", "text": "Dig me up! Save me!"}, {"from": "Jenna", "text": "At the Cemetery"}, {"from": "Aaron", "text": "How am I supposed to even find you?"}, {"from": "Jenna", "text": "Look around"}, {"from": "Aaron", "text": "I don’t even know what to look for!"}, {"from": "Jenna", "text": "Look for a freshly dug grave"}, {"from": "Aaron", "text": "I don’t have a shovel."}, {"from": "Jenna", "text": "Keep looking…"}, {"from": "Jenna", "text": "There’s always one around."}, {"from": "Aaron", "text": "Okay, I found one…I found a shovel."}, {"from": "Jenna", "text": "Did you find the grave?"}, {"from": "Aaron", "text": "I think so."}, {"from": "Jenna", "text": "Dig it up."}, {"from": "Aaron", "text": "I don’t think so. This is a cemetery."}, {"from": "Jenna", "text": "Please dig it up! I don’t think I can hold on."}, {"from": "Aaron", "text": "I’ll get the police."}, {"from": "Jenna", "text": "I’ll be dead by then."}, {"from": "Aaron", "text": "Okay, fine. I’ll dig."}, {"from": "Aaron", "text": "But once the police are here, I’m gone."}, {"from": "Jenna", "text": "Are you digging?"}, {"from": "Aaron", "text": "I’m digging."}, {"from": "Jenna", "text": "I can hear you! Thank god you’re here!"}, {"from": "Aaron", "text": "Did you hear that? I just reached the coffin."}, {"from": "Jenna", "text": "Open it up."}, {"from": "Aaron", "text": "Open up a coffin?"}, {"from": "Jenna", "text": "I’m trapped in here!"}, {"from": "Jenna", "text": "You have to let me out!"}, {"from": "Aaron", "text": "Okay, Okay. I’ll do it."}, {"from": "Jenna", "text": "Thank you so much."}, {"from": "Aaron", "text": "What’s going on here?"}, {"from": "Jenna", "text": "What do you mean?"}, {"from": "Aaron", "text": "I opened the lid."}, {"from": "Jenna", "text": "No you didn’t."}, {"from": "Aaron", "text": "Yes I did."}, {"from": "Aaron", "text": "It’s a dead body. A rotting body."}, {"from": "Jenna", "text": "Maybe you opened the wrong grave."}, {"from": "Aaron", "text": "I didn’t open the wrong grave."}, {"from": "Jenna", "text": "How do you know?"}, {"from": "Aaron", "text": "Because it says something on the lid."}, {"from": "Jenna", "text": "Says what?"}, {"from": "Aaron", "text": "“Our Darling Jenna.”"}, {"from": "Aaron", "text": "You’re dead."}, {"from": "Jenna", "text": "No, I’m trapped."}, {"from": "Aaron", "text": "I’m looking right at you."}, {"from": "Aaron", "text": "You’re really, really dead."}]}], "cover": "covers/rising-hand.jpg"}, {"id": "haunted", "title": "Haunted", "description": "", "genre": "horror", "author": "", "episodes": [{"left": "David", "right": "Carl", "description": "", "messages": [{"from": "David", "text": "How hard could it be? It’s just an old house."}, {"from": "Carl", "text": "A haunted house."}, {"from": "Carl", "text": "PIC: EXTERIOR OF HAUNTED HOUSE"}, {"from": "David", "text": "It’s just an old house. If we stay all night, we get $200."}, {"from": "Carl", "text": "Nobody’s ever stayed here all night"}, {"from": "David", "text": "That’s because they’re scared."}, {"from": "David", "text": "And there’s nothing to be scared of."}, {"from": "Carl", "text": "I hope not."}, {"from": "David", "text": "Do you see anything."}, {"from": "Carl", "text": "It’s not nighttime yet."}, {"from": "Carl", "text": "I don’t see why we can’t be together. Why do you have to be all the way upstairs?"}, {"from": "David", "text": "It makes it fun."}, {"from": "Carl", "text": "Fun? I don’t think so."}, {"from": "David", "text": "You really do think it’s haunted, don’t you?"}, {"from": "Carl", "text": "I don’t want to take any chances."}, {"from": "David", "text": "Well, don’t worry."}, {"from": "Carl", "text": "I’ll worry if I want."}, {"from": "David", "text": "You’re going to feel really stupid in the morning."}, {"from": "Carl", "text": "If there is a morning."}, {"from": "Carl", "text": "9pm"}, {"from": "David", "text": "Still alive"}, {"from": "Carl", "text": "Shut up."}, {"from": "David", "text": "I told you."}, {"from": "Carl", "text": "It’s only nine o’clock."}, {"from": "Carl", "text": "A long way to go."}, {"from": "David", "text": "I’ve got some nice moonlight coming through the window. Kind of cool."}, {"from": "Carl", "text": "You put me in the basement, so it’s totally dark."}, {"from": "David", "text": "I didn’t put you anywhere."}, {"from": "Carl", "text": "Except for the phone, it’s totally dark."}, {"from": "David", "text": "I hear there are rats in the basement."}, {"from": "Carl", "text": "Don’t say that."}, {"from": "David", "text": "Probably true."}, {"from": "Carl", "text": "Well, don’t remind me."}, {"from": "Carl", "text": "And I haven’t seen any rates, just so you know."}, {"from": "David", "text": "$200, just remember."}, {"from": "David", "text": "12 Midnight"}, {"from": "David", "text": "It’s midnight Carl."}, {"from": "Carl", "text": "I know."}, {"from": "David", "text": "Still alive?"}, {"from": "Carl", "text": "Very funny."}, {"from": "David", "text": "Anything weird happen?"}, {"from": "Carl", "text": "Very funny."}, {"from": "David", "text": "See, nothing weird."}, {"from": "Carl", "text": "Except your little pranks."}, {"from": "Carl", "text": "You think I don’t know?"}, {"from": "David", "text": "Know what?"}, {"from": "Carl", "text": "That it’s you?"}, {"from": "David", "text": "That what’s me?"}, {"from": "Carl", "text": "All the noises, the tapping."}, {"from": "David", "text": "You’re imagining things."}, {"from": "Carl", "text": "Yeah, right. Whatever you say."}, {"from": "David", "text": "You’re really spooked about this."}, {"from": "Carl", "text": "You’re not going to scare me."}, {"from": "David", "text": "Looks like you’re doing that yourself lol."}, {"from": "Carl", "text": "Hardly. Your pranks don’t scare me."}, {"from": "David", "text": "You’re so pathetic."}, {"from": "David", "text": "2 am"}, {"from": "Carl", "text": "Okay, you can stop now."}, {"from": "Carl", "text": "David?"}, {"from": "David", "text": "What? I’m trying to sleep."}, {"from": "Carl", "text": "Sure you are."}, {"from": "David", "text": "What else would I do? It’s two in the morning."}, {"from": "Carl", "text": "Oh, I don’t know. Sneak downstairs. Knock on my door. Blow on me."}, {"from": "David", "text": "That would be funny, but no lol"}, {"from": "Carl", "text": "Don’t even try to pretend."}, {"from": "David", "text": "I’m not pretending. You really should calm down."}, {"from": "Carl", "text": "Don’t you get bored?"}, {"from": "David", "text": "That’s why I’m sleeping."}, {"from": "Carl", "text": "I mean, trying to scare me all night."}, {"from": "David", "text": "Why would I do that? $200, remember? You leave, we both lose."}, {"from": "Carl", "text": "Though, I don’t know how you’re blowing on me."}, {"from": "David", "text": "I’m not blowing on you."}, {"from": "Carl", "text": "The door’s locked."}, {"from": "David", "text": "I’m not blowing on you."}, {"from": "Carl", "text": "Maybe there’s a secret passageway."}, {"from": "Carl", "text": "Is there?"}, {"from": "David", "text": "You’re making me laugh up here. I’m not doing anything to you."}, {"from": "David", "text": "You’re imagining it."}, {"from": "David", "text": "2:25 am"}, {"from": "David", "text": "Very funny."}, {"from": "Carl", "text": "What?"}, {"from": "David", "text": "Now I get it, saying all that was a set up."}, {"from": "Carl", "text": "What are you talking about?"}, {"from": "David", "text": "Everything that you said I was doing, now you’re doing to me."}, {"from": "Carl", "text": "I am not. Stop pranking me, already."}, {"from": "David", "text": "What’s all the whispering?"}, {"from": "Carl", "text": "The what?"}, {"from": "David", "text": "The scary whispering. I can hear what you’re saying."}, {"from": "Carl", "text": "Nothing"}, {"from": "David", "text": "You’re right outside my door."}, {"from": "David", "text": "Trying to act like a ghost, obviously."}, {"from": "Carl", "text": "I’m downstairs. In the basement, remember?"}, {"from": "Carl", "text": "Unlike you, I’m not sneaking around this creepy house."}, {"from": "David", "text": "Don’t even try."}, {"from": "David", "text": "You’re doing it right now."}, {"from": "Carl", "text": "Doing what?"}, {"from": "David", "text": "Whispering."}, {"from": "Carl", "text": "I’m not."}, {"from": "David", "text": "We’ll see."}, {"from": "Carl", "text": "Fine."}, {"from": "David", "text": "How did you do that?"}, {"from": "Carl", "text": "Do what?"}, {"from": "David", "text": "How did you move that fast?"}, {"from": "Carl", "text": "What are you talking about?"}, {"from": "David", "text": "I opened the door."}, {"from": "David", "text": "You were whispering, right on the other side."}, {"from": "David", "text": "And there’s nothing there."}, {"from": "David", "text": "How did you even know I was going to open it?"}, {"from": "Carl", "text": "I wasn’t up there."}, {"from": "Carl", "text": "And I couldn’t be whispering outside your door at the same second you’re blowing on me."}, {"from": "David", "text": "I wasn’t blowing on you."}, {"from": "Carl", "text": "And I wasn’t whispering outside your door."}, {"from": "David", "text": "Well SOMEBODY was!"}, {"from": "David", "text": "I’m coming down there."}, {"from": "Carl", "text": "Yeah, that would be a good idea."}, {"from": "Carl", "text": "$200 isn’t worth this."}, {"from": "Carl", "text": "David?"}, {"from": "Carl", "text": "Where are you, David?"}, {"from": "Carl", "text": "Is that you?"}, {"from": "Carl", "text": "David? Say something."}, {"from": "Carl", "text": "Don’t just knock."}, {"from": "Carl", "text": "Say something."}, {"from": "Carl", "text": "Please."}]}], "cover": "covers/foggy-cabin.jpg"}, {"id": "last-train-out", "title": "Last Train Out", "description": "", "genre": "thriller", "author": "", "episodes": [{"left": "Darla", "right": "Andrew", "description": "", "messages": [{"from": "Darla", "text": "The train stopped"}, {"from": "Andrew", "text": "I know."}, {"from": "Darla", "text": "Why did the train stop?"}, {"from": "Andrew", "text": "We’re at the border."}, {"from": "Darla", "text": "Do you think they’re going to check?"}, {"from": "Andrew", "text": "Yeah. Especially now, with the revolution."}, {"from": "Darla", "text": "What do we do?"}, {"from": "Andrew", "text": "Just stay calm."}, {"from": "Darla", "text": "What if they search the whole train?"}, {"from": "Darla", "text": "What if they check papers?"}, {"from": "Andrew", "text": "They haven’t done that yet."}, {"from": "Andrew", "text": "Maybe we’ll be lucky."}, {"from": "Darla", "text": "But what if they do?"}, {"from": "Andrew", "text": "Just pretend like you’re looking for your papers. Like you misplaced them."}, {"from": "Andrew", "text": "They’re not going to delay the whole train for one person."}, {"from": "Darla", "text": "Do they know what we look like?"}, {"from": "Darla", "text": "They must have our pictures."}, {"from": "Andrew", "text": "I don’t know. These are just guards, anyway."}, {"from": "Andrew", "text": "They won’t have our pictures all the way out here."}, {"from": "Darla", "text": "But they have guns."}, {"from": "Andrew", "text": "Don’t panic."}, {"from": "Darla", "text": "They’re getting on the train."}, {"from": "Darla", "text": "Are you still in the third car?"}, {"from": "Andrew", "text": "Yeah, are you still in the first?"}, {"from": "Darla", "text": "Yes"}, {"from": "Darla", "text": "They look serious."}, {"from": "Andrew", "text": "That’s their job."}, {"from": "Darla", "text": "To look serious?"}, {"from": "Andrew", "text": "To scare you."}, {"from": "Darla", "text": "Well, they’re doing their job well."}, {"from": "Andrew", "text": "Remember, just act nervous."}, {"from": "Darla", "text": "I don’t need to act."}, {"from": "Andrew", "text": "Just keep searching your things."}, {"from": "Andrew", "text": "They’ll be angry, but they’ll get bored quick."}, {"from": "Andrew", "text": "And then they’ll move on."}, {"from": "Darla", "text": "What about you?"}, {"from": "Andrew", "text": "They’ll get to me eventually."}, {"from": "Darla", "text": "You can’t do the same thing."}, {"from": "Andrew", "text": "I’ll think of something. These guys aren’t very smart."}, {"from": "Darla", "text": "They’re almost here."}, {"from": "Andrew", "text": "You’ll get through this. Don’t worry."}, {"from": "Andrew", "text": "Are you okay?"}, {"from": "Darla", "text": "That was easier than I thought."}, {"from": "Darla", "text": "They didn’t seem to care. Not much, anyway."}, {"from": "Andrew", "text": "That’s good. We’ll be okay, I think."}, {"from": "Darla", "text": "When they come to you, just act like you don’t speak the language."}, {"from": "Darla", "text": "And that you don’t understand them."}, {"from": "Darla", "text": "They’ll just move on."}, {"from": "Andrew", "text": "I don’t even think I need to do that."}, {"from": "Darla", "text": "They’ll be at your seat in a few minutes."}, {"from": "Andrew", "text": "I’m not worried."}, {"from": "Darla", "text": "You shouldn’t be. They’re really not checking that closely."}, {"from": "Darla", "text": "If I were you, I would just be friendly."}, {"from": "Andrew", "text": "Well, I don’t know about friendly."}, {"from": "Darla", "text": "Friendly’s good. They’ve got guns, remember."}, {"from": "Darla", "text": "Obviously, you can’t try anything."}, {"from": "Andrew", "text": "I’m not about to."}, {"from": "Andrew", "text": "They just opened the door to my car."}, {"from": "Darla", "text": "They’re almost there?"}, {"from": "Andrew", "text": "Well, I’m all the way in the back, they have to check everyone before me."}, {"from": "Darla", "text": "Yeah, it might be a few minutes."}, {"from": "Andrew", "text": "That’s strange."}, {"from": "Darla", "text": "What?"}, {"from": "Andrew", "text": "They’re not really checking anyone."}, {"from": "Andrew", "text": "They’re looking at them, but they’re not checking papers."}, {"from": "Andrew", "text": "I think they’re looking for someone special."}, {"from": "Darla", "text": "Probably."}, {"from": "Andrew", "text": "I guess they haven’t found who they’re looking for."}, {"from": "Darla", "text": "Not yet."}, {"from": "Andrew", "text": "They’ll be done with this in a minute. What a close call!"}, {"from": "Darla", "text": "Remember, Andrew. Be friendly."}, {"from": "Darla", "text": "The best thing to do is not put up a fight."}, {"from": "Andrew", "text": "What do you mean?"}, {"from": "Darla", "text": "They’re looking for you, Andrew."}, {"from": "Andrew", "text": "What do you mean????"}, {"from": "Darla", "text": "Just go with them. You’ll be okay."}, {"from": "Andrew", "text": "Wait…did you know about this?"}, {"from": "Darla", "text": "I know about you, Andrew."}, {"from": "Darla", "text": "I’ve known about you for a long time."}, {"from": "Darla", "text": "No one likes a traitor, Andrew."}, {"from": "Darla", "text": "Now do as you’re told and go with the guards."}, {"from": "Darla", "text": "Understand?"}]}], "cover": "covers/night-train.jpg"}, {"id": "love-till-death", "title": "Love till Death", "description": "A crooked affair from the past has Jake begging for his life. He has five minutes to live, and a confession to make that can save his life. But Jake finds out there are things more painful than death itself.", "genre": "horror", "author": "Asjad Ullah", "episodes": [{"left": "Anna", "right": "Jake", "description": "A crooked affair from the past has Jake begging for his life. He has five minutes to live, and a confession to make that can save his life. But Jake finds out there are things more painful than death itself.", "messages": [{"from": "Anna", "text": "You have five minutes to live."}, {"from": "Jake", "text": "Who are you? Where am I?"}, {"from": "Jake", "text": "What is this place?"}, {"from": "Anna", "text": "Relax! My love."}, {"from": "Anna", "text": "It will all be over soon."}, {"from": "Jake", "text": "What do you want?"}, {"from": "Anna", "text": "Me?"}, {"from": "Anna", "text": "I just want to see you being shredded to pieces by that cutter."}, {"from": "Anna", "text": "And yes, also hear your cries."}, {"from": "Jake", "text": "Why? What have I done to you?"}, {"from": "Anna", "text": "That is a very interesting question."}, {"from": "Anna", "text": "Now, where should I start from?"}, {"from": "Jake", "text": "I am ready to do anything."}, {"from": "Jake", "text": "Just stop that cutter."}, {"from": "Anna", "text": "Now that dialogue seems very familiar."}, {"from": "Anna", "text": "Can’t remember where I heard this?"}, {"from": "Anna", "text": "Oh, I remember!"}, {"from": "Anna", "text": "Does the name Anna ring any bells, Mr. Jake?"}, {"from": "Jake", "text": "Anna?"}, {"from": "Jake", "text": "Anna who?"}, {"from": "Anna", "text": "And you don’t even remember Anna now?"}, {"from": "Anna", "text": "Poor Jake, fear has weakened your memory."}, {"from": "Jake", "text": "Just stop that goddamned cutter."}, {"from": "Jake", "text": "It’s closing in."}, {"from": "Anna", "text": "Remember how Anna begged for her life?"}, {"from": "Anna", "text": "She was pregnant at that time."}, {"from": "Jake", "text": "But Anna died in a house fire."}, {"from": "Anna", "text": "You blood thirsty scum."}, {"from": "Anna", "text": "You tortured Anna to death."}, {"from": "Anna", "text": "You and your whore bitch, Meg."}, {"from": "Jake", "text": "Who are you? How do you know all this?"}, {"from": "Anna", "text": "I AM ANNA."}, {"from": "Jake", "text": "This can’t be. We killed you."}, {"from": "Jake", "text": "I burned the whole house."}, {"from": "Jake", "text": "It’s impossible."}, {"from": "Anna", "text": "Here I am Jake."}, {"from": "Anna", "text": "Enjoying your slaughter on my screen."}, {"from": "Anna", "text": "By the very cutter you used to kill me."}, {"from": "Anna", "text": "With nothing, but your fingers free to text me."}, {"from": "Jake", "text": "I love you Anna."}, {"from": "Anna", "text": "Look at the poor man."}, {"from": "Anna", "text": "I guess you have forgotten how brutally you tried to kill me."}, {"from": "Jake", "text": "It was all Meg’s idea."}, {"from": "Jake", "text": "I can explain everything."}, {"from": "Jake", "text": "Please give me a chance."}, {"from": "Anna", "text": "Don’t even take that whore’s name."}, {"from": "Jake", "text": "Yes I hate her too."}, {"from": "Jake", "text": "It was her plan to kill you."}, {"from": "Jake", "text": "She used me as a tool."}, {"from": "Anna", "text": "2 minutes to go Jake."}, {"from": "Jake", "text": "PLEASE STOP ANNA."}, {"from": "Jake", "text": "For heaven’s sake."}, {"from": "Anna", "text": "I can’t forget your laughter Jake."}, {"from": "Anna", "text": "After you detached my legs."}, {"from": "Anna", "text": "You thought I had passed out."}, {"from": "Anna", "text": "I was listening Jake, and the two of you were laughing."}, {"from": "Jake", "text": "I swear to God, Meg made me do this."}, {"from": "Jake", "text": "She had just overtaken me, like a trance."}, {"from": "Jake", "text": "I always loved you Anna."}, {"from": "Jake", "text": "I just loved Meg’s body."}, {"from": "Jake", "text": "I never loved her."}, {"from": "Anna", "text": "Oh really Jake?"}, {"from": "Anna", "text": "How can you prove it?"}, {"from": "Jake", "text": "Give me a chance."}, {"from": "Jake", "text": "I will go to the courts."}, {"from": "Jake", "text": "I will testify against her."}, {"from": "Jake", "text": "I will prove that it was all her plan."}, {"from": "Anna", "text": "You have 1 minute Jake."}, {"from": "Jake", "text": "Anna please, you won’t get anything by killing me."}, {"from": "Jake", "text": "You can have your revenge on Meg."}, {"from": "Jake", "text": "I will help you."}, {"from": "Anna", "text": "You can’t help me Jake."}, {"from": "Jake", "text": "Oh please stop the cutter."}, {"from": "Jake", "text": "Please."}, {"from": "Anna", "text": "You are so stupid Jake."}, {"from": "Anna", "text": "Didn’t we burn Anna’s body together?"}, {"from": "Jake", "text": "Meg?"}, {"from": "Anna", "text": "Of course MY LOVE."}, {"from": "Anna", "text": "And now you have proved the one thing I feared."}, {"from": "Anna", "text": "To save your skin, you will easily betray me."}, {"from": "Anna", "text": "See you in Hell, Jake."}]}], "cover": "covers/teal-face.jpg"}, {"id": "reunion", "title": "Reunion", "description": "", "genre": "thriller", "author": "", "episodes": [{"left": "Mike", "right": "Emily", "description": "", "messages": [{"from": "Mike", "text": "Emily! I haven’t heard from you in forever!"}, {"from": "Emily", "text": "Hey, Mike. I just HAD to tell you…"}, {"from": "Emily", "text": "You are NOT going to believe who I ran into at lunch today."}, {"from": "Mike", "text": "Who?"}, {"from": "Emily", "text": "Guess!"}, {"from": "Mike", "text": "I have no idea."}, {"from": "Emily", "text": "No, Guess!"}, {"from": "Mike", "text": "Charlie?"}, {"from": "Emily", "text": "Huh? No, why would it be Charlie?"}, {"from": "Mike", "text": "I don’t know. He works downtown."}, {"from": "Emily", "text": "Not Charlie."}, {"from": "Emily", "text": "Guess again."}, {"from": "Mike", "text": "Why are you making such a big thing out of this?"}, {"from": "Emily", "text": "Because it’s amazing. I’m having him over at the party tonight."}, {"from": "Mike", "text": "WHO?"}, {"from": "Emily", "text": "Remember little Kenny…in middle school? The dorky kid?"}, {"from": "Mike", "text": "WHAT?"}, {"from": "Emily", "text": "I ran into him!"}, {"from": "Emily", "text": "Isn’t that amazing?"}, {"from": "Mike", "text": "No, it’s NOT amazing."}, {"from": "Mike", "text": "You don’t know about him, do you?"}, {"from": "Emily", "text": "What do you mean?"}, {"from": "Mike", "text": "I thought you would have heard."}, {"from": "Mike", "text": "It’s all over the news: he’s wanted."}, {"from": "Emily", "text": "What do you mean, “wanted?”"}, {"from": "Mike", "text": "By the police. FBI."}, {"from": "Emily", "text": "That’s crazy!"}, {"from": "Mike", "text": "How can you NOT know this?"}, {"from": "Emily", "text": "You’re joking."}, {"from": "Mike", "text": "Emily, they want him for murder."}, {"from": "Emily", "text": "That’s crazy. I know he was weird, but that was a long time ago."}, {"from": "Mike", "text": "I’m serious! It was on the news!"}, {"from": "Emily", "text": "I don’t watch the news."}, {"from": "Mike", "text": "You’re seriously having him over?"}, {"from": "Mike", "text": "He knows where you live?"}, {"from": "Emily", "text": "I told you, I’m having a party. In a couple of hours."}, {"from": "Emily", "text": "And anyway, He didn’t look like someone who’s wanted."}, {"from": "Emily", "text": "So maybe you’re wrong."}, {"from": "Emily", "text": "Maybe it was just someone with the same name."}, {"from": "Mike", "text": "It was HIM. Don’t you remember how weird he was?"}, {"from": "Emily", "text": "Hold on…front door."}, {"from": "Mike", "text": "Is it him???"}, {"from": "Mike", "text": "He’s there already?"}, {"from": "Mike", "text": "I thought he wasn’t coming until later!!"}, {"from": "Emily", "text": "Well…he came early."}, {"from": "Mike", "text": "He’s there?"}, {"from": "Emily", "text": "Yes."}, {"from": "Mike", "text": "Emily, you have to get away!"}, {"from": "Emily", "text": "Are you sure about him?"}, {"from": "Mike", "text": "Yes!"}, {"from": "Emily", "text": "I really think you’re wrong. He’s sitting right across from me."}, {"from": "Mike", "text": "Can you get out of there?"}, {"from": "Emily", "text": "Don’t try to get me excited."}, {"from": "Mike", "text": "Stay calm. What’s he saying?"}, {"from": "Emily", "text": "He’s asking how I am."}, {"from": "Mike", "text": "Tell him you’re okay."}, {"from": "Emily", "text": "I did, and I told him I’m texting my mom."}, {"from": "Emily", "text": "I don’t think he liked you back then."}, {"from": "Mike", "text": "I’m going to call the police"}, {"from": "Emily", "text": "He hasn’t done anything."}, {"from": "Mike", "text": "Except murder! Get out while you still can!"}, {"from": "Emily", "text": "I’m not doing that."}, {"from": "Emily", "text": "He’s being polite."}, {"from": "Emily", "text": "He said it’s good to see me. See, he’s nice."}, {"from": "Mike", "text": "Huh?"}, {"from": "Emily", "text": "He’s saying he hasn’t seen a lot of people from middle school."}, {"from": "Emily", "text": "He says it wasn’t a good time for him."}, {"from": "Mike", "text": "Yeah. He was a dork."}, {"from": "Emily", "text": "He says nobody liked him."}, {"from": "Emily", "text": "Mike…he’s getting mad talking about it."}, {"from": "Mike", "text": "Stay calm."}, {"from": "Emily", "text": "I can see it in his face."}, {"from": "Mike", "text": "See what?"}, {"from": "Emily", "text": "How mad he is. His face is all red."}, {"from": "Emily", "text": "He said he hated everyone."}, {"from": "Emily", "text": "But he said he won’t hate anymore."}, {"from": "Mike", "text": "What does he mean?"}, {"from": "Emily", "text": "Well…"}, {"from": "Emily", "text": "He said its getting better."}, {"from": "Emily", "text": "He got rid of the bad people he says."}, {"from": "Emily", "text": "…most of the bad people"}, {"from": "Mike", "text": "Got RID of them?"}, {"from": "Emily", "text": "That’s what he said."}, {"from": "Emily", "text": "“Most.”"}, {"from": "Emily", "text": "He said he has a few left."}, {"from": "Mike", "text": "A few…"}, {"from": "Emily", "text": "People he didn’t like. From middle school."}, {"from": "Mike", "text": "Which people?"}, {"from": "Mike", "text": "We were nice to him, weren’t we?"}, {"from": "Mike" eally, I don’t need that much time to do my work."}, {"from": "Unknown", "text": "And I can tell, you’re the kind where the meat will slide right off the bone."}, {"from": "Colin", "text": "You can tell?"}, {"from": "Unknown", "text": "I guess you can say I’m somewhat of an expert."}, {"from": "Unknown", "text": "Now look at that, you’ve almost filled up your trunk with groceries. And you still have more!"}, {"from": "Unknown", "text": "You can probably make a little bit more room…just reach back in there."}, {"from": "Colin", "text": "That’s what I’m doing."}, {"from": "Unknown", "text": "That’s what I was hoping."}, {"from": "Unknown", "text": "Just as I thought."}, {"from": "Unknown", "text": "Slides right off the bone."}]}], "cover": "covers/half-lit-face.jpg"}, {"id": "the-crossroad", "title": "The crossroad", "description": "Mia wants to exploit a pre-marriage contract with her millionaire husband, Jones. She sets him up, so she could grab all his wealth, and enjoy life with her boyfriend Dan. But things go out of control, leaving everyone flabbergasted!", "genre": "romance", "author": "Asjad Ullah", "episodes": [{"left": "Mia", "right": "Dan", "description": "Mia wants to exploit a pre-marriage contract with her millionaire husband, Jones. She sets him up, so she could grab all his wealth, and enjoy life with her boyfriend Dan. But things go out of control, leaving everyone flabbergasted!", "messages": [{"from": "Mia", "text": "Hey baby."}, {"from": "Mia", "text": "I’ve set the trap for my husband."}, {"from": "Dan", "text": "You’re such a bitch. ;P"}, {"from": "Dan", "text": "I’m impressed."}, {"from": "Mia", "text": "I couldn’t have done it without you."}, {"from": "Dan", "text": "I just added the toppings."}, {"from": "Mia", "text": "Yeah, but that bombshell Sandy you recommended."}, {"from": "Mia", "text": "I bet my husband will start drooling the moment he sees her."}, {"from": "Dan", "text": "Hahaha…"}, {"from": "Mia", "text": "Yeah, he’s such a loser." function cover(story) {
  if (story.cover) return `<img class="cover photo" src="${story.cover}" alt="" loading="lazy" decoding="async">`;

  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const sky = story.genre === "thriller" ? ["#1c2a3d", "#0f1220"] : ["#2b1b44", "#0d0a1c"];
  const glow = story.genre === "thriller" ? "#c9d27a" : "#e2c06a";
  let trees = "";
  for (let i = 0; i < 9; i++) {
    const x = rnd() * 220, w = 3 + rnd() * 6, h = 90 + rnd() * 60;
    trees += `<rect x="${x.toFixed(1)}" y="${(150 - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#07050f" opacity="${(0.55 + rnd() * 0.45).toFixed(2)}"/>`;

    ? `<path d="M${hx} 118l26-20 26 20v32h-52z" fill="#0a0814"/><rect x="${hx + 20}" y="124" width="10" height="13" fill="${glow}" opacity=".85"/>`
    : `<circle cx="${hx}" cy="44" r="16" fill="${glow}" opacity=".55"/>`;

  return `<span class="tfill" style="--f:${Math.max(.05, f)}" aria-label="${lbl} read"><span class="water"><i>${WAVES}</i></span><b>${lbl}</b></span>`;
}
function tilesHTML(list, f) {
  return list.map(s => `<button class="tile" id="t-${s.id}" data-id="${s.id}">${cover(s)}${ringHTML(s)}<span class="shade"></span>
      ${f.includes(s.id) ? `<span class="fav">${ICON.heart}</span>` : ""}
      <div><b>${esc(s.title)}</b><span class="pills"><span class="pill">${GENRES[s.genre]}</span><span class="pill">${readMin(s)}</span></span></div></button>`).join("");
}
/* tap opens; hold toggles favourite, and the tile's heart pops in or shrinks away in place */
const centre = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

function wireCards(root) {
  root.querySelectorAll("[data-id]").forEach(b => {
    const pressed = longPress(b, () => {
      toggleFav(b.dataset.id);
      document.querySelectorAll(`.tile[data-id="${b.dataset.id}"]`).forEach(t => {
        const h = t.querySelector(".fav");
        if (h) { h.classList.add("out"); setTimeout(() => h.remove(), 200); }
        else { t.insertAdjacentHTML("beforeend", `<span class="fav pop">${ICON.heart}</span>`);  }
      });
      b.classList.remove("pressing");
    });
    /* the card sinks a little while the finger holds it */
    b.addEventListener("pointerdown", () => b.classList.add("pressing"));
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => b.classList.remove("pressing")));
    b.onclick = () => { if (!pressed()) preview(b.dataset.id); };
  });
}

/* home after a like/unlike elsewhere: only the hearts change, each with its own small animation */
function syncHearts() {
  document.querySelectorAll(".tile[data-id]").forEach(t => {
    const s = STORIES.find(x => x.id === t.dataset.id), old = t.querySelector(".tfill"), html = ringHTML(s);
    if (old) old.remove();
    if (html) t.querySelector(".shade").insertAdjacentHTML("beforebegin", html);
  });
  const f = favs();
  document.querySelectorAll(".tile[data-id]").forEach(t => {
    const h = t.querySelector(".fav"), on = f.includes(t.dataset.id);
    if (on && !h) t.insertAdjacentHTML("beforeend", `<span class="fav pop">${ICON.heart}</span>`);
    if (!on && h) { h.classList.add("out"); setTimeout(() => h.remove(), 200); }
  });
}

/* Fetch fresh stories. The preview has them built in, so this only waits like a short network call;
   in the app it is the real request. */
function reloadStories() { return new Promise(r => setTimeout(r, 300 + Math.random() * 300)); }

/* Swap the home page's content in place while it is pulled down; the eyes above are not touched. */
function refreshHome(view) {
  cancelAnimationFrame(slideTimer);
  view.innerHTML = homeContent();
  view.classList.remove("refreshed"); void view.offsetWidth; view.classList.add("refreshed");
  setTimeout(() => view.classList.remove("refreshed"), 700);
  wireHome();
}

function home() {
  shell(homeContent());
  wireHome();
  pullToRefresh();
  pullForRandom();
}

function homeContent() {
  const list = STORIES.filter(s => genre === "all" || s.genre === genre), f = favs(), TOP = topOfWeek();
  const heroHTML = h => `<button class="hero" id="h-${h.id}" data-id="${h.id}">${cover(h)}<span class="shade"></span><div><small>★ ${rating(h)} · ${GENRES[h.genre]}${h.episodes.length > 1 ? " · " + h.episodes.length + " parts" : ""}</small><b>${esc(h.title)}</b></div></button>`;
  return (`<span class="label">Top this week</span>
    <div class="slider" id="slider" aria-label="Top 5 stories this week">${TOP.map(heroHTML).join("")}${heroHTML(TOP[0]).replace('class="hero"', 'class="hero loop" aria-hidden="true" tabindex="-1"').replace(/id="h-[^"]*"/, "")}</div>
    <div class="dots" id="dots" aria-hidden="true">${TOP.map(() => "<i></i>").join("")}<span class="worm"><b></b></span></div>
    <div class="chips" role="group" aria-label="Genre">${Object.entries(GENRES).map(([k, v]) => `<button class="chip" id="g-${k}" data-g="${k}" aria-pressed="${k === genre}">${v}</button>`).join("")}</div>
    <div class="grid" id="grid">${tilesHTML(list, f)}</div>
    <p class="hint pull-hint" id="pull-hint">Pull up for a random story</p>`);
}

function wireHome() {
  /* a genre change swaps only the grid: old tiles fade, new ones rise in; the slider is not touched */
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    if (genre === b.dataset.g) return;
    genre = b.dataset.g;
    app.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.g === genre));
    const grid = document.getElementById("grid");
    grid.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: "ease-in", fill: "forwards" }).onfinish = () => {
      grid.innerHTML = tilesHTML(STORIES.filter(s => genre === "all" || s.genre === genre), favs());
      grid.getAnimations().forEach(a => a.cancel());
      grid.classList.remove("swap"); void grid.offsetWidth; grid.classList.add("swap");
      wireCards(grid);
    };
  });
  wireCards(app);
  startSlider();
}

/* iPhone-style pull to refresh on the home screen: the page follows the finger with resistance,
   the spinner's spokes appear one by one as you pull; let go past the line and the screen reloads. */
/* ---------- Pull to refresh: the owl's eyes ----------
   Pull the page down and the owl's eyes come down from above the screen with it, opening as you pull.
   Let go past the line: they shut once; the page refreshes while they are shut (a slow network just
   keeps them shut longer); they open red and the page goes back up with them still open.
   The brow's shadow lies on the open eye (white or red) and goes away with it when the lid shuts.
   The reload starts as soon as you let go; the eyes keep cycling until it is done, then finish the
   cycle they are in and the page goes back up. */
const lerp = (a, b, t) => a + (b - a) * t;
function tween(ms, ease, step) {
  return new Promise(res => { const t0 = performance.now();
    const f = now => { const t = Math.min(1, (now - t0) / ms); step(ease(t)); t < 1 ? requestAnimationFrame(f) : res(); };
    requestAnimationFrame(f); });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const easeIn = t => t * t, easeOut = t => 1 - (1 - t) * (1 - t);

function owlEyes() {
  /* art: the icon's eyes and the brow's shadow (x 50-974, y 250-730 of the 1024 icon) drawn 360 x 187 */
  const S = 360 / 924, U = (x, y) => [(x - 50) * S, (y - 250) * S];
  const EYES = [{ c: U(236.8, 419.8), rot: 30 }, { c: U(787.2, 419.8), rot: -30 }];
  const RX = 345.6 * S, RY = 243.2 * S, TRAVEL = 307.2 * S;
  const wrap = document.createElement("div"); wrap.className = "ptr"; wrap.setAttribute("aria-hidden", "true");
  wrap.innerHTML = `<svg viewBox="0 0 360 187">
      <defs>
        <mask id="pe-lids" maskUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="267">
          <rect x="-40" y="-40" width="440" height="267" fill="#fff"/>${EYES.map(() => `<ellipse rx="${RX}" ry="${RY}" fill="#000"/>`).join("")}
        </mask>
        <filter id="pe-glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <g mask="url(#pe-lids)">
        <image href="brand/eyes-base.png" width="360" height="187"/>
        <g id="pe-evil" opacity="0">
          <image href="brand/eyes-evil.png" width="360" height="187" filter="url(#pe-glow)" opacity=".85"/>
          <image href="brand/eyes-evil.png" width="360" height="187"/>
        </g>
        <image href="brand/eyes-shadow.png" width="360" height="187"/>
      </g>
    </svg>`;
  const lids = [...wrap.querySelectorAll("#pe-lids ellipse")], evil = wrap.querySelector("#pe-evil");
  /* t = 1 shut, 0 open: each lid is a big tilted ellipse sliding along the eye's slant */
  const setLids = t => lids.forEach((el, i) => {
    const e = EYES[i], n = [-Math.sin(e.rot * Math.PI / 180), Math.cos(e.rot * Math.PI / 180)], D = TRAVEL * (1 - t);
    const x = e.c[0] - n[0] * D, y = e.c[1] - n[1] * D + 8 * S;
    el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("transform", `rotate(${e.rot} ${x} ${y})`);
  });
  setLids(1);
  return {
    el: wrap, setLids,
    async open(from = 1) { await tween(280 * from + 1, easeOut, t => setLids(from * (1 - t))); },
    /* the one blink: shut, stay shut until the page is fresh (it is swapped behind the closed
       eyes), then open red */
    async blink(loaded, onShut) {
      await tween(120, easeIn, setLids);                          // shut…
      await Promise.all([loaded, wait(60)]);                     // …a slow network keeps them shut…
      onShut(); evil.setAttribute("opacity", 1);
      await tween(220, easeOut, t => setLids(1 - t));             // …open, red
    },
    reset() { evil.setAttribute("opacity", 0); setLids(1); },

function pullForRandom() {
  const view = document.getElementById("view"), tabs = app.querySelector(".tabs");
  const rnd = document.createElement("div"); rnd.className = "rnd"; rnd.setAttribute("aria-hidden", "true");

    const shelf = STORIES.filter(s => genre === "all" || s.genre === genre);
    const fresh = shelf.filter(s => !prog(s).pos.some(Boolean));
    const unfinished = shelf.filter(s => prog(s).pos.some(Boolean) && progress(s) < 100);
    const pool = fresh.length ? fresh : unfinished.length ? unfinished : shelf;
    pick = pool[Math.floor(Math.random() * pool.length)];
    list = [...(shelf.length > 2 ? shelf : STORIES)].sort(() => Math.random() - .5);
    const rows = Array.from({ length: LOOPS }, () => list).flat();
    strip.innerHTML = rows.map(s => `<div class="row"><span class="th">${cover(s)}</span><b>${esc(s.title)}</b></div>`).join("");

  const setStrip = o => { const span = list.length * ROW; strip.style.transform = `translateY(${ROW - (((o % span) + span) % span) - span}px)`; };
  const show = raw => {
    const lift = Math.min(raw, LINE()), k = Math.min(1, raw / LINE());
    rnd.style.setProperty("--tabs-h", (app.clientHeight - tabs.offsetTop) + "px");
    rnd.classList.toggle("on", raw > 0);
    slot.style.setProperty("--lift", lift + "px");                 // the reel lives only in the space that opened
    view.style.transform = raw ? `translateY(${-lift}px)` : "";
    say.textContent = k >= 1 ? "Release for a random story" : "Keep pulling";
    say.style.opacity = lift > 220 ? 1 : 0;                        // words only once there is room for them
    rnd.classList.toggle("ready", k >= 1);

    if (raw) setStrip(offset + raw * .9);                           // the reel turns with your finger
