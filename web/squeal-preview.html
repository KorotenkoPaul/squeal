<style>
/* Layout: the original 2018 Squeal design — indigo night, four tabs (menu, home, favourites, search) and a full-screen chat reader. */
:root {
  --bg: #26243f;          /* indigo night, from the original mockups */
  --deep: #17122c;        /* card shade behind covers */
  --tabbar: #1f1d36;
  --field: #34315a;       /* search field, chips */
  --text: #ffffff;
  --muted: #9b97b3;       /* lavender captions */
  --accent: #7b57c9;      /* favourite heart, active states */
  --danger: #d4445f;      /* remove */
  --them: #36335a;
  --me: #6a4bb8;
  --font: "Avenir Next", Avenir, "Nunito Sans", -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; }
.view { flex: 1; overflow-y: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.label { color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }

/* Tab bar */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--tabbar);
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.tabs button { display: grid; place-items: center; padding: 6px; color: #6f6b8c; }
.tabs button[aria-current="page"] { color: var(--text); }
.tabs svg { width: 26px; height: 26px; }

/* Covers: drawn scenes, one per story */
.cover { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Home */
.slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; scrollbar-width: none; border-radius: 14px; }
.slider::-webkit-scrollbar { display: none; }
.slider .hero { flex: 0 0 100%; scroll-snap-align: center; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -4px; }

.preview { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

.pv-cover .shade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 4%, rgba(38,36,63,0) 70%); }
.pv-cover .back { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; padding: 0 0 3px; }
.pv-cover .like { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); width: 38px; height: 38px; border-radius: 50%; background: rgba(23,18,44,.6); display: grid; place-items: center; color: var(--muted); }
.pv-cover .like[aria-pressed="true"] { color: var(--text); background: var(--accent); }
.pv-cover .like svg { width: 18px; height: 18px; }

.pv-body { padding: 4px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }

.demo { color: #6f6b8c; font-size: 11px; text-align: center; }

.tile .fav { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.tile .fav svg { width: 14px; height: 14px; }
.hint { color: var(--muted); font-size: 13px; text-align: center; }

/* Favourites */
.row-card { position: relative; border-radius: 14px; overflow: hidden; touch-action: pan-y; }

.row-card .face { position: relative; display: flex; align-items: center; min-height: 110px; padding: 20px; background: var(--deep); border-radius: 14px; transition: transform .2s; width: 100%; text-align: left; overflow: hidden; }
.row-card .face svg.cover { left: 40%; width: 60%; }
.row-card .face .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--deep) 42%, rgba(23,18,44,0) 85%); }
.row-card .face div { position: relative; display: flex; flex-direction: column; gap: 4px; }
.row-card b { font-size: 24px; font-weight: 600; }
.row-card small { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.row-card.open .face { transform: translateX(-108px); }

/* Search */
.search { display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 12px; padding: 10px 12px; color: var(--muted); }
.search svg { width: 18px; height: 18px; flex: none; }
.search input { flex: 1; min-width: 0; color: var(--text); }
.search input::placeholder { color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { display: flex; align-items: center; gap: 14px; text-align: left; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex: none; background: var(--deep); }
.item div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item b { font-size: 18px; font-weight: 600; }
.item small { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }

/* Menu */
.menu { align-items: center; justify-content: center; gap: 0; }
.menu button { padding: 18px 8px; font-size: 18px; width: 100%; max-width: 320px; border-bottom: 1px solid rgba(155,151,179,.12); }
.menu button:last-of-type { border-bottom: 0; }
.menu p { color: #6f6b8c; font-size: 12px; text-align: center; margin: 28px 0 0; max-width: 30ch; }

/* Empty states */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding-block: 40px; }
.empty svg { width: 150px; height: 160px; }
.empty b { font-size: 20px; }
.empty span { color: var(--muted); }

.chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.head { display: flex; align-items: center; gap: 12px; padding: 12px max(18px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px)); background: var(--tabbar); }
.back { font-size: 30px; line-height: 1; padding: 0 6px 2px 0; color: var(--text); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.who { display: flex; flex-direction: column; min-width: 0; }
.who b { font-weight: 600; }
.who small { color: var(--muted); font-size: 12px; }
.ep { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.log { flex: 1; overflow-y: auto; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
.intro { align-self: center; color: var(--muted); font-size: 13px; text-align: center; max-width: 34ch; line-height: 1.5; margin-bottom: 10px; }
.msg { max-width: 78%; padding: 9px 14px; border-radius: 18px; line-height: 1.38; overflow-wrap: anywhere; animation: rise .2s ease-out both; }
.them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 5px; }
.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 5px; }
.typing { align-self: flex-start; background: var(--them); border-radius: 18px; padding: 12px 14px; display: flex; gap: 4px; }

.tap { flex: 1; padding: 14px; border-radius: 14px; background: var(--field); color: var(--muted); font-weight: 600; }
.tap.primary { background: var(--accent); color: var(--text); }
.end { align-self: center; text-align: center; padding: 16px 8px 4px; display: flex; flex-direction: column; gap: 4px; }
.end strong { font-size: 26px; font-weight: 700; }
.end span { color: var(--muted); font-size: 13px; }
.toast { position: absolute; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--field); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; white-space: nowrap; }

agining things."}, {"from": "James", "text": "Go knock, then."}, {"from": "Patrick", "text": "Are they out?"}, {"from": "James", "text": "Why?"}, {"from": "Patrick", "text": "The house is dark. Like Sandra’s."}, {"from": "Patrick", "text": "And nobody’s answering."}, {"from": "Patrick", "text": "Why are you doing this to me?"}, {"from": "James", "text": "I’m not."}, {"from": "Patrick", "text": "I’m going home. I hope you’re satisfied."}, {"from": "James", "text": "Just come on to the party."}, {"from": "Patrick", "text": "I CAN’T IF YOU WON’T TELL ME WHERE IT IS!"}, {"from": "Patrick", "text": "Hey, is the power out or something?"}, {"from": "James", "text": "What do you mean?"}, {"from": "Patrick", "text": "All the houses are dark."}, {"from": "Patrick", "text": "Every house I walk by."}, {"from": "Patrick", "text": "Even my house."}, {"from": "Patrick", "text": "And I KNOW my family’s home."}, {"from": "James", "text": "Maybe they went out."}, {"from": "Patrick", "text": "I can’t get in."}, {"from": "James", "text": "What?"}, {"from": "Patrick", "text": "My key won’t work. I can’t get in my own house."}, {"from": "Patrick", "text": "I can’t get in my own house!"}]}, {"left": "Patrick", "right": "James", "description": "Terrified, Patrick returns to his own home, and finds that the house dark and the street deserted. James comes to help, but though they’re both standing in front of the house, they can’t see each other.", "messages": [{"from": "Patrick", "text": "This makes no sense."}, {"from": "James", "text": "Maybe you’re on the wrong street."}, {"from": "Patrick", "text": "I’m not."}, {"from": "Patrick", "text": "This is weird. Everything’s so quiet."}, {"from": "Patrick", "text": "I don’t even see any cars driving."}, {"from": "James", "text": "I think you’re having some mental thing. Seriously."}, {"from": "Patrick", "text": "Tell me where the party is."}, {"from": "Patrick", "text": "I don’t like this."}, {"from": "James", "text": "I’ll come pick you up."}, {"from": "Patrick", "text": "I’m right in front of my house."}, {"from": "James", "text": "Are you sure?"}, {"from": "Patrick", "text": "Yeah, I’m sure. We have a red mailbox, remember?"}, {"from": "Patrick", "text": "I’m right in front of it."}, {"from": "Patrick", "text": "I haven’t seen one car drive by."}, {"from": "James", "text": "I’m on my way."}, {"from": "Patrick", "text": "Hurry up."}, {"from": "Patrick", "text": "Please."}, {"from": "Patrick", "text": "-----"}, {"from": "Patrick", "text": "Are you here?"}, {"from": "James", "text": "Where are YOU?"}, {"from": "Patrick", "text": "In front of my house!"}, {"from": "James", "text": "You’re sure you’re not on drugs?"}, {"from": "Patrick", "text": "You know me."}, {"from": "Patrick", "text": "Maybe I’m insane."}, {"from": "Patrick", "text": "I don’t know."}, {"from": "James", "text": "I’m standing in front of your mailbox."}, {"from": "James", "text": "PHOTO: James’ photo of Patrick’s red mailbox"}, {"from": "Patrick", "text": "I’m standing in front of the mailbox."}, {"from": "Patrick", "text": "PHOTO: Patrick’s photo of Patrick’s red mailbox (the same mailbox)"}, {"from": "Patrick", "text": "This can’t be happening."}, {"from": "James", "text": "But if you’re not here, then where are you?"}, {"from": "Patrick", "text": "I DON’T KNOW!"}, {"from": "James", "text": "I just told your parents."}, {"from": "Patrick", "text": "What do you mean?"}, {"from": "James", "text": "That’s you’re lost!"}, {"from": "Patrick", "text": "I’m not, though!"}, {"from": "James", "text": "They’re calling the police."}, {"from": "Patrick", "text": "But I’m right in front of my house."}, {"from": "James", "text": "What if you’re imagining it?"}, {"from": "Patrick", "text": "I’m NOT."}, {"from": "Patrick", "text": "I don’t think."}, {"from": "Patrick", "text": "Anyway, you saw the picture."}, {"from": "Patrick", "text": "I took the picture."}, {"from": "Patrick", "text": "You KNOW I’m right here."}, {"from": "James", "text": "Can you hear the sirens?"}, {"from": "Patrick", "text": "What sirens?"}, {"from": "James", "text": "The police."}, {"from": "Patrick", "text": "I don’t hear anything."}, {"from": "Patrick", "text": "Are there lights on at my house?"}, {"from": "James", "text": "Yeah."}, {"from": "Patrick", "text": "Not here."}, {"from": "Patrick", "text": "And the streetlights just went out."}, {"from": "Patrick", "text": "I guess you still have streetlights?"}, {"from": "James", "text": "Everything’s normal."}, {"from": "Patrick", "text": "No lights, no cars, no people."}, {"from": "Patrick", "text": "You have no idea how quiet it is."}, {"from": "James", "text": "The police are asking, what’s the last time you remember seeing people?"}, {"from": "Patrick", "text": "Idk, I guess my family, before I left? Or maybe walking there?"}, {"from": "Patrick", "text": "I’m not sure."}, {"from": "James", "text": "They’re sending people to look for you."}, {"from": "Patrick", "text": "But I’m right in front of the house."}, {"from": "Patrick", "text": "I’m touching the mailbox."}, {"from": "Patrick", "text": "It’s real."}, {"from": "James", "text": "Maybe that’s what you think."}, {"from": "Patrick", "text": "BUT YOU SAW THE PHOTO!"}, {"from": "Patrick", "text": "It’s REAL!"}, {"from": "James", "text": "The police just told us something."}, {"from": "Patrick", "text": "What?"}, {"from": "James", "text": "Somebody found you."}, {"from": "Patrick", "text": "Huh? Nobody’s here."}, {"from": "James", "text": "In a ditch by the side of the road."}, {"from": "Patrick", "text": "Obviously, it’s not me."}, {"from": "James", "text": "They said you were hit by a car."}, {"from": "Patrick", "text": "It’s not me!"}, {"from": "James", "text": "It is you."}, {"from": "Patrick", "text": "OBVIOUSLY, it’s not me."}, {"from": "James", "text": "It’s obvious it’s you."}, {"from": "Patrick", "text": "“It?”"}, {"from": "James", "text": "They say you’re dead."}]}, {"left": "Patrick", "right": "James", "description": "Patrick insists that he isn’t dead, despite all of the evidence, and sets off back to Sandra’s house to find everyone and reveal the prank once and for all. He finds something else, entirely.", "messages": [{"from": "Patrick", "text": "I’m not dead."}, {"from": "Patrick", "text": "PHOTO: Selfie of Patrick"}, {"from": "Patrick", "text": "Do I look dead?"}, {"from": "Patrick", "text": "They made a mistake."}, {"from": "Patrick", "text": "I wasn’t hit by a car."}, {"from": "James", "text": "It’s you."}, {"from": "Patrick", "text": "It’s not."}, {"from": "James", "text": "It’s your clothes, your ID."}, {"from": "Patrick", "text": "Dead people can’t text, James."}, {"from": "Patrick", "text": "And they can’t take pictures."}, {"from": "Patrick", "text": "I mean, maybe I’m insane, but I’m not dead."}, {"from": "James", "text": "They showed us a picture"}, {"from": "Patrick", "text": "Of what?"}, {"from": "James", "text": "Of you."}, {"from": "Patrick", "text": "PHOTO: Selfie of Patrick (Same as previous)"}, {"from": "Patrick", "text": "That’s me."}, {"from": "Patrick", "text": "I’m still here."}, {"from": "James", "text": "Where?"}, {"from": "Patrick", "text": "In front of my house?"}, {"from": "James", "text": "That you can’t get in?"}, {"from": "James", "text": "Maybe that’s why you couldn’t get in the party."}, {"from": "Patrick", "text": "This is one big prank, isn’t it?"}, {"from": "Patrick", "text": "You guys are hiding behind the bushes aren’t you?"}, {"from": "Patrick", "text": "I don’t know how you turned the power off, but I bet you did."}, {"from": "James", "text": "It’s not a prank."}, {"from": "Patrick", "text": "I’m alive."}, {"from": "Patrick", "text": "I must be seeing things, though."}, {"from": "Patrick", "text": "I mean, I can’t even see stars in the sky, how weird is that?"}, {"from": "Patrick", "text": "I bet you’re still at the party. I’m going back there."}, {"from": "James", "text": "It’s not going to do any good."}, {"from": "James", "text": "We’re still not going to be th ere."}, {"from": "Patrick", "text": "That’s what you say."}, {"from": "Patrick", "text": "Well, I’m coming back anyway."}, {"from": "James", "text": "It’s not going to do any good."}, {"from": "James", "text": "I’m sick of your stupid prank."}, {"from": "James", "text": "Just to let you know, I’m on my way back."}, {"from": "James", "text": "I’m going to break in what I get there, if I have to."}, {"from": "James", "text": "If you don’t let me in."}, {"from": "Patrick", "text": "We can’t do anything. I told you!"}, {"from": "Patrick", "text": "We’re just not in the same place anymore"}, {"from": "Patrick", "text": "If no one opens the door, I’m going to break the window."}, {"from": "Patrick", "text": "Just to warn you."}, {"from": "Patrick", "text": "You’re probably all hiding in there."}, {"from": "James", "text": "No one’s hiding."}, {"from": "Patrick", "text": "Good. Because I’ll find you if you are."}, {"from": "Patrick", "text": "I’m right outside."}, {"from": "Patrick", "text": "The house is dark, I bet you warned everyone I was coming back."}, {"from": "James", "text": "Nobody’s hiding, and I didn’t warn anyone."}, {"from": "Patrick", "text": "I’m going to break in."}, {"from": "Patrick", "text": "I’m going to get to the party."}, {"from": "Patrick", "text": "Either someone opens the door or I break the window."}, {"from": "James", "text": "You can’t come to the party."}, {"from": "Patrick", "text": "PHOTO: Hand holding a rock (night)"}, {"from": "Patrick", "text": "This is coming through the window"}, {"from": "Patrick", "text": "Did you hear that? I just broke the window."}, {"from": "Patrick", "text": "You better come out of your hiding places, because I’m coming."}, {"from": "James", "text": "No one’s hiding."}, {"from": "Patrick", "text": "I hear something."}, {"from": "Patrick", "text": "Finally. I knew it."}, {"from": "James", "text": "Knew what? There’s nothing."}, {"from": "Patrick", "text": "I just found the party."}, {"from": "James", "text": "You did?"}, {"from": "Patrick", "text": "Yeah, see?"}, {"from": "Patrick", "text": "PHOTO: Teens at a party"}, {"from": "James", "text": "What are they?"}, {"from": "James", "text": "They’re not anyone I know"}, {"from": "James", "text": "But if YOU can see them…"}, {"from": "Patrick", "text": "If I can see them what?"}, {"from": "Patrick", "text": "WHAT?"}, {"from": "James", "text": "…then they’re just like you."}]}]}, {"id": "first-impressions", "title": "First Impressions", "description": "Ellen invites her new boyfriend over for dinner with her family. First impressions mean everything, so Jim’s a bit nervous. Ellen isn’t worried, though. Her family is convinced that she has good taste in men.", "genre": "horror", "author": "Rich Samuels", "episodes": [{"left": "Ellen", "right": "Jim", "description": "Ellen invites her new boyfriend over for dinner with her family. First impressions mean everything, so Jim’s a bit nervous. Ellen isn’t worried, though. Her family is convinced that she has good taste in men.", "messages": [{"from": "Ellen", "text": "I would really like you over for dinner."}, {"from": "Jim", "text": "Okay!"}, {"from": "Ellen", "text": "To my parent’s place."}, {"from": "Jim", "text": "I know. I knew it was coming."}, {"from": "Ellen", "text": "I think they would like you."}, {"from": "Jim", "text": "I have to admit, I’m a little nervous."}, {"from": "Ellen", "text": "You don’t need to be. Everyone will like you."}, {"from": "Jim", "text": "Everyone?"}, {"from": "Ellen", "text": "My brothers and sisters."}, {"from": "Jim", "text": "Everyone’s going to be there."}, {"from": "Ellen", "text": "Of course! Everyone wants to be a part of it."}, {"from": "Jim", "text": "Wow, your family really likes being part of your life."}, {"from": "Ellen", "text": "Yeah, they’re like that."}, {"from": "Jim", "text": "What’s your mom like?"}, {"from": "Ellen", "text": "She’s be fine. She’ll like you."}, {"from": "Ellen", "text": "She’ll be happy you have “meat on your ones” lol"}, {"from": "Jim", "text": "I’m still trying to lose it."}, {"from": "Ellen", "text": "But you won’t by next weekend, so that’s okay."}, {"from": "Jim", "text": "Yeah."}, {"from": "Ellen", "text": "She’s going to be so happy I found someone I would like."}, {"from": "Jim", "text": "Would like?"}, {"from": "Ellen", "text": "Well, DO like."}, {"from": "Jim", "text": "How many brothers and sisters do you have?"}, {"from": "Ellen", "text": "Five, I’m the oldest."}, {"from": "Jim", "text": "Well, that’s good at least."}, {"from": "Ellen", "text": "I guess. It’s a responsibility."}, {"from": "Ellen", "text": "You know, sometimes I have to take care of them."}, {"from": "Ellen", "text": "Make sure they’re fed."}, {"from": "Jim", "text": "Well, at least you’re older now. You can have your own life."}, {"from": "Ellen", "text": "That’s true."}, {"from": "Jim", "text": "Your family sounds nice, anyway."}, {"from": "Ellen", "text": "They are nice."}, {"from": "Ellen", "text": "Like I said, everyone’s going to like you."}, {"from": "Ellen", "text": "They’ve got good taste."}, {"from": "Jim", "text": "Well, I don’t know about that!"}, {"from": "Ellen", "text": "You have to trust me on this."}, {"from": "Jim", "text": "Are they going to be, like, protective?"}, {"from": "Ellen", "text": "Well, no."}, {"from": "Ellen", "text": "They know how to share."}, {"from": "Jim", "text": "That’s good."}, {"from": "Jim", "text": "I’ll do my best to make a good impression."}, {"from": "Ellen", "text": "Like they say you only get one chance to make a first impression."}, {"from": "Jim", "text": "I know. They’ll like me, I promise."}, {"from": "Ellen", "text": "Oh, one thing."}, {"from": "Jim", "text": "What’s that?"}, {"from": "Ellen", "text": "Don’t wear cologne."}, {"from": "Jim", "text": "Are they allergic?"}, {"from": "Ellen", "text": "Sort of."}, {"from": "Jim", "text": "Ok. No problem."}, {"from": "Jim", "text": "------"}, {"from": "Jim", "text": "Friday Afternoon"}, {"from": "Jim", "text": "Ellen?"}, {"from": "Ellen", "text": "Hi, you all ready?"}, {"from": "Jim", "text": "I’ll be heading over in a little while."}, {"from": "Ellen", "text": "Great! They’re all looking forward to you."}, {"from": "Ellen", "text": "….to seeing you."}, {"from": "Jim", "text": "I’m looking forward to seeing them, too!"}, {"from": "Jim", "text": "So, what we having for dinner?"}, {"from": "Ellen", "text": "Steak probably."}, {"from": "Ellen", "text": "My mom loves steak. So does my dad."}, {"from": "Ellen", "text": "Well, everyone."}, {"from": "Ellen", "text": "We’re all steak eaters."}, {"from": "Jim", "text": "I guess it’s steak, then!"}, {"from": "Jim", "text": "Good thing I’m not a vegetarian!"}, {"from": "Ellen", "text": "Good thing we’re not!"}, {"from": "Jim", "text": "I bet it’s going to be great."}, {"from": "Ellen", "text": "It is, my mom’s a great cook."}, {"from": "Jim", "text": "So, should I pick you up at 6:30?"}, {"from": "Ellen", "text": "No, you could just go straight to their house."}, {"from": "Ellen", "text": "I’m helping my parents get ready."}, {"from": "Ellen", "text": "There’s a lot of work to do."}, {"from": "Jim", "text": "Yeah, I guess there would be."}, {"from": "Ellen", "text": "They’re going to barbeque."}, {"from": "Jim", "text": "Awesome! I love barbeque."}, {"from": "Ellen", "text": "You can actually come a little earlier, if you want."}, {"from": "Jim", "text": "How early?"}, {"from": "Ellen", "text": "I’ll be there at four. You could come then."}, {"from": "Ellen", "text": "Then they wouldn’t have to rush."}, {"from": "Jim", "text": "Okay. I can do that."}, {"from": "Ellen", "text": "Great! I’ll tell my mom. She’ll be happy!"}, {"from": "Ellen", "text": "So will by brothers and sisters!"}, {"from": "Ellen", "text": "They like to eat early."}, {"from": "Jim", "text": "I bet it takes time to cook that much steak."}, {"from": "Ellen", "text": "It’s getting it ready that takes the time."}, {"from": "Ellen", "text": "Before you cook it."}, {"from": "Jim", "text": "Like marinating it or something?"}, {"from": "Ellen", "text": "Just, the butchering. You know, carving it up…"}, {"from": "Jim", "text": "Wow, you make it sound like you have a whole cow there!"}, {"from": "Ellen", "text": "Hardly. I promise you, we have NO cow."}, {"from": "Jim", "text": "Well that’s a relief!"}, {"from": "Jim", "text": "This sounds like it’s going to be an awesome dinner."}, {"from": "Ellen", "text": "It will!"}, {"from": "Ellen", "text": "It’s going to be delicious."}, {"from": "Jim", "text": "Ellen, I’m really happy to be part of your life."}, {"from": "Jim", "text": "And maybe even part of your family."}, {"from": "Ellen", "text": "So are we."}, {"from": "Ellen", "text": "My mom says I have good taste in men."}]}]}, {"id": "the-doctor", "title": "The Doctor", "description": "", "genre": "horror", "author": "", "episodes": [{"left": "Doctor", "right": "Josh", "description": "", "messages": [{"from": "Doctor", "text": "Hello, Josh. I’m Doctor Beslow"}, {"from": "Josh", "text": "Hi Doc – thanks for texting me."}, {"from": "Doctor", "text": "Your friend Johnny told me about you, that you have a problem."}, {"from": "Josh", "text": "Yeah, a bad problem. I’m out camping. I’m kind of in the middle of nowhere."}, {"from": "Josh", "text": "I mean really far."}, {"from": "Josh", "text": "I guess I got hurt."}, {"from": "Doctor", "text": "How so?"}, {"from": "Josh", "text": "I’m not sure, it’s like, in my ribs somewhere."}, {"from": "Doctor", "text": "And no one can help you?"}, {"from": "Josh", "text": "I’m alone. Like you couldn’t get here for days."}, {"from": "Josh", "text": "And this really hurts bad."}, {"from": "Josh", "text": "That’s why Johnny found you."}, {"from": "Doctor", "text": "You say it’s around your ribs?"}, {"from": "Josh", "text": "It’s all bruised."}, {"from": "Doctor", "text": "Sounds pretty bad."}, {"from": "Josh", "text": "Yeah, I know. What do I do."}, {"from": "Doctor", "text": "Well, it was a good thing you didn’t try to hike out."}, {"from": "Josh", "text": "But it still hurts."}, {"from": "Doctor", "text": "I’m going to have to take a better look at it."}, {"from": "Josh", "text": "What do you mean?"}, {"from": "Doctor", "text": "Do you have a knife."}, {"from": "Josh", "text": "My hunting knife…why?"}, {"from": "Doctor", "text": "You’re going to have to do something for me."}, {"from": "Josh", "text": "What do you mean, “do something?”"}, {"from": "Doctor", "text": "You’re going to have to make an incision."}, {"from": "Josh", "text": "WHAT? I can’t do that!"}, {"from": "Doctor", "text": "You want to die there?"}, {"from": "Josh", "text": "No."}, {"from": "Doctor", "text": "Then you’re going to have to make an incision."}, {"from": "Josh", "text": "What if it bleeds?"}, {"from": "Doctor", "text": "Don’t worry about that."}, {"from": "Josh", "text": "What do you mean?"}, {"from": "Doctor", "text": "Who’s the doctor here?"}, {"from": "Josh", "text": "You, but won’t it bleed?"}, {"from": "Doctor", "text": "Of course it will bleed, but that’s my concern."}, {"from": "Doctor", "text": "Make the incision."}, {"from": "Doctor", "text": "From left to right."}, {"from": "Doctor", "text": "Three…no, four inches long."}, {"from": "Doctor", "text": "Then show me what you’ve done."}, {"from": "Josh", "text": "Are you sure about this?"}, {"from": "Doctor", "text": "Very sure. I’m a doctor, remember."}, {"from": "Josh", "text": "You sure there isn’t another way?"}, {"from": "Doctor", "text": "Make the incision, Josh."}, {"from": "Josh", "text": "I’ll try"}, {"from": "Josh", "text": "Ok, I made the incision."}, {"from": "Doctor", "text": "Very good."}, {"from": "Doctor", "text": "Now pull it apart."}, {"from": "Josh", "text": "What?"}, {"from": "Doctor", "text": "Pull it apart, so you can see under the skin."}, {"from": "Josh", "text": "But that’s going to hurt!"}, {"from": "Doctor", "text": "Would you rather die?"}, {"from": "Josh", "text": "No."}, {"from": "Doctor", "text": "Pull the skin apart."}, {"from": "Josh", "text": "It’s going to hurt so much."}, {"from": "Doctor", "text": "Would you rather die?"}, {"from": "Josh", "text": "No."}, {"from": "Doctor", "text": "Pull it apart."}, {"from": "Doctor", "text": "As wide as you can!"}, {"from": "Josh", "text": "It doesn’t open that much."}, {"from": "Doctor", "text": "You need to make a bigger incision."}, {"from": "Josh", "text": "BIGGER???"}, {"from": "Doctor", "text": "About twice as long."}, {"from": "Josh", "text": "Please, I’d rather not."}, {"from": "Doctor", "text": "You have to."}, {"from": "Doctor", "text": "Just do it quickly."}, {"from": "Josh", "text": "I’m bleeding all over the place."}, {"from": "Doctor", "text": "Did you do it?"}, {"from": "Josh", "text": "Yeah."}, {"from": "Doctor", "text": "Good."}, {"from": "Josh", "text": "What do you think is wrong with me, Doctor?"}, {"from": "Doctor", "text": "You’ve got a pretty bad injury."}, {"from": "Josh", "text": "I know, but, like, what do I do?"}, {"from": "Doctor", "text": "I think we may have to operate."}, {"from": "Josh", "text": "Operate? How?"}, {"from": "Doctor", "text": "You’re going to have to operate on yourself."}, {"from": "Josh", "text": "What???"}, {"from": "Doctor", "text": "I think you can."}, {"from": "Doctor", "text": "You don’t have a choice. With a wound like that, you can bleed to death."}, {"from": "Josh", "text": "But you told me to do it!"}, {"from": "Doctor", "text": "And now I want you to do what I’m saying."}, {"from": "Josh", "text": "I can’t operate on myself!"}, {"from": "Josh", "text": "Can’t you airlift in and do it yourself?"}, {"from": "Doctor", "text": "Don’t be ridiculous."}, {"from": "Josh", "text": "More ridiculous than me operating on myself?"}, {"from": "Doctor", "text": "It’s just going to take some concentration."}, {"from": "Josh", "text": "It’s going to take a LOT more than that!"}, {"from": "Doctor", "text": "Do what I say! I’m the doctor!"}, {"from": /* Procedural cover scenes, so no third-party film stills are used. */
function cover(story) {
  let seed = [...story.id].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const sky = story.genre === "thriller" ? ["#1c2a3d", "#0f1220"] : ["#2b1b44", "#0d0a1c"];
  const glow = story.genre === "thriller" ? "#c9d27a" : "#e2c06a";
  let trees = "";
  for (let i = 0; i < 9; i++) {
    const x = rnd() * 220, w = 3 + rnd() * 6, h = 90 + rnd() * 60;
    trees += `<rect x="${x.toFixed(1)}" y="${(150 - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#07050f" opacity="${(0.55 + rnd() * 0.45).toFixed(2)}"/>`;
  }
  const hx = 70 + rnd() * 90, scene = rnd() < 0.5
    ? `<path d="M${hx} 118l26-20 26 20v32h-52z" fill="#0a0814"/><rect x="${hx + 20}" y="124" width="10" height="13" fill="${glow}" opacity=".85"/>`
    : `<circle cx="${hx}" cy="44" r="16" fill="${glow}" opacity=".55"/>`;
  const id = "f" + story.id.replace(/\W/g, "");
  return `<svg class="cover" viewBox="0 0 220 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
    <rect width="220" height="150" fill="url(#${id})"/>${scene}${trees}
    <rect y="112" width="220" height="38" fill="#b7b0d8" opacity=".07"/></svg>`;
}

const app = document.getElementById("app");

const favs = () => store.get("favs", []);
const totalOf = s => s.episodes.reduce((n, e) => n + e.messages.length, 0);
function progress(s) {
  const st = store.get("p:" + s.id, { ep: 0, i: 0 });
  const read = s.episodes.slice(0, st.ep).reduce((n, e) => n + e.messages.length, 0) + st.i;
  return Math.min(100, Math.round(read * 100 / totalOf(s)));
}

}

/* Featured slider: swipe by hand, auto-advances every 4 s, pauses while touched. */
let slideTimer = null;
function startSlider() {
  clearInterval(slideTimer);
  const el = document.getElementById("slider"), dots = [...document.querySelectorAll("#dots i")];
  if (!el) return;
  const index = () => Math.round(el.scrollLeft / el.clientWidth);
  const mark = () => dots.forEach((d, i) => d.classList.toggle("on", i === index()));
  el.addEventListener("scroll", () => requestAnimationFrame(mark), { passive: true });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let pausedUntil = 0;

  slideTimer = setInterval(() => {
    if (!document.body.contains(el)) return clearInterval(slideTimer);

    const next = (index() + 1) % dots.length;

    <div id="results">${query ? `<div class="list">${found.map(row).join("") || '<p class="hint">Nothing found</p>'}</div>` :
      (recent.length ? `<span class="label">Recent</span><div class="list">${recent.map(row).join("")}</div>` : "") +
      `<span class="label">Popular</span><div class="list">${STORIES.map(row).join("")}</div>`}</div>`);
  const q = document.getElementById("q");
  q.oninput = () => { query = q.value; const pos = q.selectionStart; search(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => preview(b.dataset.id));
}

function menu() {
  shell(["Subscription", "Language", "Rate the App", "Share the App", "Restore Purchases", "E-mail Support", "Suggest a Story"]
    .map((n, i) => `<button id="m-${i}" data-m="${n}">${n}</button>`).join("") + `<p>For each suggested story we publish you get $20</p>`);
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => toast(b.dataset.m + " — in the iPhone app"));
}

/* Story preview: cover, numbers, description, parts. Rating is a demo value until real reviews exist. */
function preview(id) {
  clearInterval(slideTimer);
  const s = STORIES.find(x => x.id === id), pct = progress(s), total = totalOf(s), liked = favs().includes(id);
  const rating = (4.2 + ([...id].reduce((a, c) => a + c.charCodeAt(0), 0) % 8) / 10).toFixed(1);
  const st = store.get("p:" + id, { ep: 0, i: 0 });
  app.innerHTML = `<section class="preview">
    <div class="pv-cover">${cover(s)}<span class="shade"></span>
      <button class="back" id="pv-back" aria-label="Back">‹</button>
      <button class="like" id="pv-like" aria-pressed="${liked}" aria-label="Favourite">${ICON.heart}</button>
      <div><small>${GENRES[s.genre]}</small><h1>${esc(s.title)}</h1></div></div>
    <div class="pv-body">
      <div class="stats">
        <div class="stat"><b>★ ${rating}</b><span>Rating</span></div>
        <div class="stat"><b>~${Math.max(1, Math.round(total * 4 / 60))} min</b><span>Read</span></div>
        <div class="stat"><b>${s.episodes.length}</b><span>${s.episodes.length > 1 ? "Parts" : "Part"}</span></div>
        <div class="stat"><b>${total}</b><span>Messages</span></div>
      </div>
      <p class="desc">${esc(s.description)}</p>
      ${s.author ? `<span class="by">Written by ${esc(s.author)}</span>` : ""}
      ${s.episodes.length > 1 ? `<div class="parts">${s.episodes.map((e, i) => `<button class="part" id="pt-${i}" data-ep="${i}"><span>Part ${i + 1}</span><small>${e.messages.length} messages${i < st.ep ? " · read" : ""}</small></button>`).join("")}</div>` : ""}
      <button class="read" id="pv-read">${pct >= 100 ? "Read again" : pct ? "Continue · " + pct + "%" : "Start reading"}</button>
      <p class="demo">Rating is a sample value in this preview.</p>
    </div></section>`;
  document.getElementById("pv-back").onclick = render;
  document.getElementById("pv-like").onclick = () => { toggleFav(id); preview(id); };
  document.getElementById("pv-read").onclick = () => openStory(id, pct >= 100 ? 0 : undefined);
  app.querySelectorAll("[data-ep]").forEach(b => b.onclick = () => openStory(id, +b.dataset.ep));
}

function render() { clearInterval(slideTimer); ({ menu, home, fav: favourites, search }[tab] || home)(); }

let timer = null;
function openStory(id, epIndex) {
  const s = STORIES.find(x => x.id === id);
  store.set("recent", [id, ...store.get("recent", []).filter(x => x !== id)].slice(0, 3));
  let st = store.get("p:" + id, { ep: 0, i: 0 });
  if (epIndex != null) st = { ep: epIndex, i: 0 };
  if (st.ep >= s.episodes.length) st = { ep: 0, i: 0 };
  const ep = s.episodes[st.ep];
  app.innerHTML = `<section class="chat">
      <div class="head"><button class="back" id="back" aria-label="Back">‹</button><div class="avatar">${esc(ep.left[0])}</div>
        <div class="who"><b>${esc(ep.left)}</b><small id="status">online</small></div>
        <span class="ep">${s.episodes.length > 1 ? "Part " + (st.ep + 1) + " of " + s.episodes.length : ""}</span></div>
      <div class="log" id="log" aria-live="polite"><div class="intro">${esc(ep.description || s.description)}</div></div>
      <div class="foot" id="foot"></div></section>`;
  const log = document.getElementById("log"), foot = document.getElementById("foot"), status = document.getElementById("status");
  document.getElementById("back").onclick = () => { clearTimeout(timer); preview(id); };
  const add = m => { const d = document.createElement("div"); d.className = "msg " + (m.from === ep.right ? "me" : "them"); d.textContent = m.text; log.appendChild(d); };
  for (let k = 0; k < st.i; k++) add(ep.messages[k]);
  log.scrollTop = log.scrollHeight;
  let busy = false;
  const save = () => store.set("p:" + id, st);
  function controls() {
    if (st.i >= ep.messages.length) {
      const last = st.ep + 1 >= s.episodes.length;
      log.insertAdjacentHTML("beforeend", `<div class="end"><strong>${last ? "The End" : "To be continued…"}</strong><span>${esc(s.title)}${s.episodes.length > 1 ? " · part " + (st.ep + 1) : ""}</span></div>`);
      log.scrollTop = log.scrollHeight;
      foot.innerHTML = `${last ? "" : `<button class="tap primary" id="next">Next part</button>`}<button class="tap" id="again">${last ? "Read again" : "Restart"}</button>`;
      const next = document.getElementById("next");
      if (next) next.onclick = () => { store.set("p:" + id, { ep: st.ep + 1, i: 0 }); openStory(id, st.ep + 1); };
      document.getElementById("again").onclick = () => { store.set("p:" + id, { ep: 0, i: 0 }); openStory(id, 0); };
      if (last) { st = { ep: s.episodes.length, i: 0 }; save(); }
      return;
    }
    foot.innerHTML = `<button class="tap" id="tap">Tap to continue</button>`;
    document.getElementById("tap").onclick = step;
  }
  function step() {
    if (busy || st.i >= ep.messages.length) return;
    const m = ep.messages[st.i];
    if (m.from === ep.right) { add(m); st.i++; save(); log.scrollTop = log.scrollHeight; return controls(); }
    busy = true; status.textContent = "typing…";
    const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(t); log.scrollTop = log.scrollHeight;
    const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 150 : Math.min(1800, 450 + m.text.length * 22);
    timer = setTimeout(() => { t.remove(); add(m); st.i++; save(); status.textContent = "online"; busy = false; log.scrollTop = log.scrollHeight; controls(); }, delay);
  }
  log.onclick = step;
  controls();
}

render();
</script>
