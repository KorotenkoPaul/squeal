<style>
/* Layout: a phone-shaped reading app — library of stories, then a full-height chat that advances one message per tap. */
:root {
  --ink: #0b0c10;          /* page, the dark room */
  --surface: #14161b;      /* cards, header */
  --line: #252830;
  --them: #22252c;         /* incoming bubble */
  --me: #5a161c;           /* outgoing bubble, dried blood */
  --text: #ebe7e0;
  --muted: #8d919b;
  --accent: #c0333c;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --story: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--ui); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Library */
.lib { overflow-y: auto; padding-block: 20px 32px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 44px; letter-spacing: .02em; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.tag { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  display: flex; flex-direction: column; gap: 8px; }
.card h2 { font-family: var(--story); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.meta b { color: var(--accent); font-weight: 600; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.note { color: var(--muted); font-size: 12px; line-height: 1.5; }

/* Chat */
.chat { height: 100%; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.back { font-size: 26px; line-height: 1; padding: 4px 8px 4px 0; color: var(--accent); }
.who { display: flex; flex-direction: column; min-width: 0; }
.who b { font-weight: 600; }
.who small { color: var(--muted); font-size: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--them); display: grid; place-items: center;
  font-family: var(--display); font-size: 18px; flex: none; }
.ep { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.log { flex: 1; overflow-y: auto; padding-block: 16px 8px; display: flex; flex-direction: column; gap: 6px; }
.day { align-self: center; color: var(--muted); font-size: 12px; margin-bottom: 8px; text-align: center; max-width: 34ch; line-height: 1.5; }
.msg { max-width: 78%; padding: 9px 13px; border-radius: 18px; line-height: 1.38; font-size: 16px; word-wrap: break-word;
  animation: rise .22s ease-out both; }
.them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 5px; }
.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 5px; }
.typing { align-self: flex-start; background: var(--them); border-radius: 18px; padding: 12px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }
.foot { padding-block: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
.tap { width: 100%; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  color: var(--muted); font-size: 15px; }
.row { display: flex; gap: 10px; }
.row .tap { flex: 1; }
.end { align-self: center; text-align: center; padding: 18px 8px 4px; display: flex; flex-direction: column; gap: 6px; }
.end strong { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--accent); }
.end span { color: var(--muted); font-size: 13px; }
@keyframes rise { from { opacity: .0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none } .typing i { animation: none; opacity: .7 } }
</style>

<script>
const STORIES = [{"id": "nobodys-home", "title": "Nobody’s Home", "description": "When Patrick finally arrives at Sandra’s party, her house is completely dark and no one’s home. At first, Patrick is convinced he’s the victim of a prank, but his friend James has other ideas.", "genre": "horror", "episodes": [{"left": "James", "right": "Patrick", "description": "When Patrick finally arrives at Sandra’s party, her house is completely dark and no one’s home. At first, Patrick is convinced he’s the victim of a prank, but his friend James has other ideas.", "messages": [{"from": "James", "text": "Where are you?"}, {"from": "Patrick", "text": "Where do you think? I’m at home."}, {"from": "James", "text": "Why are you at home?"}, {"from": "Patrick", "text": "Where else would I be?"}, {"from": "James", "text": "Sandra’s, where do you think?"}, {"from": "Patrick", "text": "Why would I be there??"}, {"from": "James", "text": "Everyone else is!"}, {"from": "Patrick", "text": "Why is everyone else there?"}, {"from": "James", "text": "Her party! Get over here!"}, {"from": "Patrick", "text": "I’m tired. I don’t feel like it."}, {"from": "James", "text": "That’s no excuse."}, {"from": "Patrick", "text": "Is this a prank?"}, {"from": "James", "text": "Get over here!"}, {"from": "James", "text": "You want to be the only one left out?"}, {"from": "James", "text": "Everyone’s asking about you!"}, {"from": "James", "text": "You’re the ONLY one who isn’t here!"}, {"from": "Patrick", "text": "Really? Everyone else is there?"}, {"from": "James", "text": "Everyone."}, {"from": "James", "text": "So, are you coming?"}, {"from": "Patrick", "text": "Okay."}, {"from": "Patrick", "text": "I’ll be there in about half an hour."}, {"from": "Patrick", "text": "------"}, {"from": "Patrick", "text": "Uh…James?"}, {"from": "James", "text": "Are you here yet?"}, {"from": "Patrick", "text": "Well yeah. I’m right outside Sandra’s house."}, {"from": "James", "text": "Right outside? Where?"}, {"from": "Patrick", "text": "At least, I think I am. Right in front."}, {"from": "Patrick", "text": "143 Country Village Lane, right?"}, {"from": "James", "text": "Right across from my house."}, {"from": "Patrick", "text": "Well, where are you guys?"}, {"from": "James", "text": "We’re inside, and in the backyard."}, {"from": "Patrick", "text": "But…the house is totally dark."}, {"from": "James", "text": "What are you talking about?"}, {"from": "Patrick", "text": "It looks like no one’s home!"}, {"from": "Patrick", "text": "Is this a joke?"}, {"from": "James", "text": "If you didn’t want to come to the party, just say it."}, {"from": "Patrick", "text": "I’m right out front!"}, {"from": "James", "text": "I’m looking out front, and you’re not there."}, {"from": "Patrick", "text": "This IS a prank, isn’t it?"}, {"from": "James", "text": "Are you on something?"}, {"from": "Patrick", "text": "I’m on the right street."}, {"from": "James", "text": "Maybe you’re not. Knock on the door."}, {"from": "Patrick", "text": "You guys are all going to jump out at me, aren’t you?"}, {"from": "James", "text": "You’re at the wrong house."}, {"from": "Patrick", "text": "I can’t be."}, {"from": "James", "text": "Knock."}, {"from": "Patrick", "text": "Ok, fine."}, {"from": "Patrick", "text": "Nobody’s answering."}, {"from": "James", "text": "Knock louder!"}, {"from": "Patrick", "text": "Nobody’s answering."}, {"from": "James", "text": "You’re definitely hallucinating."}, {"from": "Patrick", "text": "The lights are on at your house."}, {"from": "James", "text": "My house?"}, {"from": "Patrick", "text": "You live right across the street from Sandra, don’t you?"}, {"from": "James", "text": "Yeah."}, {"from": "Patrick", "text": "I’m going to ask your parents."}, {"from": "Patrick", "text": "They’ll tell me what’s going on."}, {"from": "James", "text": "Don’t bother my parents."}, {"from": "Patrick", "text": "Why? Are you guys are hiding there?"}, {"from": "James", "text": "You’re imagining things."}, {"from": "James", "text": "Go knock, then."}, {"from": "Patrick", "text": "Are they out?"}, {"from": "James", "text": "Why?"}, {"from": "Patrick", "text": "The house is dark. Like Sandra’s."}, {"from": "Patrick", "text": "And nobody’s answering."}, {"from": "Patrick", "text": "Why are you doing this to me?"}, {"from": "James", "text": "I’m not."}, {"from": "Patrick", "text": "I’m going home. I hope you’re satisfied."}, {"from": "James", "text": "Just come on to the party."}, {"from": "Patrick", "text": "I CAN’T IF YOU WON’T TELL ME WHERE IT IS!"}, {"from": "Patrick", "text": "Hey, is the power out or something?"}, {"from": "James", "text": "What do you mean?"}, {"from": "Patrick", "text": "All the houses are dark."}, {"from": "Patrick", "text": "Every house I walk by."}, {"from": "Patrick", "text": "Even my house."}, {"from": "Patrick", "text": "And I KNOW my family’s home."}, {"from": "James", "text": "Maybe they went out."}, {"from": "Patrick", "text": "I can’t get in."}, {"from": "James", "text": "What?"}, {"from": "Patrick", "text": "My key won’t work. I can’t get in my own house."}, {"from": "Patrick", "text": "I can’t get in my own house!"}]}, {"left": "Patrick", "right": "James", "description": "Terrified, Patrick returns to his own home, and finds that the house dark and the street deserted. James comes to help, but though they’re both standing in front of the house, they can’t see each other.", "messages": [{"from": "Patrick", "text": "This makes no sense."}, {"from": "James", "text": "Maybe you’re on the wrong street."}, {"from": "Patrick", "text": "I’m not."}, {"from": "Patrick", "text": "This is weird. Everything’s so quiet."}, {"from": "Patrick", "text": "I don’t even see any cars driving."}, {"from": "James", "text": "I think you’re having some mental thing. Seriously."}, {"from": "Patrick", "text": "Tell me where the party is."}, {"from": "Patrick", "text": "I don’t like this."}, {"from": "James", "text": "I’ll come pick you up."}, {"from": "Patrick", "text": "I’m right in front of my house."}, {"from": "James", "text": "Are you sure?"}, {"from": "Patrick", "text": "Yeah, I’m sure. We have a red mailbox, remember?"}, {"from": "Patrick", "text": "I’m right in front of it."}, {"from": "Patrick", "text": "I haven’t seen one car drive by."}, {"from": "James", "text": "I’m on my way."}, {"from": "Patrick", "text": "Hurry up."}, {"from": "Patrick", "text": "Please."}, {"from": "Patrick", "text": "-----"}, {"from": "Patrick", "text": "Are you here?"}, {"from": "James", "text": "Where are YOU?"}, {"from": "Patrick", "text": "In front of my house!"}, {"from": "James", "text": "You’re sure you’re not on drugs?"}, {"from": "Patrick", "text": "You know me."}, {"from": "Patrick", "text": "Maybe I’m insane."}, {"from": "Patrick", "text": "I don’t know."}, {"from": "James", "text": "I’m standing in front of your mailbox."}, {"from": "James", "text": "PHOTO: James’ photo of Patrick’s red mailbox"}, {"from": "Patrick", "text": "I’m standing in front of the mailbox."}, {"from": "Patrick", "text": "PHOTO: Patrick’s photo of Patrick’s red mailbox (the same mailbox)"}, {"from": "Patrick", "text": "This can’t be happening."}, {"from": "James", "text": "But if you’re not here, then where are you?"}, {"from": "Patrick", "text": "I DON’T KNOW!"}, {"from": "James", "text": "I just told your parents."}, {"from": "Patrick", "text": "What do you mean?"}, {"from": "James", "text": "That’s you’re lost!"}, {"from": "Patrick", "text": "I’m not, though!"}, {"from": "James", "text": "They’re calling the police."}, {"from": "Patrick", "text": "But I’m right in front of my house."}, {"from": "James", "text": "What if you’re imagining it?"}, {"from": "Patrick", "text": "I’m NOT."}, {"from": "Patrick", "text": "I don’t think."}, {"from": "Patrick", "text": "Anyway, you saw the picture."}, {"from": "Patrick", "text": "I took the picture."}, {"from": "Patrick", "text": "You KNOW I’m right here."}, {"from": "James", "text": "Can you hear the sirens?"}, {"from": "Patrick", "text": "What sirens?"}, {"from": "James", "text": "The police."}, {"from": "Patrick", "text": "I don’t hear anything."}, {"from": "Patrick", "text": "Are there lights on at my house?"}, {"from": "James", "text": "Yeah."}, {"from": "Patrick", "text": "Not here."}, {"from": "Patrick", "text": "And the streetlights just went out."}, {"from": "Patrick", "text": "I guess you still have streetlights?"}, {"from": "James", "text": "Everything’s normal."}, {"from": "Patrick", "text": "No lights, no cars, no people."}, {"from": "Patrick", "text": "You have no idea how quiet it is."}, {"from": "James", "text": "The police are asking, what’s the last time you remember seeing people?"}, {"from": "Patrick", "text": "Idk, I guess my family, before I left? Or maybe walking there?"}, {"from": "Patrick", "text": "I’m not sure."}, {"from": "James", "text": "They’re sending people to look for you."}, {"from": "Patrick", "text": "But I’m right in front of the house."}, {"from": "Patrick", "text": "I’m touching the mailbox."}, {"from": "Patrick", "text": "It’s real."}, {"from": "James", "text": "Maybe that’s what you think."}, {"from": "Patrick", "text": "BUT YOU SAW THE PHOTO!"}, {"from": "Patrick", "text": "It’s REAL!"}, {"from": "James", "text": "The police just told us something."}, {"from": "Patrick", "text": "What?"}, {"from": "James", "text": "Somebody found you."}, {"from": "Patrick", "text": "Huh? Nobody’s here."}, {"from": "James", "text": "In a ditch by the side of the road."}, {"from": "Patrick", "text": "Obviously, it’s not me."}, {"from": "James", "text": "They said you were hit by a car."}, {"from": "Patrick", "text": "It’s not me!"}, {"from": "James", "text": "It is you."}, {"from": "Patrick", "text": "OBVIOUSLY, it’s not me."}, {"from": "James", "text": "It’s obvious it’s you."}, {"from": "Patrick", "text": "“It?”"}, {"from": "James", "text": "They say you’re dead."}]}, {"left": "Patrick", "right": "James", "description": "Patrick insists that he isn’t dead, despite all of the evidence, and sets off back to Sandra’s house to find everyone and reveal the prank once and for all. He finds something else, entirely.", "messages": [{"from": "Patrick", "text": "I’m not dead."}, {"from": "Patrick", "text": "PHOTO: Selfie of Patrick"}, {"from": "Patrick", "text": "Do I look dead?"}, {"from": "Patrick", "text": "They made a mistake."}, {"from": "Patrick", "text": "I wasn’t hit by a car."}, {"from": "James", "text": "It’s you."}, {"from": "Patrick", "text": "It’s not."}, {"from": "James", "text": "It’s your clothes, your ID."}, {"from": "Patrick", "text": "Dead people can’t text, James."}, {"from": "Patrick", "text": "And they can’t take pictures."}, {"from": "Patrick", "text": "I mean, maybe I’m insane, but I’m not dead."}, {"from": "James", "text": "They showed us a picture"}, {"from": "Patrick", "text": "Of what?"}, {"from": "James", "text": "Of you."}, {"from": "Patrick", "text": "PHOTO: Selfie of Patrick (Same as previous)"}, {"from": "Patrick", "text": "That’s me."}, {"from": "Patrick", "text": "I’m still here."}, {"from": "James", "text": "Where?"}, {"from": "Patrick", "text": "In front of my house?"}, {"from": "James", "text": "That you can’t get in?"}, {"from": "James", "text": "Maybe that’s why you couldn’t get in the party."}, {"from": "Patrick", "text": "This is one big prank, isn’t it?"}, {"from": "Patrick", "text": "You guys are hiding behind the bushes aren’t you?"}, {"from": "Patrick", "text": "I don’t know how you turned the power off, but I bet you did."}, {"from": "James", "text": "It’s not a prank."}, {"from": "Patrick", "text": "I’m alive."}, {"from": "Patrick", "text": "I must be seeing things, though."}, {"from": "Patrick", "text": "I mean, I can’t even see stars in the sky, how weird is that?"}, {"from": "Patrick", "text": "I bet you’re still at the party. I’m going back there."}, {"from": "James", "text": "It’s not going to do any good."}, {"from": "James", "text": "We’re still not going to be th ere."}, {"from": "Patrick", "text": "That’s what you say."}, {"from": "Patrick", "text": "Well, I’m coming back anyway."}, {"from": "James", "text": "It’s not going to do any good."}, {"from": "James", "text": "I’m sick of your stupid prank."}, {"from": "James", "text": "Just to let you know, I’m on my way back."}, {"from": "James", "text": "I’m going to break in what I get there, if I have to."}, {"from": "James", "text": "If you don’t let me in."}, {"from": "Patrick", "text": "We can’t do anything. I told you!"}, {"from": "Patrick", "text": "We’re just not in the same place anymore"}, {"from": "Patrick", "text": "If no one opens the door, I’m going to break the window."}, {"from": "Patrick", "text": "Just to warn you."}, {"from": "Patrick", "text": "You’re probably all hiding in there."}, {"from": "James", "text": "No one’s hiding."}, {"from": "Patrick", "text": "Good. Because I’ll find you if you are."}, {"from": "Patrick", "text": "I’m right outside."}, {"from": "Patrick", "text": "The house is dark, I bet you warned everyone I was coming back."}, {"from": "James", "text": "Nobody’s hiding, and I didn’t warn anyone."}, {"from": "Patrick", "text": "I’m going to break in."}, {"from": "Patrick", "text": "I’m going to get to the party."}, {"from": "Patrick", "text": "Either someone opens the door or I break the window."}, {"from": "James", "text": "You can’t come to the party."}, {"from": "Patrick", "text": "PHOTO: Hand holding a rock (night)"}, {"from": "Patrick", "text": "This is coming through the window"}, {"from": "Patrick", "text": "Did you hear that? I just broke the window."}, {"from": "Patrick", "text": "You better come out of your hiding places, because I’m coming."}, {"from": "James", "text": "No one’s hiding."}, {"from": "Patrick", "text": "I hear something."}, {"from": "Patrick", "text": "Finally. I knew it."}, {"from": "James", "text": "Knew what? There’s nothing."}, {"from": "Patrick", "text": "I just found the party."}, {"from": "James", "text": "You did?"}, {"from": "Patrick", "text": "Yeah, see?"}, {"from": "Patrick", "text": "PHOTO: Teens at a party"}, {"from": "James", "text": "What are they?"}, {"from": "James", "text": "They’re not anyone I know"}, {"from": "James", "text": "But if YOU can see them…"}, {"from": "Patrick", "text": "If I can see them what?"}, {"from": "Patrick", "text": "WHAT?"}, {"from": "James", "text": "…then they’re just like you."}]}]}, {"id": "first-impressions", "title": "First Impressions", "description": "Ellen invites her new boyfriend over for dinner with her family. First impressions mean everything, so Jim’s a bit nervous. Ellen isn’t worried, though. Her family is convinced that she has good taste in men.", "genre": "horror", "episodes": [{"left": "Ellen", "right": "Jim", "description": "Ellen invites her new boyfriend over for dinner with her family. First impressions mean everything, so Jim’s a bit nervous. Ellen isn’t worried, though. Her family is convinced that she has good taste in men.", "messages": [{"from": "Ellen", "text": "I would really like you over for dinner."}, {"from": "Jim", "text": "Okay!"}, {"from": "Ellen", "text": "To my parent’s place."}, {"from": "Jim", "text": "I know. I knew it was coming."}, {"from": "Ellen", "text": "I think they would like you."}, {"from": "Jim", "text": "I have to admit, I’m a little nervous."}, {"from": "Ellen", "text": "You don’t need to be. Everyone will like you."}, {"from": "Jim", "text": "Everyone?"}, {"from": "Ellen", "text": "My brothers and sisters."}, {"from": "Jim", "text": "Everyone’s going to be there."}, {"from": "Ellen", "text": "Of course! Everyone wants to be a part of it."}, {"from": "Jim", "text": "Wow, your family really likes being part of your life."}, {"from": "Ellen", "text": "Yeah, they’re like that."}, {"from": "Jim", "text": "What’s your mom like?"}, {"from": "Ellen", "text": "She’s be fine. She’ll like you."}, {"from": "Ellen", "text": "She’ll be happy you have “meat on your ones” lol"}, {"from": "Jim", "text": "I’m still trying to lose it."}, {"from": "Ellen", "text": "But you won’t by next weekend, so that’s okay."}, {"from": "Jim", "text": "Yeah."}, {"from": "Ellen", "text": "She’s going to be so happy I found someone I would like."}, {"from": "Jim", "text": "Would like?"}, {"from": "Ellen", "text": "Well, DO like."}, {"from": "Jim", "text": "How many brothers and sisters do you have?"}, {"from": "Ellen", "text": "Five, I’m the oldest."}, {"from": "Jim", "text": "Well, that’s good at least."}, {"from": "Ellen", "text": "I guess. It’s a responsibility."}, {"from": "Ellen", "text": "You know, sometimes I have to take care of them."}, {"from": "Ellen", "text": "Make sure they’re fed."}, {"from": "Jim", "text": "Well, at least you’re older now. You can have your own life."}, {"from": "Ellen", "text": "That’s true."}, {"from": "Jim", "text": "Your family sounds nice, anyway."}, {"from": "Ellen", "text": "They are nice."}, {"from": "Ellen", "text": "Like I said, everyone’s going to like you."}, {"from": "Ellen", "text": "They’ve got good taste."}, {"from": "Jim", "text": "Well, I don’t know about that!"}, {"from": "Ellen", "text": "You have to trust me on this."}, {"from": "Jim", "text": "Are they going to be, like, protective?"}, {"from": "Ellen", "text": "Well, no."}, {"from": "Ellen", "text": "They know how to share."}, {"from": "Jim", "text": "That’s good."}, {"from": "Jim", "text": "I’ll do my best to make a good impression."}, {"from": "Ellen", "text": "Like they say you only get one chance to make a first impression."}, {"from": "Jim", "text": "I know. They’ll like me, I promise."}, {"from": "Ellen", "text": "Oh, one thing."}, {"from": "Jim", "text": "What’s that?"}, {"from": "Ellen", "text": "Don’t wear cologne."}, {"from": "Jim", "text": "Are they allergic?"}, {"from": "Ellen", "text": "Sort of."}, {"from": "Jim", "text": "Ok. No problem."}, {"from": "Jim", "text": "------"}, {"from": "Jim", "text": "Friday Afternoon"}, {"from": "Jim", "text": "Ellen?"}, {"from": "Ellen", "text": "Hi, you all ready?"}, {"from": "Jim", "text": "I’ll be heading over in a little while."}, {"from": "Ellen", "text": "Great! They’re all looking forward to you."}, {"from": "Ellen", "text": "….to seeing you."}, {"from": "Jim", "text": "I’m looking forward to seeing them, too!"}, {"from": "Jim", "text": "So, what we having for dinner?"}, {"from": "Ellen", "text": "Steak probably."}, {"from": "Ellen", "text": "My mom loves steak. So does my dad."}, {"from": "Ellen", "text": "Well, everyone."}, {"from": "Ellen", "text": "We’re all steak eaters."}, {"from": "Jim", "text": "I guess it’s steak, then!"}, {"from": "Jim", "text": "Good thing I’m not a vegetarian!"}, {"from": "Ellen", "text": "Good thing we’re not!"}, {"from": "Jim", "text": "I bet it’s going to be great."}, {"from": "Ellen", "text": "It is, my mom’s a great cook."}, {"from": "Jim", "text": "So, should I pick you up at 6:30?"}, {"from": "Ellen", "text": "No, you could just go straight to their house."}, {"from": "Ellen", "text": "I’m helping my parents get ready."}, {"from": "Ellen", "text": "There’s a lot of work to do."}, {"from": "Jim", "text": "Yeah, I guess there would be."}, {"from": "Ellen", "text": "They’re going to barbeque."}, {"from": "Jim", "text": "Awesome! I love barbeque."}, {"from": "Ellen", "text": "You can actually come a little earlier, if you want."}, {"from": "Jim", "text": "How early?"}, {"from": "Ellen", "text": "I’ll be there at four. You could come then."}, {"from": "Ellen", "text": "Then they wouldn’t have to rush."}, {"from": "Jim", "text": "Okay. I can do that."}, {"from": "Ellen", "text": "Great! I’ll tell my mom. She’ll be happy!"}, {"from": "Ellen", "text": "So will by brothers and sisters!"}, {"from": "Ellen", "text": "They like to eat early."}, {"from": "Jim", "text": "I bet it takes time to cook that much steak."}, {"from": "Ellen", "text": "It’s getting it ready that takes the time."}, {"from": "Ellen", "text": "Before you cook it."}, {"from": "Jim", "text": "Like marinating it or something?"}, {"from": "Ellen", "text": "Just, the butchering. You know, carving it up…"}, {"from": "Jim", "text": "Wow, you make it sound like you have a whole cow there!"}, {"from": "Ellen", "text": "Hardly. I promise you, we have NO cow."}, {"from": "Jim", "text": "Well that’s a relief!"}, {"from": "Jim", "text": "This sounds like it’s going to be an awesome dinner."}, {"from": "Ellen", "text": "It will!"}, {"from": "Ellen", "text": "It’s going to be delicious."}, {"from": "Jim", "text": "Ellen, I’m really happy to be part of your life."}, {"from": "Jim", "text": "And maybe even part of your family."}, {"from": "Ellen", "text": "So are we."}, {"from": "Ellen", "text": "My mom says I have good taste in men."}]}]}, {"id": "the-doctor", "title": "The Doctor", "description": "", "genre": "horror", "episodes": [{"left": "Doctor", "right": "Josh", "description": "", "messages": [{"from": "Doctor", "text": "Hello, Josh. I’m Doctor Beslow"}, {"from": "Josh", "text": "Hi Doc – thanks for texting me."}, {"from": "Doctor", "text": "Your friend Johnny told me about you, that you have a problem."}, {"from": "Josh", "text": "Yeah, a bad problem. I’m out camping. I’m kind of in the middle of nowhere."}, {"from": "Josh", "text": "I mean really far."}, {"from": "Josh", "text": "I guess I got hurt."}, {"from": "Doctor", "text": "How so?"}, {"from": "Josh", "text": "I’m not sure, it’s like, in my ribs somewhere."}, {"from": "Doctor", "text": "And no one can help you?"}, {"from": "Josh", "text": "I’m alone. Like you couldn’t get here for days."}, {"from": "Josh", "text": "And this really hurts bad."}, {"from": "Josh", "text": "That’s why Johnny found you."}, {"from": "Doctor", "text": "You say it’s around your ribs?"}, {"from": "Josh", "text": "It’s all bruised."}, {"from": "Doctor", "text": "Sounds pretty bad."}, {"from": "Josh", "text": "Yeah, I know. What do I do."}, {"from": "Doctor", "text": "Well, it was a good thing you didn’t try to hike out."}, {"from": "Josh", "text": "But it still hurts."}, {"from": "Doctor", "text": "I’m going to have to take a better look at it."}, {"from": "Josh", "text": "What do you mean?"}, {"from": "Doctor", "text": "Do you have a knife."}, {"from": "Josh", "text": "My hunting knife…why?"}, {"from": "Doctor", "text": "You’re going to have to do something for me."}, {"from": "Josh", "text": "What do you mean, “do something?”"}, {"from": "Doctor", "text": "You’re going to have to make an incision."}, {"from": "Josh", "text": "WHAT? I can’t do that!"}, {"from": "Doctor", "text": "You want to die there?"}, {"from": "Josh", "text": "No."}, {"from": "Doctor", "text": "Then you’re going to have to make an incision."}, {"from": "Josh", "text": "What if it bleeds?"}, {"from": "Doctor", "text": "Don’t worry about that."}, {"from": "Josh", "text": "What do you mean?"}, {"from": "Doctor", "text": "Who’s the doctor here?"}, {"from": "Josh", "text": "You, but won’t it bleed?"}, {"from": "Doctor", "text": "Of course it will bleed, but that’s my concern."}, {"from": "Doctor", "text": "Make the incision."}, {"from": "Doctor", "text": "From left to right."}, {"from": "Doctor", "text": "Three…no, four inches long."}, {"from": "Doctor", "text": "Then show me what you’ve done."}, {"from": "Josh", "text": "Are you sure about this?"}, {"from": "Doctor", "text": "Very sure. I’m a doctor, remember."}, {"from": "Josh", "text": "You sure there isn’t another way?"}, {"from": "Doctor", "text": "Make the incision, Josh."}, {"from": "Josh", "text": "I’ll try"}, {"from": "Josh", "text": "Ok, I made the incision."}, {"from": "Doctor", "text": "Very good."}, {"from": "Doctor", "text": "Now pull it apart."}, {"from": "Josh", "text": "What?"}, {"from": "Doctor", "text": "Pull it apart, so you can see under the skin."}, {"from": "Josh", "text": "But that’s going to hurt!"}, {"from": "Doctor", "text": "Would you rather die?"}, {"from": "Josh", "text": "No."}, {"from": "Doctor", "text": "Pull the skin apart."}, {"from": "Josh", "text": "It’s going to hurt so much."}, {"from": "Doctor", "text": "Would you rather die?"}, {"from": "Josh", "text": "No."}, {"from": "Doctor", "text": "Pull it apart."}, {"from": "Doctor", "text": "As wide as you can!"}, {"from": "Josh", "text": "It doesn’t open that much."}, {"from": "Doctor", "text": "You need to make a bigger incision."}, {"from": "Josh", "text": "BIGGER???"}, {"from": "Doctor", "text": "About twice as long."}, {"from": "Josh", "text": "Please, I’d rather not."}, {"from": "Doctor", "text": "You have to."}, {"from": "Doctor", "text": "Just do it quickly."}, {"from": "Josh", "text": "I’m bleeding all over the place."}, {"from": "Doctor", "text": "Did you do it?"}, {"from": "Josh", "text": "Yeah."}, {"from": "Doctor", "text": "Good."}, {"from": "Josh", "text": "What do you think is wrong with me, Doctor?"}, {"from": "Doctor", "text": "You’ve got a pretty bad injury."}, {"from": "Josh", "text": "I know, but, like, what do I do?"}, {"from": "Doctor", "text": "I think we may have to operate."}, {"from": "Josh", "text": "Operate? How?"}, {"from": "Doctor", "text": "You’re going to have to operate on yourself."}, {"from": "Josh", "text": "What???"}, {"from": "Doctor", "text": "I think you can."}, {"from": "Doctor", "text": "You don’t have a choice. With a wound like that, you can bleed to death."}, {"from": "Josh", "text": "But you told me to do it!"}, {"from": "Doctor", "text": "And now I want you to do what I’m saying."}, {"from": "Josh", "text": "I can’t operate on myself!"}, {"from": "Josh", "text": "Can’t you airlift in and do it yourself?"}, {"from": "Doctor", "text": "Don’t be ridiculous."}, {"from": "Josh", "text": "More ridiculous than me operating on myself?"}, {"from": "Doctor", "text": "It’s just going to take some concentration."}, {"from": "Josh", "text": "It’s going to take a LOT more than that!"}, {"from": "Doctor", "text": "Do what I say! I’m the doctor!"}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "What kind of a doctor?"}, {"from": "Doctor", "text": "Are you questioning me?"}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "Yeah. What kind of a doctor?"}, {"from": "Doctor", "text": "Maybe I should just leave you like that."}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "You would do that?"}, {"from": "Doctor", "text": "I’m a doctor."}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "I don’t think you are."}, {"from": "Doctor", "text": "You have a big incision in your stomach."}, {"from": "Doctor", "text": "So you better hope I’m a doctor."}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "Are you a doctor?"}, {"from": "Doctor", "text": "I’m the only chance you have."}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "But are you a doctor?"}, {"from": "Doctor", "text": "Now send me another picture."}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "How come you’re not answering me?"}, {"from": "Doctor", "text": "Why else would I be asking you to cut yourself open?"}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "PLEASE tell me you’re a doctor"}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "Hello?"}, {"from": "Doctor", "text": "John"}, {"from": "Doctor", "text": "Hello?"}]}]}, {"id": "skinless", "title": "Skinless", "description": "", "genre": "horror", "episodes": [{"left": "Joe", "right": "Marcus", "description": "", "messages": [{"from": "Joe", "text": "I just discovered something."}, {"from": "Marcus", "text": "What?"}, {"from": "Joe", "text": "It’s going to sound weird – just warning you."}, {"from": "Marcus", "text": "What is it?"}, {"from": "Joe", "text": "Well, see, I’ve had this scab on my arm for the longest time."}, {"from": "Marcus", "text": "Yeah, so?"}, {"from": "Joe", "text": "You know how you pick at scabs sometime?"}, {"from": "Marcus", "text": "Yeah."}, {"from": "Joe", "text": "Well I was doing it and it sort of opened."}, {"from": "Marcus", "text": "What do you mean?"}, {"from": "Joe", "text": "You know, like opened up on the wound."}, {"from": "Marcus", "text": "That must have hurt."}, {"from": "Joe", "text": "Well, that’s just the thing. It didn’t."}, {"from": "Marcus", "text": "It wasn’t healed?"}, {"from": "Joe", "text": "Now, you could see the blood part underneath."}, {"from": "Marcus", "text": "Weird"}, {"from": "Joe", "text": "So, since it didn’t hurt, I peeled it a little more."}, {"from": "Marcus", "text": "Peeled it?"}, {"from": "Joe", "text": "Like, next to the wound."}, {"from": "Marcus", "text": "What do you mean"}, {"from": "Joe", "text": "Like where there’s just skin."}, {"from": "Marcus", "text": "You peeled your skin?"}, {"from": "Joe", "text": "Yeah, and it didn’t hurt!"}, {"from": "Marcus", "text": "How much did you peel?"}, {"from": "Joe", "text": "So far? Like halfway up my arm."}, {"from": "Marcus", "text": "And it doesn’t hurt?"}, {"from": "Joe", "text": "No."}, {"from": "Marcus", "text": "You peeled off half the skin on your arm?"}, {"from": "Joe", "text": "Yeah. It looks kind of cool, actually."}, {"from": "Joe", "text": "All red and shiny."}, {"from": "Marcus", "text": "I don’t know if you should do that."}, {"from": "Joe", "text": "It doesn’t hurt, though."}, {"from": "Joe", "text": "I’m almost up to my shoulder, now."}, {"from": "Marcus", "text": "You really shouldn’t do that."}, {"from": "Joe", "text": "Well I have to do the other arm now, just to even it out."}, {"from": "Marcus", "text": "Maybe you should stop."}, {"from": "Joe", "text": "I LOVE this!"}, {"from": "Marcus", "text": "It sounds gross."}, {"from": "Joe", "text": "It’s like the most awesome tattoo you could get."}, {"from": "Joe", "text": "You know what I should do?"}, {"from": "Marcus", "text": "What"}, {"from": "Joe", "text": "Peel my face!"}, {"from": "Marcus", "text": "What if it doesn’t grow back?"}, {"from": "Joe", "text": "I don’t care. This is going to look great."}, {"from": "Joe", "text": "You should try it."}, {"from": "Marcus", "text": "I don’t think so."}, {"from": "Joe", "text": "You should! Peel!"}, {"from": "Joe", "text": "My face looks awesome"}, {"from": "Marcus", "text": "I don’t know."}, {"from": "Joe", "text": "You have to come here."}, {"from": "Marcus", "text": "Why? I’m not doing it."}, {"from": "Joe", "text": "I want to peel everything. I need you to help me."}, {"from": "Marcus", "text": "You want me to help you peel your skin off."}, {"from": "Joe", "text": "Yeah!"}, {"from": "Marcus", "text": "I don’t think I could do that."}, {"from": "Joe", "text": "Yeah, you can."}, {"from": "Joe", "text": "I want to be totally SKINLESS."}, {"from": "Marcus", "text": "That just sounds gross."}, {"from": "Joe", "text": "Don’t you want to be skinless?"}, {"from": "Marcus", "text": "No."}, {"from": "Joe", "text": "I do. I want to be totally skinless."}, {"from": "Joe", "text": "It’s a little sticky, but I could get used to that."}, {"from": "Joe", "text": "So are you coming?"}, {"from": "Marcus", "text": "I don’t know…"}, {"from": "Joe", "text": "Then I’ll come there!"}, {"from": "Marcus", "text": "No…maybe that wouldn’t be a good idea."}, {"from": "Joe", "text": "Why not?"}, {"from": "Marcus", "text": "You know…the neighbors."}, {"from": "Joe", "text": "What about them?"}, {"from": "Marcus", "text": "They might not like the way you look."}, {"from": "Joe", "text": "Well, that’s not very fair."}, {"from": "Marcus", "text": "It is kind of gross."}, {"from": "Joe", "text": "You’re being unfair."}, {"from": "Joe", "text": "Just because I’m skinless."}, {"from": "Joe", "text": "I just finished my legs."}, {"from": "Joe", "text": "It’s still sticking though."}, {"from": "Marcus", "text": "Sticking?"}, {"from": "Joe", "text": "Yes, you know, it’s all bloody and sticky."}, {"from": "Joe", "text": "I’m sticking to the chair."}, {"from": "Marcus", "text": "You can’t just lift if off."}, {"from": "Joe", "text": "Its like glue."}, {"from": "Marcus", "text": "What if you just pull it?"}, {"from": "Joe", "text": "I’m trying."}, {"from": "Marcus", "text": "And?"}, {"from": "Joe", "text": "It’s not coming off."}, {"from": "Marcus", "text": "Just give it yank."}, {"from": "Joe", "text": "Ummm I just did."}, {"from": "Marcus", "text": "And?"}, {"from": "Joe", "text": "It’s not coming off the chair?"}, {"from": "Marcus", "text": "Then what’s it doing?"}, {"from": "Joe", "text": "It’s coming off the bone."}]}]}, {"id": "last-train-out", "title": "Last Train Out", "description": "", "genre": "thriller", "episodes": [{"left": "Darla", "right": "Andrew", "description": "", "messages": [{"from": "Darla", "text": "The train stopped"}, {"from": "Andrew", "text": "I know."}, {"from": "Darla", "text": "Why did the train stop?"}, {"from": "Andrew", "text": "We’re at the border."}, {"from": "Darla", "text": "Do you think they’re going to check?"}, {"from": "Andrew", "text": "Yeah. Especially now, with the revolution."}, {"from": "Darla", "text": "What do we do?"}, {"from": "Andrew", "text": "Just stay calm."}, {"from": "Darla", "text": "What if they search the whole train?"}, {"from": "Darla", "text": "What if they check papers?"}, {"from": "Andrew", "text": "They haven’t done that yet."}, {"from": "Andrew", "text": "Maybe we’ll be lucky."}, {"from": "Darla", "text": "But what if they do?"}, {"from": "Andrew", "text": "Just pretend like you’re looking for your papers. Like you misplaced them."}, {"from": "Andrew", "text": "They’re not going to delay the whole train for one person."}, {"from": "Darla", "text": "Do they know what we look like?"}, {"from": "Darla", "text": "They must have our pictures."}, {"from": "Andrew", "text": "I don’t know. These are just guards, anyway."}, {"from": "Andrew", "text": "They won’t have our pictures all the way out here."}, {"from": "Darla", "text": "But they have guns."}, {"from": "Andrew", "text": "Don’t panic."}, {"from": "Darla", "text": "They’re getting on the train."}, {"from": "Darla", "text": "Are you still in the third car?"}, {"from": "Andrew", "text": "Yeah, are you still in the first?"}, {"from": "Darla", "text": "Yes"}, {"from": "Darla", "text": "They look serious."}, {"from": "Andrew", "text": "That’s their job."}, {"from": "Darla", "text": "To look serious?"}, {"from": "Andrew", "text": "To scare you."}, {"from": "Darla", "text": "Well, they’re doing their job well."}, {"from": "Andrew", "text": "Remember, just act nervous."}, {"from": "Darla", "text": "I don’t need to act."}, {"from": "Andrew", "text": "Just keep searching your things."}, {"from": "Andrew", "text": "They’ll be angry, but they’ll get bored quick."}, {"from": "Andrew", "text": "And then they’ll move on."}, {"from": "Darla", "text": "What about you?"}, {"from": "Andrew", "text": "They’ll get to me eventually."}, {"from": "Darla", "text": "You can’t do the same thing."}, {"from": "Andrew", "text": "I’ll think of something. These guys aren’t very smart."}, {"from": "Darla", "text": "They’re almost here."}, {"from": "Andrew", "text": "You’ll get through this. Don’t worry."}, {"from": "Andrew", "text": "Are you okay?"}, {"from": "Darla", "text": "That was easier than I thought."}, {"from": "Darla", "text": "They didn’t seem to care. Not much, anyway."}, {"from": "Andrew", "text": "That’s good. We’ll be okay, I think."}, {"from": "Darla", "text": "When they come to you, just act like you don’t speak the language."}, {"from": "Darla", "text": "And that you don’t understand them."}, {"from": "Darla", "text": "They’ll just move on."}, {"from": "Andrew", "text": "I don’t even think I need to do that."}, {"from": "Darla", "text": "They’ll be at your seat in a few minutes."}, {"from": "Andrew", "text": "I’m not worried."}, {"from": "Darla", "text": "You shouldn’t be. They’re really not checking that closely."}, {"from": "Darla", "text": "If I were you, I would just be friendly."}, {"from": "Andrew", "text": "Well, I don’t know about friendly."}, {"from": "Darla", "text": "Friendly’s good. They’ve got guns, remember."}, {"from": "Darla", "text": "Obviously, you can’t try anything."}, {"from": "Andrew", "text": "I’m not about to."}, {"from": "Andrew", "text": "They just opened the door to my car."}, {"from": "Darla", "text": "They’re almost there?"}, {"from": "Andrew", "text": "Well, I’m all the way in the back, they have to check everyone before me."}, {"from": "Darla", "text": "Yeah, it might be a few minutes."}, {"from": "Andrew", "text": "That’s strange."}, {"from": "Darla", "text": "What?"}, {"from": "Andrew", "text": "They’re not really checking anyone."}, {"from": "Andrew", "text": "They’re looking at them, but they’re not checking papers."}, {"from": "Andrew", "text": "I think they’re looking for someone special."}, {"from": "Darla", "text": "Probably."}, {"from": "Andrew", "text": "I guess they haven’t found who they’re looking for."}, {"from": "Darla", "text": "Not yet."}, {"from": "Andrew", "text": "They’ll be done with this in a minute. What a close call!"}, {"from": "Darla", "text": "Remember, Andrew. Be friendly."}, {"from": "Darla", "text": "The best thing to do is not put up a fight."}, {"from": "Andrew", "text": "What do you mean?"}, {"from": "Darla", "text": "They’re looking for you, Andrew."}, {"from": "Andrew", "text": "What do you mean????"}, {"from": "Darla", "text": "Just go with them. You’ll be okay."}, {"from": "Andrew", "text": "Wait…did you know about this?"}, {"from": "Darla", "text": "I know about you, Andrew."}, {"from": "Darla", "text": "I’ve known about you for a long time."}, {"from": "Darla", "text": "No one likes a traitor, Andrew."}, {"from": "Darla", "text": "Now do as you’re told and go with the guards."}, {"from": "Darla", "text": "Understand?"}]}]}];
const GENRES = { all: "Все", horror: "Ужасы", thriller: "Триллер" };
const store = {
  get(k, d) { try { const v = localStorage.getItem("squeal:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("squeal:" + k, JSON.stringify(v)); } catch {} },
};
const app = document.getElementById("app");
let genre = store.get("genre", "all");
const minutes = s => Math.max(1, Math.round(s.episodes.reduce((n, e) => n + e.messages.length, 0) * 4 / 60));
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function library() {
  const list = STORIES.filter(s => genre === "all" || s.genre === genre);
  app.innerHTML = `
    <section class="lib">
      <div class="brand"><h1>Sque<span>a</span>l</h1><p>истории в переписке</p></div>
      <div class="chips" role="group" aria-label="Жанр">${Object.entries(GENRES).map(([k, v]) =>
        `<button class="chip" id="g-${k}" aria-pressed="${k === genre}" data-g="${k}">${v}</button>`).join("")}</div>
      <div class="cards">${list.map(s => {
        const p = progress(s);
        return `<button class="card" id="s-${s.id}" data-id="${s.id}">
          <span class="tag">${GENRES[s.genre] || s.genre}</span>
          <h2>${esc(s.title)}</h2>
          <p>${esc(s.description)}</p>
          <span class="meta"><span>${s.episodes.length > 1 ? s.episodes.length + " части" : "1 часть"}</span><span>~${minutes(s)} мин</span>${p.done ? "<b>прочитано</b>" : p.pct ? `<b>${p.pct}%</b>` : ""}</span>
          <span class="bar"><i style="width:${p.pct}%"></i></span>
        </button>`; }).join("")}</div>
      <p class="note">Тестовая веб-версия приложения Squeal. Истории — из архива 2018 года, текст на английском. Тапайте, чтобы получить следующее сообщение.</p>
    </section>`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { genre = b.dataset.g; store.set("genre", genre); library(); });
  app.querySelectorAll(".card").forEach(b => b.onclick = () => openStory(b.dataset.id));
}

function progress(s) {
  const st = store.get("p:" + s.id, { ep: 0, i: 0 });
  const total = s.episodes.reduce((n, e) => n + e.messages.length, 0);
  const read = s.episodes.slice(0, st.ep).reduce((n, e) => n + e.messages.length, 0) + st.i;
  return { pct: Math.min(100, Math.round(read * 100 / total)), done: read >= total };
}

let timer = null;
function openStory(id, epIndex) {
  const s = STORIES.find(x => x.id === id);
  let st = store.get("p:" + id, { ep: 0, i: 0 });
  if (epIndex != null) st = { ep: epIndex, i: 0 };
  if (st.ep >= s.episodes.length) st = { ep: 0, i: 0 };
  const ep = s.episodes[st.ep];
  app.innerHTML = `
    <section class="chat">
      <div class="head"><button class="back" id="back" aria-label="К историям">‹</button>
        <div class="avatar">${esc(ep.left[0])}</div>
        <div class="who"><b>${esc(ep.left)}</b><small id="status">в сети</small></div>
        <span class="ep">${s.episodes.length > 1 ? "Часть " + (st.ep + 1) + " из " + s.episodes.length : ""}</span></div>
      <div class="log" id="log" aria-live="polite"><div class="day">${esc(ep.description || s.description)}</div></div>
      <div class="foot" id="foot"></div>
    </section>`;
  const log = document.getElementById("log"), foot = document.getElementById("foot"), status = document.getElementById("status");
  document.getElementById("back").onclick = () => { clearTimeout(timer); library(); };
  const add = m => {
    const d = document.createElement("div");
    d.className = "msg " + (m.from === ep.right ? "me" : "them");
    d.textContent = m.text;
    log.appendChild(d);
  };
  for (let k = 0; k < st.i; k++) add(ep.messages[k]);
  log.scrollTop = log.scrollHeight;
  let busy = false;
  const save = () => store.set("p:" + id, st);

  function controls() {
    if (st.i >= ep.messages.length) {
      const last = st.ep + 1 >= s.episodes.length;
      log.insertAdjacentHTML("beforeend", `<div class="end"><strong>${last ? "Конец" : "Продолжение следует"}</strong><span>${esc(s.title)}${s.episodes.length > 1 ? " · часть " + (st.ep + 1) : ""}</span></div>`);
      log.scrollTop = log.scrollHeight;
      foot.innerHTML = `<div class="row">${last ? "" : `<button class="tap" id="next">Следующая часть</button>`}<button class="tap" id="again">${last ? "Читать заново" : "С начала"}</button></div>`;
      const next = document.getElementById("next");
      if (next) next.onclick = () => { store.set("p:" + id, { ep: st.ep + 1, i: 0 }); openStory(id, st.ep + 1); };
      document.getElementById("again").onclick = () => { store.set("p:" + id, { ep: 0, i: 0 }); openStory(id, 0); };
      if (last) { st = { ep: s.episodes.length, i: 0 }; save(); }
      return;
    }
    foot.innerHTML = `<button class="tap" id="tap">Нажмите, чтобы продолжить</button>`;
    document.getElementById("tap").onclick = step;
  }

  function step() {
    if (busy || st.i >= ep.messages.length) return;
    const m = ep.messages[st.i];
    if (m.from === ep.right) { add(m); st.i++; save(); log.scrollTop = log.scrollHeight; return controls(); }
    busy = true;
    status.textContent = "печатает…";
    const t = document.createElement("div");
    t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(t); log.scrollTop = log.scrollHeight;
    const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 150 : Math.min(1800, 450 + m.text.length * 22);
    timer = setTimeout(() => { t.remove(); add(m); st.i++; save(); status.textContent = "в сети"; busy = false; log.scrollTop = log.scrollHeight; controls(); }, delay);
  }
  log.onclick = step;
  controls();
}

library();
</script>
